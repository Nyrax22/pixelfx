<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ruin Diver</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0810; --panel: rgba(16, 12, 26, 0.92); --panel2: #1c1630; --line: #3a3054; --ink: #f4ecff; --dim: #a89cc0;
  --gold: #ffcf4a; --common: #a8a39a; --uncommon: #6fd36a; --rare: #5aa8ff; --epic: #c27bff; --legendary: #ffc63a;
  --go: #ff8a2a; --go2: #ffb04a; --ad: #6a5cff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; color: var(--ink); }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #000; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- HUD: small and see-through, out of the way of the cave */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { position: absolute; }
.hud-box { background: rgba(10, 8, 16, 0.62); border: 0.1em solid rgba(58, 48, 84, 0.8); border-radius: 0.5em; padding: 0.3em 0.55em; }
#topLeft { left: 0.6em; top: 0.6em; display: flex; flex-direction: column; gap: 0.4em; align-items: flex-start; }
#hCoinsBox { font-weight: 800; font-size: 1.15em; display: flex; align-items: center; gap: 0.3em; }
#hCoinsBox.bump { animation: bump 0.25s; }
#hDepthBox { min-width: 8em; }
#hDepth { font-size: 1.7em; font-weight: 900; line-height: 1; }
#hDepth small { font-size: 0.55em; margin-left: 0.1em; }
#hZone { font-size: 0.75em; color: var(--dim); margin-top: 0.15em; }
#hExit { font-size: 0.75em; color: #9affb0; font-weight: 800; }
#gauge { left: 0.9em; top: 9.4em; bottom: 1.4em; width: 7em; }
#gaugeBar { position: absolute; left: 0; top: 0; bottom: 0; width: 0.5em; background: rgba(10, 8, 16, 0.7); border: 0.1em solid var(--line); border-radius: 0.3em; }
#gaugeFill { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(#5aa8ff, #2f5aff); border-radius: 0.2em; }
.gmark { position: absolute; left: 0; display: flex; align-items: center; gap: 0.25em; font-size: 0.65em; color: var(--dim); transform: translateY(-50%); white-space: nowrap; text-shadow: 0 0.1em 0 #000; }
.gmark i { display: block; width: 1em; height: 0.15em; background: currentColor; }
.gmark.best { color: var(--gold); } .gmark.zone { color: #c8a080; } .gmark.seal { color: #6ad0ff; } .gmark.exit { color: #9affb0; }
#gaugeMe { position: absolute; left: -0.35em; width: 1.2em; height: 1.2em; transform: translateY(-50%); background: var(--go2); border: 0.15em solid #fff; border-radius: 50%; box-shadow: 0 0 0.6em var(--go); }
#rightCol { right: 0.6em; top: 0.6em; width: 9.6em; display: flex; flex-direction: column; gap: 0.4em; }
#rightCol .row1 { display: flex; justify-content: space-between; align-items: center; }
#hearts { font-size: 1.35em; letter-spacing: 0.05em; text-shadow: 0 0.08em 0 #000; }
#hearts .on { color: #ff4a5a; } #hearts .off { color: #3a2a3a; }
#hearts.hit { animation: shake 0.35s; }
#pauseBtn { pointer-events: auto; width: 2.2em; height: 2.2em; border-radius: 0.5em; background: rgba(10, 8, 16, 0.62); border: 0.1em solid var(--line); font-weight: 900; }
.label { font-size: 0.75em; color: var(--dim); margin-bottom: 0.2em; display: flex; justify-content: space-between; }
#lanternBar { height: 0.7em; background: #1a1424; border-radius: 0.35em; overflow: hidden; border: 0.1em solid var(--line); }
#lanternFill { height: 100%; background: linear-gradient(90deg, #ff9a2a, #ffe06a); transition: width 0.1s linear; }
#lanternBox.low #lanternFill { background: #ff4a3a; animation: blink 0.4s infinite; }
#bagSlots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.2em; }
.slot { aspect-ratio: 1; background: rgba(26, 20, 36, 0.8); border: 0.1em solid var(--line); border-radius: 0.3em; display: grid; place-items: center; }
.slot img { width: 80%; image-rendering: pixelated; }
.slot.filled { animation: pop 0.3s; }
.slot.r-uncommon { border-color: var(--uncommon); } .slot.r-rare { border-color: var(--rare); } .slot.r-epic { border-color: var(--epic); box-shadow: 0 0 0.4em var(--epic); }
#ropeTx { font-size: 0.85em; font-weight: 800; align-self: flex-start; }
#stick { width: 5.4em; height: 5.4em; margin: -2.7em 0 0 -2.7em; border-radius: 50%; border: 0.15em solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.06); display: grid; place-items: center; }
#stickKnob { width: 2.4em; height: 2.4em; border-radius: 50%; background: rgba(255, 255, 255, 0.4); }
#touchPad { right: 1em; bottom: 1em; display: flex; align-items: flex-end; gap: 0.8em; }
#touchPad button { pointer-events: auto; border-radius: 50%; font-weight: 900; color: #fff; touch-action: none; }
#jumpBtn { width: 5.6em; height: 5.6em; background: rgba(255, 138, 42, 0.55); border: 0.18em solid rgba(255, 200, 120, 0.8); font-size: 1em; }
#ropeBtn { width: 3.8em; height: 3.8em; background: rgba(90, 168, 255, 0.4); border: 0.15em solid rgba(160, 200, 255, 0.7); position: relative; margin-bottom: 2.6em; }
#ropeBtn span { font-size: 1.4em; }
#ropeBtn b { position: absolute; right: -0.2em; top: -0.2em; background: #1a1424; border-radius: 99em; font-size: 0.75em; padding: 0.05em 0.4em; }
#resTitle .dead { color: #ff7a8a; }
@keyframes shake { 25% { transform: translateX(-0.2em); } 75% { transform: translateX(0.2em); } }

/* ---------- overlays */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; font-weight: 900; font-size: 1.5em; text-shadow: 0 0.12em 0 #000, 0 0 0.6em #000; white-space: nowrap; opacity: 0; }
#toast.show { animation: toast 1.6s forwards; }
#banner { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; opacity: 0; }
#banner.show { animation: banner 2.4s forwards; }
#banner b { display: block; font-size: 2.2em; font-weight: 900; text-shadow: 0 0.1em 0 #000, 0 0 1em #000; }
#banner span { font-size: 1em; color: var(--dim); text-shadow: 0 0.1em 0 #000; }
#ready { flex-direction: column; gap: 0.6em; padding-top: 9em; cursor: pointer; }
#ready .logo { font-size: 3.2em; font-weight: 900; letter-spacing: 0.04em; color: #ffe0a0; text-shadow: 0 0.08em 0 #6a2a1a, 0 0.2em 0.4em #000; position: absolute; top: 2.2em; }
#ready .tap { font-size: 1.6em; font-weight: 900; padding: 0.4em 1.2em; border-radius: 99em; background: rgba(10, 8, 16, 0.75); border: 0.12em solid var(--go2); animation: pulse 1.1s infinite; }
#hint { position: absolute; left: 50%; bottom: 3em; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 0.3em; font-weight: 800; text-shadow: 0 0.1em 0 #000; }
#hint .hand { font-size: 2.4em; animation: sway 1.2s ease-in-out infinite; }

.panel { background: var(--panel); border: 0.12em solid var(--line); border-radius: 0.9em; box-shadow: 0 0.6em 2em rgba(0, 0, 0, 0.6); }
#results, #book { background: rgba(6, 4, 12, 0.55); }
#resultsPanel { width: 46em; height: 25.4em; display: grid; grid-template-columns: 1fr 17.5em; grid-template-rows: 1fr auto; gap: 0.7em; padding: 0.9em; }
#resLeft { display: flex; flex-direction: column; min-height: 0; }
#resTitle { font-size: 1.9em; font-weight: 900; color: #ffe0a0; display: flex; align-items: baseline; gap: 0.4em; }
#resTitle small { font-size: 0.5em; color: var(--dim); font-weight: 700; }
#resRecord { font-size: 0.45em; color: var(--gold); background: #3a2a08; padding: 0.15em 0.5em; border-radius: 99em; }
#lootGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.45em; margin-top: 0.5em; align-content: start; flex: 1; min-height: 0; overflow: hidden; }
.card { position: relative; background: var(--panel2); border: 0.13em solid var(--line); border-radius: 0.5em; padding: 0.3em 0.2em 0.25em; text-align: center; opacity: 0; transform: scale(0.6) rotateY(90deg); }
.card.in { animation: flip 0.35s forwards; }
.card img { width: 72%; image-rendering: pixelated; display: block; margin: 0 auto; }
.card .nm { font-size: 0.68em; line-height: 1.15; height: 2.3em; overflow: hidden; color: var(--ink); }
.card .badge { position: absolute; top: -0.55em; right: -0.4em; font-size: 0.65em; font-weight: 900; background: #ff3a5a; color: #fff; padding: 0.1em 0.4em; border-radius: 99em; animation: pulse 0.9s infinite; }
.card .badge.var { background: linear-gradient(90deg, #ff4a4a, #ffcf4a, #4aff8a, #4ab0ff, #c24aff); }
.card .st { font-size: 0.62em; color: var(--gold); }
.card .cnt { position: absolute; left: 0.3em; top: 0.2em; font-size: 0.75em; font-weight: 900; color: #fff; text-shadow: 0 0.1em 0 #000; }
.r-common { border-color: var(--common) !important; } .r-uncommon { border-color: var(--uncommon) !important; } .r-rare { border-color: var(--rare) !important; box-shadow: 0 0 0.5em rgba(90, 168, 255, 0.5); } .r-epic { border-color: var(--epic) !important; box-shadow: 0 0 0.8em rgba(194, 123, 255, 0.7); } .r-legendary { border-color: var(--legendary) !important; }
#resEmpty { color: var(--dim); margin-top: 1em; }
#resCoins { display: flex; flex-wrap: wrap; gap: 0.3em 0.9em; font-size: 0.85em; color: var(--dim); margin-top: 0.4em; }
#resCoins b { color: var(--gold); }
#resTotal { font-size: 1.35em; font-weight: 900; color: var(--gold); }
#droppedRow { margin-top: 0.4em; display: flex; align-items: center; gap: 0.5em; font-size: 0.85em; background: #2a1420; border: 0.1em solid #5a2a3a; border-radius: 0.5em; padding: 0.3em 0.5em; }
#droppedRow .ic { display: flex; gap: 0.2em; }
#droppedRow img { width: 1.6em; image-rendering: pixelated; }
#droppedRow .sp { flex: 1; text-align: right; color: var(--dim); }
.btn { border-radius: 0.6em; font-weight: 900; padding: 0.55em 0.9em; }
.btn-std { background: #3a3054; box-shadow: 0 0.2em 0 #1a1428; }
.btn-ad { background: linear-gradient(#7a6cff, #5446d6); box-shadow: 0 0.2em 0 #2a2080; }
.btn-ad:disabled, .btn-std:disabled { opacity: 0.45; cursor: default; }
.btn-go { background: linear-gradient(var(--go2), var(--go)); color: #2a1004; box-shadow: 0 0.25em 0 #8a3a0a; font-size: 1.35em; }
.btn:active:not(:disabled) { transform: translateY(0.12em); }
#resRight { display: flex; flex-direction: column; gap: 0.35em; min-height: 0; }
#resRight h3, #bookSide h3 { margin: 0 0 0.1em; font-size: 1em; display: flex; justify-content: space-between; align-items: baseline; }
#resRight h3 small { color: var(--gold); font-weight: 800; }
.up { display: grid; grid-template-columns: 2em 1fr auto; align-items: center; gap: 0.5em; background: var(--panel2); border: 0.1em solid var(--line); border-radius: 0.55em; padding: 0.3em 0.45em; }
.up .ic { font-size: 1.4em; text-align: center; }
.up .tx { font-size: 0.78em; line-height: 1.2; }
.up .tx b { font-size: 1.1em; }
.up .tx span { color: var(--dim); }
.up .tx em { color: #8aff8a; font-style: normal; }
.up button { min-width: 4.6em; font-size: 0.85em; padding: 0.45em 0.4em; border-radius: 0.45em; background: #3a3054; color: var(--dim); font-weight: 900; }
.up.can { border-color: var(--gold); }
.up.can button { background: linear-gradient(#ffd84a, #f0a020); color: #2a1404; animation: glow 1.2s infinite; }
.up.locked { opacity: 0.55; }
.up.bought { animation: pop 0.35s; }
#goal { font-size: 0.8em; color: var(--gold); text-align: center; min-height: 1.2em; }
#resBottom { grid-column: 1 / -1; display: flex; gap: 0.6em; align-items: stretch; }
#bookBtn { position: relative; background: #2a2440; box-shadow: 0 0.2em 0 #14102a; font-size: 1.05em; }
#bookBtn .dot { position: absolute; top: -0.4em; right: -0.4em; background: #ff3a5a; font-size: 0.7em; padding: 0.1em 0.45em; border-radius: 99em; }
#bookBtn small { color: var(--dim); font-weight: 700; margin-left: 0.3em; }
#doubleBtn { flex: 0 0 13em; font-size: 1.05em; }
#diveBtn { flex: 1; }

#bookPanel { width: 46em; height: 25.4em; display: grid; grid-template-columns: 1fr 15em; grid-template-rows: auto 1fr; gap: 0.6em; padding: 0.9em; }
#bookHead { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.6em; }
#bookHead h2 { margin: 0; font-size: 1.5em; }
#bookPct { flex: 1; height: 0.8em; background: #1a1424; border-radius: 99em; overflow: hidden; border: 0.1em solid var(--line); position: relative; }
#bookPctFill { height: 100%; background: linear-gradient(90deg, #5aa8ff, #c27bff); }
#bookPctTx { font-weight: 900; color: var(--gold); min-width: 3.4em; text-align: right; }
#bookClose { width: 2.4em; height: 2.4em; border-radius: 0.5em; background: #3a3054; font-weight: 900; }
#bookMain { display: flex; flex-direction: column; min-height: 0; gap: 0.5em; }
#tabs { display: flex; gap: 0.4em; }
.tab { padding: 0.35em 0.8em; border-radius: 0.5em 0.5em 0 0; background: #221c36; color: var(--dim); font-weight: 800; font-size: 0.9em; }
.tab.on { background: #3a3054; color: var(--ink); }
.tab:disabled { opacity: 0.5; }
#bookGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.45em; flex: 1; align-content: start; }
.bc { position: relative; background: var(--panel2); border: 0.13em solid var(--line); border-radius: 0.5em; padding: 0.25em; text-align: center; cursor: pointer; }
.bc img { width: 58%; image-rendering: pixelated; display: block; margin: 0 auto; }
.bc .nm { font-size: 0.66em; height: 1.3em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bc .st { font-size: 0.62em; color: var(--gold); height: 1.1em; }
.bc.unknown .nm, .bc.seen .nm { color: var(--dim); }
.bc.sel { outline: 0.15em solid #fff; }
.bc .vb { position: absolute; top: 0.2em; left: 0.3em; font-size: 0.7em; }
#bookSide { background: var(--panel2); border-radius: 0.6em; padding: 0.7em; display: flex; flex-direction: column; gap: 0.4em; overflow: hidden; }
#detail img { width: 5em; image-rendering: pixelated; display: block; margin: 0 auto 0.3em; }
#detail .nm { font-weight: 900; font-size: 1.1em; text-align: center; }
#detail .rr { text-align: center; font-size: 0.8em; font-weight: 800; }
#detail p { font-size: 0.82em; color: var(--dim); margin: 0.3em 0; line-height: 1.35; }
#detail .meta { font-size: 0.78em; display: flex; justify-content: space-between; color: var(--dim); }
.set { font-size: 0.78em; background: #120e20; border-radius: 0.45em; padding: 0.35em 0.5em; }
.set b { display: flex; justify-content: space-between; }
.set.done { border: 0.1em solid var(--gold); }
.set .bn { color: #8aff8a; font-size: 0.95em; }
.set .ics { display: flex; gap: 0.2em; margin-top: 0.2em; }
.set .ics img { width: 1.4em; image-rendering: pixelated; }

.modal { flex-direction: column; gap: 0.8em; background: rgba(6, 4, 12, 0.6); }
.modal .panel { padding: 1.2em 1.4em; text-align: center; display: flex; flex-direction: column; gap: 0.8em; min-width: 22em; max-width: 34em; }
.modal .row .btn { white-space: nowrap; }
.modal h2 { margin: 0; font-size: 1.6em; }
.modal .row { display: flex; gap: 0.6em; justify-content: center; }
.modal .row .btn { flex: 1; font-size: 1.05em; padding: 0.7em 0.6em; }
.modal .small { font-size: 0.8em; color: var(--dim); }
#setPop .panel { border-color: var(--gold); }
#setPop .ics { display: flex; gap: 0.4em; justify-content: center; }
#setPop .ics img { width: 3em; image-rendering: pixelated; }
#adBox .bar { height: 0.5em; background: #1a1424; border-radius: 99em; overflow: hidden; }
#adBox .bar i { display: block; height: 100%; width: 0; background: var(--ad); }
#noSave { position: absolute; left: 50%; bottom: 0.4em; transform: translateX(-50%); font-size: 0.7em; color: #ffb0a0; background: rgba(40, 10, 10, 0.8); padding: 0.2em 0.6em; border-radius: 0.4em; pointer-events: none; }
#rotate { position: fixed; inset: 0; background: var(--bg); color: var(--ink); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font: 700 18px system-ui, sans-serif; z-index: 10; }
#rotate div { font-size: 48px; animation: tilt 1.6s infinite; }

@keyframes bump { 50% { transform: scale(1.15); } }
@keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes blink { 50% { opacity: 0.35; } }
@keyframes pulse { 50% { transform: scale(1.06); } }
@keyframes glow { 50% { filter: brightness(1.25); } }
@keyframes sway { 0%, 100% { transform: translateX(-1.2em); } 50% { transform: translateX(1.2em); } }
@keyframes flip { to { opacity: 1; transform: none; } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 0.6em); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -0.6em); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } 12%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); } }
@keyframes tilt { 50% { transform: rotate(90deg); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="480" height="270"></canvas>

  <div id="hud" class="hidden">
    <div id="topLeft">
      <div id="hCoinsBox" class="hud-box">🪙 <span id="hCoins">0</span></div>
      <div id="hDepthBox" class="hud-box"><div id="hDepth">0<small>m</small></div><div id="hZone"></div><div id="hExit"></div></div>
    </div>
    <div id="gauge"><div id="gaugeBar"><div id="gaugeFill"></div></div><div id="gaugeMarks"></div><div id="gaugeMe"></div></div>
    <div id="rightCol">
      <div class="row1"><div id="hearts"></div><button id="pauseBtn" aria-label="pause">II</button></div>
      <div id="lanternBox" class="hud-box"><div class="label"><span data-s="lantern"></span><span id="lanternTx"></span></div><div id="lanternBar"><div id="lanternFill"></div></div></div>
      <div class="hud-box"><div class="label"><span data-s="bag"></span><span id="bagTx"></span></div><div id="bagSlots"></div></div>
      <div id="ropeTx" class="hud-box"></div>
    </div>
    <div id="stick" class="hidden"><div id="stickKnob"></div></div>
    <div id="touchPad" class="hidden">
      <button id="ropeBtn"><span>🪢</span><b id="ropeBtnN">0</b></button>
      <button id="jumpBtn" data-s="jump"></button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="banner"><b></b><span></span></div>

  <div id="ready" class="overlay hidden"><div class="logo">RUIN DIVER</div><div class="tap" data-s="tapToDive"></div></div>
  <div id="hint" class="hidden"><div class="hand"></div><div data-s="dragHint"></div></div>

  <div id="results" class="overlay hidden">
    <div id="resultsPanel" class="panel">
      <div id="resLeft">
        <div id="resTitle"></div>
        <div id="lootGrid"></div>
        <div id="resEmpty" class="hidden"></div>
        <div id="resCoins"></div>
        <div id="droppedRow" class="hidden"><span class="lbl"></span><span class="ic"></span><span class="sp"></span></div>
      </div>
      <div id="resRight">
        <h3><span data-s="upgrades"></span><small>🪙 <span id="resWallet">0</span></small></h3>
        <div id="upList"></div>
        <div id="goal"></div>
      </div>
      <div id="resBottom">
        <button class="btn" id="bookBtn">📖 <span data-s="book"></span><small id="bookBtnPct"></small><span class="dot hidden" id="bookDot">NEW</span></button>
        <button class="btn btn-ad" id="doubleBtn">🎬 <span data-s="double"></span></button>
        <button class="btn btn-go" id="diveBtn"></button>
      </div>
    </div>
  </div>

  <div id="book" class="overlay hidden">
    <div id="bookPanel" class="panel">
      <div id="bookHead"><h2>📖 <span data-s="book"></span></h2><div id="bookPct"><div id="bookPctFill"></div></div><div id="bookPctTx"></div><button id="bookClose">✕</button></div>
      <div id="bookMain"><div id="tabs"></div><div id="bookGrid"></div></div>
      <div id="bookSide"><div id="detail"></div></div>
    </div>
  </div>

  <div id="lanternPrompt" class="overlay modal hidden">
    <div class="panel"><h2 id="lpTitle"></h2>
      <div class="row"><button class="btn btn-std" id="lpUp"></button><button class="btn btn-ad" id="lpAd">🎬 <span id="lpAdTx"></span></button></div>
    </div>
  </div>
  <div id="pause" class="overlay modal hidden">
    <div class="panel"><h2 data-s="paused"></h2>
      <div class="row"><button class="btn btn-go" id="resumeBtn" data-s="resume"></button></div>
