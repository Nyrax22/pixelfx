<meta charset="utf-8">
<title>인생 떡상</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* Layout: full-bleed 3D stage, a thin HUD rail on top, one hazard-striped action sheet docked at the bottom; the morning paper opens as a sheet of newsprint. */
:root{
  --ink:#121110;--sheet:#1d1b18;--line:#3b362e;--text:#f2ebdd;--muted:#a59c8b;
  --hazard:#ffc531;   /* safety yellow: the loud colour */
  --bid:#ff5b3d;      /* bids, stamps */
  --money:#5ed38c;
  --up:#ff4d55;       /* Korean market convention: up is red */
  --down:#4d8dff;     /* down is blue */
  --steel:#8ea3b9;
  --paper:#efe8d8;--paper-ink:#1d1a15;--paper-rule:#b8ad96;--paper-up:#c8202b;--paper-down:#1f4fb8;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.up{color:var(--up)}.down{color:var(--down)}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#121110ee,#12111000);pointer-events:none}
.chip{pointer-events:auto;flex-shrink:0;display:inline-flex;align-items:baseline;gap:6px;padding:5px 9px;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:11px;letter-spacing:.04em}
.chip.cash b{color:var(--money)}
.chip.rank b{color:var(--hazard)}
.chip.rent.warn{border-color:var(--bid)} .chip.rent.warn b{color:var(--bid)}
.hud-spacer{flex:1}
.iconbtn{pointer-events:auto;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;padding:5px 9px;font-size:13px}

#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:6;width:min(640px,100%);box-sizing:border-box;
  max-height:min(56vh,560px);overflow-y:auto;background:var(--sheet);border-top:6px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px) 6;
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -12px 40px #0008}
#panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:2px 0 6px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--hazard);font-family:var(--mono)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 0;min-width:84px}
.btn{border:1px solid var(--line);background:#2a2722;padding:12px 10px;border-radius:3px;font-weight:700;font-size:15px}
.btn:hover:not(:disabled){background:#353129}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--hazard);color:#15120a;border-color:var(--hazard)}
.btn.go:hover:not(:disabled){background:#ffd35e}
.btn.red{background:var(--bid);border-color:var(--bid);color:#fff}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff}
.btn.sell{background:var(--down);border-color:var(--down);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 6px;font-size:13px}
.rumor{margin:8px 0 0;padding:10px 12px;background:#26231e;border-left:3px solid var(--steel);font-size:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-family:var(--mono)}
.bar{height:6px;background:#2c2924;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hazard);transform-origin:left}
.bidtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.leader{font-size:14px;color:var(--muted)} .leader b{color:var(--text)} .leader.me b{color:var(--money)}
.call{font-family:var(--display);font-size:22px;color:var(--bid);min-height:28px;margin-top:6px}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--muted);max-height:76px;overflow:hidden;font-family:var(--mono)}
.log li.me{color:var(--money)}
.card{display:flex;gap:14px;align-items:center;margin-top:6px}
.rbadge{display:inline-block;padding:3px 8px;border-radius:2px;font-size:12px;font-weight:700;color:#111}
.card .big{font-family:var(--display);font-size:24px;line-height:1.15}
.val{font-family:var(--mono);font-weight:700;font-size:18px}
.gain{color:var(--money)} .loss{color:var(--bid)}
.inv{display:grid;gap:6px;margin-top:10px}
.it{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:#24211c;border-radius:3px;text-align:left}
.it.sel{border-color:var(--hazard);background:#2e2a22}
.it .dot{width:10px;height:10px;border-radius:50%}
.it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm small{display:block;color:var(--muted);font-size:11px}
.it .pr{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:3px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:16px}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hub button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px;border:1px solid var(--line);background:#26231e;border-radius:3px;min-width:0}
.hub button b{font-size:16px}
.hub button small{color:var(--muted);font-size:12px}
.hub button:hover:not(:disabled){border-color:var(--hazard)}
.hub button:disabled{opacity:.4;cursor:not-allowed}
.hub button.go{background:var(--hazard);color:#15120a;border-color:var(--hazard)} .hub button.go small{color:#4a3a10}
.rk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.rk li{display:grid;grid-template-columns:22px 12px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;background:#211f1b;border-radius:2px}
.rk li.me{outline:1px solid var(--hazard)}
.rk .n{font-family:var(--mono);color:var(--muted)}
.rk .sw{width:10px;height:10px;border-radius:2px}
.rk .w{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rk .d{font-family:var(--mono);font-size:12px;min-width:58px;text-align:right}
.rk small{color:var(--muted)}

.tabs{display:flex;gap:4px;margin-top:4px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#24211c;border-radius:3px;font-weight:700}
.tabs button.on{background:var(--hazard);color:#15120a;border-color:var(--hazard)}
.tl{display:grid;gap:4px;margin-top:8px}
.tr{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);background:#24211c;border-radius:3px;text-align:left}
.tr.sel{border-color:var(--hazard);background:#2e2a22}
.tr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{color:var(--muted);font-size:11px;margin-left:4px}
.tr .p{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tr .c{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tr .hold{display:block;font-size:11px;color:var(--money)}
#chart{width:100%;height:96px;display:block;margin-top:8px;background:#161512;border-radius:2px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qhead .big{font-family:var(--display);font-size:24px}
.qhead .pp{font-family:var(--mono);font-size:20px;font-weight:700}

.meter{display:inline-block;width:44px;height:7px;background:#2c2924;border-radius:3px;overflow:hidden;align-self:center}
.meter i{display:block;height:100%;width:50%;background:var(--money);transition:width .3s}
.meter.low i{background:var(--bid)}
.warn-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.warn-list li{font-size:13px;padding:6px 9px;border-left:3px solid var(--bid);background:#2a1c18}
.warn-list li.ok{border-color:var(--money);background:#1b2a20}
.sect{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:14px 0 0;font-family:var(--mono)}
.hub button .tm{font-family:var(--mono);font-size:11px;color:var(--hazard)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.prod{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:1px solid var(--line);background:#24211c;border-radius:3px;min-width:0}
.prod:hover:not(:disabled){border-color:var(--hazard)}
.prod:disabled{opacity:.4;cursor:not-allowed}
.prod b{font-size:14px}.prod small{color:var(--muted);font-size:12px}.prod .pp{font-family:var(--mono);color:var(--hazard);font-size:13px}
.loan{padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-top:8px}
.loan h4{margin:0 0 4px;font-size:15px}
#toast{position:fixed;left:50%;top:calc(var(--hud-h,58px) + 6px);transform:translateX(-50%);z-index:12;display:grid;gap:6px;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:#000d;border:1px solid var(--line);padding:9px 12px;border-radius:3px;font-size:14px;animation:tin .25s ease-out}
.toast.good{border-color:var(--money)} .toast.bad{border-color:var(--bid)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#stamp{position:fixed;left:50%;top:34%;z-index:11;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;font-family:var(--display);font-size:clamp(48px,14vw,104px);color:var(--bid);border:6px solid var(--bid);padding:2px 22px;border-radius:6px;opacity:0;white-space:nowrap}
#stamp.on{animation:stamp 1.4s ease-out forwards}
#stamp.gold{color:var(--hazard);border-color:var(--hazard)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000b;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
#modal .box{width:min(480px,100%);max-height:88vh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-top:6px solid var(--hazard);padding:20px;border-radius:3px;box-sizing:border-box}
#modal h3{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0 8px}
#modal p{line-height:1.6;margin:6px 0}

/* The morning paper */
#modal .box.paper{width:min(760px,100%);background:var(--paper);color:var(--paper-ink);border:none;border-radius:1px;padding:18px 20px 20px;font-family:var(--serif);box-shadow:0 20px 60px #000c;
  background-image:radial-gradient(#0000 60%,#6b5a3a14),repeating-linear-gradient(0deg,#0000 0 3px,#00000005 3px 4px)}
.mast{text-align:center;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
.mast .nm{font-family:var(--serif);font-weight:800;font-size:clamp(38px,9vw,60px);letter-spacing:.06em;line-height:1}
.mast .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--body);font-size:11px;letter-spacing:.08em;border-top:1px solid var(--paper-ink);margin-top:6px;padding-top:4px}
.lead{padding:12px 0;border-bottom:1px solid var(--paper-rule)}
.lead h4{font-family:var(--serif);font-weight:800;font-size:clamp(22px,5.4vw,32px);line-height:1.25;margin:4px 0 0;text-wrap:balance}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.sec{padding:10px 0;border-bottom:1px solid var(--paper-rule);min-width:0}
.sec h5{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.14em;margin:0 0 6px;border-bottom:2px solid var(--paper-ink);display:inline-block;padding-bottom:2px}
.news{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.news li{font-size:15px;line-height:1.45;font-weight:700}
.lb{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:700;padding:1px 5px;margin-right:5px;vertical-align:2px;border-radius:1px}
.lb.hi{background:var(--paper-up);color:#fff}
.lb.mid{background:var(--paper-ink);color:var(--paper)}
.lb.lo{border:1px dashed var(--paper-ink);color:var(--paper-ink)}
.mv{list-style:none;margin:0;padding:0;font-family:var(--body);font-size:13px;display:grid;gap:4px}
.mv li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.mv .pc{font-family:var(--mono);font-weight:700;min-width:62px}
.mv .pc.u{color:var(--paper-up)} .mv .pc.d{color:var(--paper-down)}
.mv .why{color:#5a5242;font-size:12px}
.prank{font-family:var(--body);font-size:13px;list-style:none;margin:0;padding:0;display:grid;gap:3px}
.prank li{display:flex;justify-content:space-between;gap:8px}
.prank b{font-family:var(--mono)}
.tip{font-family:var(--body);font-size:12px;color:#5a5242;margin-top:10px;line-height:1.5}
.box.paper .btn{border-color:var(--paper-ink)}
.box.paper .btn.go{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}

#title{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#12111000 25%,#121110f2 72%)}
#title .wrap{width:min(640px,100%);margin:0 auto}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,18vw,128px);line-height:.9;margin:0}
#title h1 span{color:var(--up)}
#title .tag{font-size:16px;margin:12px 0 4px;line-height:1.55}
#title .rec{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.how div{border-left:2px solid var(--hazard);padding-left:8px}
.how b{display:block;color:var(--text);font-size:14px}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 52%,rgba(0,0,0,.55) 100%)}
#fade{position:fixed;inset:0;pointer-events:none;z-index:4;background:#0b0a09;opacity:0}
.pin{animation:pin .22s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.hub button svg{width:20px;height:20px;fill:none;stroke:var(--hazard);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:3px}
.hub button:disabled svg{stroke:var(--muted)}
.btn.go{box-shadow:0 2px 0 #b8861a}
@media (max-width:600px){.chip{padding:4px 7px;font-size:12px;gap:4px}.chip small{font-size:10px}.meter{width:30px}.iconbtn{padding:4px 7px;font-size:12px}#hud{gap:5px}}
@media (prefers-reduced-motion:reduce){#stamp.on{animation-duration:.01s}.toast,.pin{animation:none}}
</style>

<div id="stage"></div>
<div id="vig"></div>
<div id="fade"></div>

<header id="hud" hidden>
  <span class="chip"><small>D+</small><b id="hDay">1</b><b id="hTime" style="color:var(--hazard)">08:00</b></span>
  <span class="chip cash"><small>현금</small><b id="hCash">0</b></span>
  <span class="chip" id="hDebtChip" hidden><small>빚</small><b id="hDebt" style="color:var(--bid)">0</b></span>
  <span class="chip"><small>포만감</small><span class="meter"><i id="hFood"></i></span></span>
  <span class="chip"><small>체력</small><span class="meter"><i id="hHp"></i></span></span>
  <span class="chip rent" id="hRentChip"><small>월세</small><b id="hRent">오늘 밤</b></span>
  <span class="hud-spacer"></span>
  <button class="iconbtn" id="btnMute" data-act="mute" aria-label="소리 켜고 끄기">소리 켬</button>
  <button class="iconbtn" data-act="giveup">새 인생</button>
</header>

<section id="panel" hidden></section>
<div id="toast"></div>
<div id="stamp"></div>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<div id="title">
  <div class="wrap">
    <div class="eyebrow">생존 · 경매 · 주식 · 코인 로그라이크</div>
    <h1>인생<span>떡상</span></h1>
    <p class="tag">반지하 자취방, 통장에는 100만 원. 그런데 <b>오늘 밤 바로 첫 월세</b>가 나갑니다.<br>밥 챙겨 먹고, 고장 나면 고치고, 빚은 갚으면서 10억 펜트하우스를 노리세요. <b>한 번 파산하면 끝</b>이고 총점이 남아요.</p>
    <div class="how">
      <div><b>생존</b>포만감·체력 관리, 장보기, 고장 수리, 알바</div>
      <div><b>돈 벌기</b>창고 경매, 가상 주식 8종목, 코인 4종</div>
      <div><b>아침 신문</b>오늘 밤 오를 종목 힌트. 출처마다 믿을 만한 정도가 달라요</div>
      <div><b>대출</b>은행·캐피탈·사채. 상환일에 못 갚으면 파산</div>
    </div>
    <div class="row">
      <button class="btn go" id="btnNew" data-act="newgame">새 인생 시작</button>
      <button class="btn" id="btnCont" data-act="continue" hidden>이어하기</button>
    </div>
    <div class="rec" id="rec"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/*SIM-START*/
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function labelFor(isTrue,kind){const x=Math.random();const low=kind==='coin'?'커뮤니티':'찌라시';if(isTrue)return x<.55?pick(['단독','속보']):x<.82?'분석':low;return x<.12?pick(['단독','속보']):x<.4?'분석':low;}

function genDay(W){const E=[],N=[];
  if(Math.random()<.3){const m=pick(MACROS);const fx={};for(const a of ASSETS){const v=a.kind==='stock'?m.stock:m.coin;if(v)fx[a.id]=v*8;}E.push({kind:'macro',m,text:m.t,fx});}
  if(Math.random()<.3){const g=pick(GROUPS);const ret=g.pol*rand(.03,.07);const fx={};for(const a of ASSETS)if(a.group===g.g)fx[a.id]=g.pol*.5;E.push({kind:'group',g:g.g,ret,text:g.t,fx});}
  const ids=shuffle(ASSETS.map(a=>a.id)).slice(0,randi(3,5));let binary=Math.random()<.12;if(binary&&ids.includes('HBB'))ids.splice(ids.indexOf('HBB'),1);
  for(const id of ids){const a=AID[id];const pol=Math.random()<(a.kind==='coin'?.5:.56)?1:-1;
    const mag=a.kind==='stock'?(a.group==='bio'?rand(.14,.34):rand(.08,.22)):a.tier==='major'?rand(.1,.28):a.tier==='alt'?(pol>0?rand(.2,.55):rand(.25,.6)):(pol>0?rand(.3,1.0):rand(.4,.9));
    let ret=Math.max(pol*mag,-.88),pricedIn=false;if(pol>0&&Math.random()<.18){pricedIn=true;ret=-rand(.02,.08);}
    const w=a.kind==='coin'?2.2:a.group==='bio'?1.6:1;E.push({kind:'asset',id,ret,pol,pricedIn,text:newsText(a,pol),fx:{[id]:pol*w}});}
  if(binary)E.push({kind:'asset',id:'HBB',ret:(Math.random()<.55?1:-1)*rand(.25,.45),pol:0,binary:true,text:'한빛바이오, 임상 3상 결과 내일 발표… 대박 아니면 쪽박',fx:{}});
  for(const e of E){if(e.kind!=='asset'||e.binary||Math.random()<.8)N.push({text:e.text,label:e.kind==='asset'&&!e.binary?labelFor(true,AID[e.id].kind):'속보',id:e.id||null,fx:e.fx,binary:!!e.binary,isTrue:true,kind:e.id?AID[e.id].kind:'macro'});}
  const nf=randi(1,3);for(let i=0;i<nf;i++){const a=pick(ASSETS);const pol=Math.random()<.55?1:-1;const w=a.kind==='coin'?2.2:a.group==='bio'?1.6:1;N.push({text:newsText(a,pol),label:labelFor(false,a.kind),id:a.id,fx:{[a.id]:pol*w},isTrue:false,kind:a.kind});}
  W.events=E;W.news=shuffle(N);}
function resolveDay(W){const rets={};for(const a of ASSETS)rets[a.id]=(a.kind==='stock'?.0008:0)+gauss()*a.vol;
  for(const e of W.events){if(e.kind==='macro'){for(const a of ASSETS)rets[a.id]+=(a.kind==='stock'?e.m.stock:e.m.coin)*rand(.7,1.3);}else if(e.kind==='group'){for(const a of ASSETS)if(a.group===e.g)rets[a.id]+=e.ret*rand(.7,1.3);}else rets[e.id]+=e.ret*rand(.75,1.15);}
  W.crash=[];for(const a of ASSETS){if(a.kind==='coin'&&a.tier!=='major'&&Math.random()<(a.tier==='meme'?.035:.015)){rets[a.id]-=rand(.45,.85);W.crash.push(a.id);}}
  for(const a of ASSETS){const s=W.mkt[a.id];const r=Math.max(-.92,rets[a.id]);rets[a.id]=r;s.price=Math.max(a.kind==='stock'?100:.001,s.price*(1+r));s.ret=r;s.hist.push(s.price);if(s.hist.length>40)s.hist.shift();}
  W.lastEvents=W.events;W.lastNews=W.news;W.lastRets=rets;return rets;}

function aiWorth(ai){let v=ai.cash+ai.pending+TIERS[ai.tier].dep;for(const id in ai.pos)v+=ai.pos[id];return v;}
function aiMorning(W){for(const ai of W.ais){if(ai.out)continue;const S=STYLES[ai.style];let total=ai.cash;for(const id in ai.pos)total+=ai.pos[id];ai.pos={};
  const sc={};for(const a of ASSETS)sc[a.id]=a.kind==='coin'?S.coinBias:0;
  for(const n of W.news){if(n.binary){sc[n.id]+=S.gamble;continue;}const known=Math.random()<S.read;const v=known?(n.isTrue?1:0):LABEL_REL[n.label]*S.trust;for(const id in n.fx)sc[id]+=v*n.fx[id];}
  for(const a of ASSETS){const s=W.mkt[a.id];sc[a.id]+=S.mom*s.ret*6;const h=s.hist;const r5=h.length>6?s.price/h[h.length-6]-1:0;sc[a.id]-=S.rev*r5*3;}
  const cands=ASSETS.filter(a=>sc[a.id]>S.thresh).sort((a,b)=>sc[b.id]-sc[a.id]).slice(0,S.k);
  const reserve=Math.max(total*(1-S.invest),TIERS[ai.tier].rent*2);const invest=Math.max(0,total-reserve);
  if(!cands.length||invest<=0){ai.cash=total;continue;}
  let sum=cands.reduce((t,a)=>t+sc[a.id],0);let w=Object.fromEntries(cands.map(a=>[a.id,sc[a.id]/sum]));
  const cw=cands.filter(a=>a.kind==='coin').reduce((t,a)=>t+w[a.id],0);if(cw>S.coinMax){const k=S.coinMax/cw;for(const a of cands)if(a.kind==='coin')w[a.id]*=k;}
  let used=0;for(const id in w){ai.pos[id]=invest*w[id];used+=ai.pos[id];}ai.cash=total-used;}}
function aiNight(W,rets){for(const ai of W.ais){if(ai.out)continue;const S=STYLES[ai.style];for(const id in ai.pos)ai.pos[id]*=1+rets[id];
  ai.cash+=ai.pending;ai.pending=0;if(Math.random()<S.off){const sc=25*(1+ai.tier*1.6);ai.cash+=sc*(ai.style==='auction'?rand(-.15,.5):rand(-.3,.4));}
  const t=TIERS[ai.tier];ai.cash-=t.food;if(W.day%7===1)ai.cash-=t.rent;
  ai.prev=ai.worth;ai.worth=aiWorth(ai);const nt=TIERS[ai.tier+1];if(nt&&ai.worth>nt.dep*4&&ai.cash>nt.dep-t.dep){ai.cash-=nt.dep-t.dep;ai.tier++;}
  if(ai.worth<=0)ai.out=true;}}

function won(m){const neg=m<0;m=Math.abs(m);let s;
  if(m<1){const w=Math.round(m*10000);return (neg&&w?'-':'')+w.toLocaleString('ko-KR')+'원';}
  else{m=Math.round(m);if(m>=10000){const e=Math.floor(m/10000),rest=m%10000;s=e+'억'+(rest?' '+rest.toLocaleString('ko-KR')+'만':'');}else s=m.toLocaleString('ko-KR')+'만';}
  return (neg?'-':'')+s+'원';}
function jong(w){const c=String(w).trim().slice(-1);const dig={0:1,1:2,2:0,3:1,4:0,5:0,6:1,7:2,8:2,9:0};if(c in dig)return dig[c];const k=c.charCodeAt(0)-0xAC00;if(k<0||k>11171)return 0;const j=k%28;return j===0?0:j===8?2:1;}
const J=(w,a,b)=>w+(jong(w)?a:b);

const bursts=[];
function burst(scene,pos,color,n=70,speed=3){const geo=new THREE.BufferGeometry();const p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){p.set([pos.x,pos.y,pos.z],i*3);const a=Math.random()*Math.PI*2,e=Math.random()*1.2+.2;v.push(new THREE.Vector3(Math.cos(a)*Math.cos(e),Math.sin(e)+.3,Math.sin(a)*Math.cos(e)).multiplyScalar(speed*(.4+Math.random())));}
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color,size:.09,map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(pts);bursts.push({pts,v,life:1.4,scene});}
function updateBursts(dt){for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=dt;const p=b.pts.geometry.attributes.position;for(let j=0;j<b.v.length;j++){b.v[j].y-=5*dt;p.setXYZ(j,p.getX(j)+b.v[j].x*dt,p.getY(j)+b.v[j].y*dt,p.getZ(j)+b.v[j].z*dt);}p.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.life/1.4);
  if(b.life<=0){b.scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}}}
const tweens=[];
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function updateTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.done&&w.done();}}}
const ease=k=>1-Math.pow(1-k,3);

function tone(f,dur=.15,type='sine',vol=.25,when=0,slide){if(!actx||muted)return;const t=actx.currentTime+when;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur=.1,vol=.3,when=0,freq=800){if(!actx||muted)return;const t=actx.currentTime+when;const b=actx.createBuffer(1,actx.sampleRate*dur,actx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=actx.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}

function rarityRoll(bonus){const w=[30,44,17,7.5,1.5];w[0]*=Math.exp(-bonus*.5);w[2]*=Math.exp(bonus*.3);w[3]*=Math.exp(bonus*.6);w[4]*=Math.exp(bonus*.85);let t=w.reduce((a,b)=>a+b),x=Math.random()*t;for(let i=0;i<5;i++){x-=w[i];if(x<=0)return i;}return 1;}
function genItem(th,bonus,L){const cat=th.w?wpick(th.w):pick(CAT_KEYS);const C=CATS[cat];let rar=rarityRoll(bonus),fake=false;
  if(C.fake&&Math.random()<C.fake*.4){fake=true;rar=Math.random()<.85?3:4;}
  const base=rand(C.b[0],C.b[1])*(1+L*1.1);let trueV=fake?base*rand(.03,.1):base*RAR[rar].mult*rand(.8,1.25);let special=null,name=pick(PREFIX[rar])+' '+C.n;
  if(cat==='box'){const x=Math.random();if(x<.05){special='cash';trueV=rand(3,50)*(1+L);name='현금 봉투';}else if(x<.10){special='lotto';trueV=.1;name='복권 한 장';}}
  if(cat==='safe')special='safe';const shown=fake?base*RAR[rar].mult:trueV;
  return{id:P.nextId++,cat,rar,fake,special,name,trueV:r1(Math.max(.1,trueV)),estV:r1(Math.max(.1,shown*rand(.6,1.5))),appraised:false,vis:randi(1,1e9)};}
function genLot(forceTheme){const L=lotLevel();let th=forceTheme?THEMES.find(t=>t.name===forceTheme):(()=>{let t=0;for(const x of THEMES)t+=x.p;let r=Math.random()*t;for(const x of THEMES){r-=x.p;if(r<=0)return x;}return THEMES[0];})();
  const bonus=(th.bonus==null?rand(-1,2.2):th.bonus)+L*.3+luck()*.08;const n=randi(th.n[0],th.n[1])+Math.min(4,Math.floor(L));const items=[];for(let i=0;i<n;i++)items.push(genItem(th,bonus,L));
  items.forEach(it=>it.display=it.cat==='box'?'carton':(()=>{const x=Math.random();return x<.5?'open':x<.8?'tarp':'carton';})());
  const T=items.reduce((a,b)=>a+b.trueV,0);
  return{theme:th.name,items,T,open:rand(.38,.78),rumor:makeRumor(items),opening:Math.max(1,Math.round(T*Math.exp(gauss()*.4)*.1)),label:'B-'+randi(10,99),nGuess:n+randi(-1,1)};}

  let det='';if(sel){const inRoom=P.room.includes(sel.id);const cost=Math.max(.5,r1(sel.estV*.05));const crack=Math.round(2*(1+P.tier*.5));
    det=`<div class="detail"><div>${rb(sel.fake&&sel.appraised?0:sel.rar)} <b>${esc(sel.name)}</b></div><div class="muted" style="margin-top:4px">김 영감 제시가 <span class="val" style="color:var(--text)">${sel.refused?'오늘은 안 산대':won(sel.offer)}</span></div>
    <div class="row"><button class="btn go" data-act="sellItem" ${sel.refused||sel.special==='lotto'?'disabled':''}>팔기</button><button class="btn" data-act="haggle" ${sel.haggled||sel.refused||sel.special==='lotto'?'disabled':''}>흥정하기</button>
      ${sel.special==='safe'?`<button class="btn red" data-act="crack" ${P.cash<crack?'disabled':''}>금고 따기 (${won(crack)})</button>`:''}${sel.special==='lotto'?`<button class="btn red" data-act="scratch">복권 긁기</button>`:''}
      ${!sel.appraised&&!sel.special?`<button class="btn" data-act="appraise" ${P.cash<cost?'disabled':''}>감정 (${won(cost)})</button>`:''}${sel.special?'':`<button class="btn ghost" data-act="keep" ${!inRoom&&P.room.length>=TIERS[P.tier].slots?'disabled':''}>${inRoom?'방에서 빼기':'방에 두기'}</button>`}</div></div>`;}
  setPanel(`<div class="eyebrow">만물상 · ${mod.shop>1?'오늘 호황 +25%':mod.shop<1?'오늘 불경기 -25%':'평소 시세'}</div><h2>팔 것인가, 둘 것인가</h2>
    <p class="muted" style="font-size:13px;margin:0">방에 둔 괜찮음 이상 물건은 운을 올려줘요(방 자리 ${P.room.length}/${TIERS[P.tier].slots}, 운 ${luck()}). 운이 높으면 좋은 창고와 흥정 성공이 늘어요.</p>
    <div class="inv">${list}</div>${det}<div class="row"><button class="btn ghost" data-act="sellAll" ${items.filter(i=>!P.room.includes(i.id)&&!i.refused&&i.special!=='lotto').length?'':'disabled'}>방에 없는 것 전부 팔기</button><button class="btn go" data-act="hub">집으로</button></div>`);}
function removeItem(id){P.inv=P.inv.filter(x=>x.id!==id);P.room=P.room.filter(x=>x!==id);if(selId===id)selId=P.inv[0]?.id??null;}
function sellItem(id,quiet){const it=itemById(id);if(!it||it.refused)return 0;P.cash+=it.offer;P.stats.earned+=it.offer;const v=it.offer;removeItem(id);if(!quiet){sfx.cash();toast(`${it.name} 판매 +${won(v)}`,'good');}return v;}

/* ============ night ============ */
function liquidate(need){let n=0;for(const id of Object.keys(P.hold)){if(P.cash>=need)break;P.cash+=holdVal(id);delete P.hold[id];n++;}
  const order=P.inv.filter(i=>i.special!=='lotto').sort((a,b)=>(P.room.includes(a.id)?1:0)-(P.room.includes(b.id)?1:0)||b.trueV-a.trueV);
  for(const it of order){if(P.cash>=need)break;P.cash+=r1(Math.max(.1,it.trueV*.5));n++;removeItem(it.id);}return n;}
function pay(amount,what,msgs){if(P.cash>=amount){P.cash-=amount;return true;}const n=liquidate(amount);if(P.cash>=amount){P.cash-=amount;msgs.push(`${what} 낼 돈이 모자라 자산 ${n}건을 헐값에 팔았다.`);return true;}return false;}
function sleep(late){if(!P||phase==='over'||phase==='win'||phase==='title')return;closeModal();const t=TIERS[P.tier];P.prevWorth=myWorth();const msgs=[];
  P.food=Math.max(0,P.food-15);
  if(P.broken.boiler){P.hp-=12;msgs.push('보일러가 고장 나서 밤새 떨었다. 체력 -12');}else if(P.food>20)P.hp+=late?10:22;else if(P.food>0){P.hp-=8;msgs.push('배가 고파 잠을 설쳤다. 체력 -8');}else{P.hp-=22;msgs.push('굶은 채로 잠들었다. 체력 -22');}
  P.hp=clamp(P.hp,0,100);
  if(P.broken.fridge&&P.pantry.groc>0){msgs.push(`냉장고 고장으로 장보기 꾸러미 ${P.pantry.groc}개가 상했다.`);P.pantry.groc=0;}
  let evicted=false;
  if(rentIn()===0){if(pay(t.rent,'월세',msgs)){P.credit=Math.min(900,P.credit+5);msgs.push(`월세 -${won(t.rent)}`);}
    else{if(P.tier===0){gameOver(`D+${P.day} 밤, 월세 ${won(t.rent)}을 못 냈다. 팔 것도 남지 않았다.`);return;}const refund=t.dep-TIERS[P.tier-1].dep;P.cash+=refund-t.rent;P.tier--;P.room=P.room.slice(0,TIERS[P.tier].slots);room=null;evicted=true;}}
  for(const l of P.loans)l.owed*=1+l.rate;
  for(const l of P.loans.slice()){if(l.due<=P.day){if(pay(l.owed,l.name+' 상환금',msgs)){P.loans.splice(P.loans.indexOf(l),1);P.credit=Math.min(900,P.credit+40);msgs.push(`${l.name} 상환 완료 · 신용점수 +40`);}
    else{gameOver(`${l.name} 상환일. ${won(l.owed)}을 갚지 못했다.`);return;}}}
  if(P.cash<0){liquidate(0);if(P.cash<0){gameOver(`현금이 ${won(P.cash)}인데 팔 것이 없다.`);return;}}
  if(P.hp<=0){const cost=25+P.tier*15;P.hp=40;if(P.cash>=cost)P.cash-=cost;else P.loans.push({type:'hosp',name:'병원비 분할 납부',owed:cost,rate:.003,due:P.day+15});msgs.push(`밤새 앓다가 응급실에 갔다. 병원비 ${won(cost)}`);}
  const rets=resolveDay(P);aiNight(P,rets);
  for(const ai of P.ais){if(ai.out&&!ai.reportedOut){ai.reportedOut=true;P.feed.push(`D+${P.day} ${ai.name}, 끝내 파산`);}
    const d=ai.prev?ai.worth/ai.prev-1:0;if(!ai.out&&Math.abs(d)>.35)P.feed.push(`D+${P.day} ${ai.name}(${STYLES[ai.style].label}) 하루 만에 ${d>0?'+':''}${(d*100).toFixed(0)}%`);}
  if(P.feed.length>12)P.feed=P.feed.slice(-12);
  P.day++;P.time=8;P.stats.maxWorth=Math.max(P.stats.maxWorth||0,myWorth());
  msgs.forEach(m=>toast(m,/완료|^월세 -/.test(m)?'':'bad'));
  const winner=P.ais.find(a=>!a.done&&!a.out&&a.worth>=GOAL);
  genDay(P);
  if(evicted){modal(`<div class="eyebrow">월세 미납</div><h3>쫓겨났다</h3><p>월세를 못 내서 ${TIERS[P.tier+1].name}에서 나왔다. 보증금을 돌려받아 <b>${TIERS[P.tier].to}</b> 옮긴다.</p><div class="row"><button class="btn go" data-act="toMorning">다음 날</button></div>`);sfx.bad();return;}
  if(winner){rivalWin(winner);return;}
  morning();}
function rivalWin(ai){phase='rival';sfx.bad();const rk=myRank();
  modal(`<div class="eyebrow">D+${P.day} 속보</div><h3>${esc(ai.name)}, 먼저 떡상</h3><p><b>${esc(ai.name)}</b>(${esc(STYLES[ai.style].label)})${jong(STYLES[ai.style].label)?'이':'가'} 순자산 ${won(ai.worth)}을 찍고 펜트하우스를 계약했다.</p><p>지금 내 순위는 <b>${rk}위</b>, 순자산 ${won(myWorth())}.</p>
    <div class="row"><button class="btn" data-act="giveupNow">여기서 끝내고 점수 보기</button><button class="btn go" data-act="keepGoing">계속 살아남기</button></div><p class="muted" style="font-size:12px">계속하면 ${esc(J(ai.name,'은','는'))} 레이스에서 빠지고, 나는 파산할 때까지 계속 점수를 쌓아요.</p>`);
  ai._pending=true;}
function scoreParts(winFlag){const s=P.stats;const bt=s.bestTrade&&s.bestTrade.v>0?s.bestTrade.v:0;const mw=Math.max(0,s.maxWorth||0);
  const p=[['생존',`${P.day}일`,P.day*100],['최고 순자산',won(mw),Math.round(mw/10)],['경매 낙찰',`${s.won}회`,s.won*30],['전설 아이템',`${s.legend}개`,s.legend*300],['최고의 한 방',bt?`${s.bestTrade.name} +${won(bt)}`:'없음',Math.round(bt/20)]];
  if(winFlag)p.push(['펜트하우스 입주','10억',30000]);return p;}
function scoreBlock(parts){const tot=parts.reduce((t,x)=>t+x[2],0);return{tot,html:`<div class="grid2">${parts.map(x=>`<div class="stat"><small>${x[0]} · ${esc(x[1])}</small><b>+${x[2].toLocaleString('ko-KR')}</b></div>`).join('')}</div>
  <div class="stat" style="margin-top:8px;border-color:var(--hazard)"><small>총점</small><b style="font-size:30px;color:var(--hazard)">${tot.toLocaleString('ko-KR')}점</b></div>`};}
function endScreen(title,reason,winFlag){clearRun();hidePanel();const meta=loadMeta();const {tot,html}=scoreBlock(scoreParts(winFlag));const nb=tot>(meta.best||0);if(nb)meta.best=tot;saveMeta(meta);
  modal(`<div class="eyebrow">인생 #${P.run} · D+${P.day} · ${winFlag?'클리어':'게임 오버'}</div><h3>${title}</h3><p>${esc(reason)}</p>${html}<p class="muted">${nb?'최고 점수 경신!':`최고 점수 ${(meta.best||0).toLocaleString('ko-KR')}점`}</p><div class="row"><button class="btn go" data-act="newgame">다시 태어나기</button></div>`);}
function gameOver(reason){phase='over';sfx.bad();stamp('파산');renderHUD();endScreen('파산',reason,false);}
let pent=null;
function win(){phase='win';P.cash-=GOAL;renderHUD();pent=buildPenthouse();cur=pent.s;setView({target:new THREE.Vector3(0,1.6,0),yaw:.6,pitch:.28,dist:15,yl:[-99,99],auto:.1},true);stamp('떡상!',true);sfx.reveal(4);
  const done=P.ais.filter(a=>a.done).length;endScreen('인생 떡상',`반지하 자취방에서 시작해 ${P.day}일 만에 10억 펜트하우스 열쇠를 받았다.${done?` 먼저 떡상한 라이벌 ${done}명.`:' 라이벌 중 1등!'}`,true);}

/* ============ actions ============ */
const ACT={
  newgame:()=>{closeModal();newGame();},continue:()=>continueGame(),
  mute:()=>{muted=!muted;$('#btnMute').textContent=muted?'소리 끔':'소리 켬';},
  giveup:()=>{if(phase==='title')return;modal(`<h3>새 인생을 시작할까요?</h3><p>지금 인생은 기록 없이 끝나요.</p><div class="row"><button class="btn" data-act="closeModal">계속하기</button><button class="btn red" data-act="newgame">새 인생</button></div>`);},
  closeModal:()=>closeModal(),
  closePaper:()=>{closeModal();if(phase==='hub')renderHub();},paper:()=>showPaper(),
  hub:()=>{closeModal();enterHub();},
  toTrade:()=>toTrade(),tab:a=>{TS.tab=a;renderTrade();},tsel:a=>{TS.sel=a;renderTrade();},buy:a=>buy(+a),sell:a=>sell(+a),
  toAuction:()=>goAuction(),bidStart:()=>startBidding(),passLot:()=>{if(A.state==='peek')endLot();},
  bid:a=>{if(A.state!=='bid'||A.out||A.leader==='me')return;const np=A.leader===null?(a==='5'?A.price+inc(A.price)*4:A.price):nextPrice(+a);if(P.cash<np){toast('현금이 모자라요.','bad');return;}placeBid('me',np);},
  fold:()=>{if(A.state!=='bid'||A.leader==='me')return;A.out=true;endLot();},nextLot:()=>nextLot(),
  reveal:()=>revealNext(),revealAll:()=>revealAll(),nextUnbox:()=>nextUnbox(),
  toShop:()=>goShop(),sel:a=>{selId=+a;renderShop();},sellItem:()=>{sellItem(selId);renderShop();},
  sellAll:()=>{let t=0,n=0;for(const it of P.inv.slice()){if(P.room.includes(it.id)||it.refused||it.special==='lotto')continue;t+=sellItem(it.id,true);n++;}if(n){sfx.cash();toast(`${n}개 판매 +${won(t)}`,'good');}renderShop();},
  haggle:()=>{const it=itemById(selId);if(!it||it.haggled)return;it.haggled=true;const p=.45+luck()*.025;const x=Math.random();
    if(x<p){it.offer=r1(it.offer*rand(1.15,1.4));toast(`김 영감: "허 참… 알았네, ${won(it.offer)}."`,'good');sfx.good();}else if(x<p+.3){it.offer=r1(it.offer*rand(.85,.95));toast(`김 영감: "욕심이 과하구먼. 그럼 ${won(it.offer)}."`,'bad');}else{it.refused=true;toast('김 영감: "됐네, 오늘은 그 물건 안 사!"','bad');sfx.bad();}renderShop();},
  appraise:()=>{const it=itemById(selId);if(!it)return;const cost=Math.max(.5,r1(it.estV*.05));if(P.cash<cost)return;P.cash-=cost;it.appraised=true;
    if(it.fake){it.name='가짜 '+CATS[it.cat].n;it.estV=it.trueV;P.stats.fakes++;sfx.bad();stamp('짝퉁');toast(`감정 결과: 짝퉁… 실제 가치 ${won(it.trueV)}`,'bad');P.room=P.room.filter(x=>x!==it.id);}
    else{const up=it.trueV>=it.estV;it.estV=it.trueV;(up?sfx.good:sfx.bad)();toast(`감정 결과: ${won(it.trueV)}${up?' (생각보다 비싸다!)':''}`,up?'good':'bad');}renderShop();},
  keep:()=>{const it=itemById(selId);if(!it)return;if(P.room.includes(it.id)){P.room=P.room.filter(x=>x!==it.id);toast(`${J(it.name,'을','를')} 방에서 뺐다.`);}else if(P.room.length<TIERS[P.tier].slots){P.room.push(it.id);toast(`${J(it.name,'을','를')} 방에 뒀다. 운 ${luck()}`,'good');}renderShop();},
  crack:()=>{const it=itemById(selId);if(!it||it.special!=='safe')return;P.cash-=Math.round(2*(1+P.tier*.5));const m=1+lotLevel();const x=Math.random()*100;let v=0,msg;
    if(x<45)msg='텅 비어 있다…';else if(x<80){v=r1(rand(3,40)*m);msg=`현금 다발! +${won(v)}`;}else if(x<95){v=r1(rand(60,250)*m);msg=`금괴가 나왔다! +${won(v)}`;}else if(x<99.5){v=r1(rand(300,900)*m);msg=`무기명 채권 뭉치! +${won(v)}`;}else{v=r1(rand(2000,4000));msg=`다이아몬드 주머니!! +${won(v)}`;}
    it.special=null;it.name='열린 금고';P.cash+=v;P.stats.earned+=v;if(v>0){sfx.reveal(v>200?4:v>40?3:2);if(v>200)stamp('대박!',true);}else sfx.bad();toast('금고: '+msg,v>0?'good':'bad');renderShop();},
  scratch:()=>{const it=itemById(selId);if(!it)return;const x=Math.random()*100;let v=0;if(x<65)v=0;else if(x<87)v=.5;else if(x<96)v=5;else if(x<99.5)v=50;else if(x<99.95)v=500;else v=5000;
    removeItem(it.id);P.cash+=v;P.stats.earned+=v;if(v>=500){stamp('1등!',true);sfx.reveal(4);}else if(v>0)sfx.good();else sfx.bad();toast(v?`복권 당첨! +${won(v)}`:'꽝. 다음 기회에…',v?'good':'bad');renderShop();},
  move:()=>{const nt=TIERS[P.tier+1];if(!nt)return;const cost=nt.dep-TIERS[P.tier].dep;if(P.cash<cost)return;P.cash-=cost;P.tier++;ensureRoom();cur=room.scene;setView(room.view,true);sfx.reveal(3);stamp('이사!',true);toast(`새 보금자리: ${nt.name}`,'good');renderHub();},
  buyPent:()=>{if(P.cash>=GOAL)win();},
  sleep:()=>sleep(),toMorning:()=>{closeModal();const w=P.ais.find(a=>!a.done&&!a.out&&a.worth>=GOAL);if(w){rivalWin(w);return;}morning();},
  keepGoing:()=>{for(const a of P.ais)if(a._pending){a.done=true;a._pending=false;P.feed.push(`D+${P.day} ${a.name}, 펜트하우스 입주로 레이스 졸업`);}closeModal();const w=P.ais.find(a=>!a.done&&!a.out&&a.worth>=GOAL);if(w){rivalWin(w);return;}morning();},
};
Object.assign(ACT,{
  hub:()=>{closeModal();if(!P||phase==='over'||phase==='win')return;enterHub();},
  eat:()=>renderEat(),
  eatItem:a=>{const s=STORE.find(x=>x.id===a);if(!s||!(P.pantry[a]>0))return;P.pantry[a]--;P.food=Math.min(100,P.food+s.sat);P.hp=clamp(P.hp+(s.hp||0),0,100);sfx.good();toast(`${s.name} 먹었다. 포만감 ${Math.round(P.food)}`,'good');if(spend(1/3)&&phase==='eat')renderEat();},
  deliver:()=>{if(P.broken.phone||P.cash<2.2)return;P.cash-=2.2;P.food=Math.min(100,P.food+60);sfx.good();toast('치킨 도착! 포만감 +60','good');if(spend(2/3)&&phase==='eat')renderEat();},
  store:()=>{if(!spend(.5))return;goStore();},
  buyFood:a=>{const s=STORE.find(x=>x.id===a);if(!s||P.cash<s.price)return;P.cash-=s.price;P.pantry[a]=(P.pantry[a]||0)+(s.servings||1);sfx.bid();renderStore();},
  work:()=>work(),repair:()=>renderRepair(),
  fixTech:k=>{const a=APPL[k];if(P.cash<a.tech)return;P.cash-=a.tech;P.broken[k]=false;refreshAppliances();sfx.good();toast(`${a.name} 수리 완료`,'good');if(spend(1)&&phase==='repair')renderRepair();},
  fixSelf:k=>{const a=APPL[k];if(P.cash<3)return;P.cash-=3;if(Math.random()<Math.min(.9,.55+luck()*.03)){P.broken[k]=false;refreshAppliances();sfx.good();toast(`셀프 수리 성공! ${J(a.name,'이','가')} 멀쩡해졌다`,'good');}else{sfx.bad();toast('셀프 수리 실패… 부품값만 날렸다','bad');}if(spend(2)&&phase==='repair')renderRepair();},
  fixBuy:k=>{const a=APPL[k];if(!a.buy||P.cash<a.buy)return;P.cash-=a.buy;P.broken[k]=false;refreshAppliances();sfx.cash();toast(`새 ${a.name} 장만`,'good');renderRepair();},
  bank:()=>goBank(),borrow:a=>{const [k,v]=a.split(':');borrow(k,v);},repay:a=>{const [i,v]=a.split(':');repay(+i,v);},
  toTrade:()=>{if(P.broken.phone){toast('휴대폰이 고장 나서 증권 앱을 못 열어요.','bad');return;}if(!spend(.5))return;toTrade();},
  toAuction:()=>{if(P.time>15||P.auctionDone||(mod.lots??3)===0)return;if(!spend(4))return;goAuction();},
  toShop:()=>{if(phase==='hub'){if(P.time>21)return;if(!spend(1))return;}goShop();},
  noop:()=>{},
  sleep:()=>sleep(false),
  giveupNow:()=>{closeModal();phase='over';endScreen('여기까지','라이벌이 먼저 떡상하는 걸 보고 레이스를 끝냈다.',false);},
  keepGoing:()=>{for(const a of P.ais)if(a._pending){a.done=true;a._pending=false;P.feed.push(`D+${P.day} ${a.name}, 펜트하우스 입주로 레이스 졸업`);}closeModal();const w=P.ais.find(a=>!a.done&&!a.out&&a.worth>=GOAL);if(w){rivalWin(w);return;}morning();},
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ensureAudio();if(actx&&actx.state==='suspended')actx.resume();ACT[b.dataset.act]?.(b.dataset.arg,b);});
document.addEventListener('keydown',e=>{if(phase==='auction'&&A.state==='bid'){if(e.key===' '||e.key==='1'){e.preventDefault();ACT.bid('1');}if(e.key==='5')ACT.bid('5');}if(phase==='unbox'&&(e.key===' '||e.key==='Enter')){const b=panel.querySelector('[data-act="reveal"],[data-act="nextUnbox"]');if(b){e.preventDefault();b.click();}}});

/* ============ loop ============ */
let last=performance.now(),T0=0;
function frame(now){const rdt=Math.min(.5,(now-last)/1000);const dt=Math.min(.05,rdt);last=now;T0+=dt;
  const c=AU.center;c.open+=(c.target-c.open)*(1-Math.exp(-dt*3));c.mesh.position.y=1.6+c.open*3.2;
  if(phase==='title'&&Math.random()<.004)setShutter(rand(.1,.7));
  if(phase==='auction'){if(A.state==='peek'){A.peek-=rdt;const pb=$('#peekBar');if(pb)pb.style.transform=`scaleX(${clamp(A.peek/8,0,1)})`;if(A.peek<=0)startBidding();}if(A.state==='bid')updateBidding(rdt);}
  for(const n of A.npcs){const f=n._fig;if(!f)continue;f.raise=Math.max(0,f.raise-dt*1.6);f.armR.rotation.z=Math.min(1,f.raise*2)*2.6;if(n._bubble){n._bubbleT-=dt;if(n._bubbleT<=0){f.g.remove(n._bubble);n._bubble=null;}}}
  const ac=AU.auctioneer;ac.raise=Math.max(0,ac.raise-dt*2.5);ac.armR.rotation.x=-Math.sin(Math.min(1,ac.raise)*Math.PI)*1.6-.3;
  if(phase==='unbox'&&U.cur&&U.cur._holder)U.cur._holder.rotation.y+=dt*.8;
  if(cur===scShop){SH.display.rotation.y+=dt*.7;SH.kim.head.rotation.y=Math.sin(T0*.7)*.3;}
  if(room&&cur===room.scene&&room.update)room.update(dt,T0);
  if(room&&room.appRoot)for(const c of room.appRoot.children)c.material.opacity=.65+.35*Math.sin(T0*6);
  if(room&&cur===room.scene&&P&&P.time!=null){applyTOD(room,P.time);if(room.dust){room.dust.rotation.y+=dt*.02;room.dust.position.y=Math.sin(T0*.3)*.06;}}
  if(pent&&cur===pent.s)pent.me.armR.rotation.z=2.4+Math.sin(T0*6)*.4;
  updateTweens(dt);updateBursts(dt);updateView(dt);
  if(cur!==lastCur){lastCur=cur;applyEnv(cur);const f=document.getElementById('fade');f.style.transition='none';f.style.opacity='1';requestAnimationFrame(()=>{f.style.transition='opacity .5s ease-out';f.style.opacity='0';});}
  perf.t+=rdt;perf.n++;if(perf.t>3){if(perf.t/perf.n>.045&&bloom.enabled&&!perf.cut){bloom.enabled=false;perf.cut=true;}perf.t=0;perf.n=0;}
  rpass.scene=cur;composer.render(dt);requestAnimationFrame(frame);}
const perf={t:0,n:0,cut:false};
let lastCur=null;

/* ============ boot ============ */
cur=scAuction;
(function titleLot(){P={tier:0,nextId:1,room:[],inv:[],hold:{},cash:START_CASH,loans:[]};const lot=genLot('수집가의 창고');populateUnit(lot);setShutter(.5);P=null;})();
setView({target:new THREE.Vector3(0,1.3,-1),yaw:-.5,pitch:.2,dist:11,yl:[-99,99],auto:.06},true);
applyCam();
const meta=loadMeta();if(loadRun())$('#btnCont').hidden=false;
$('#rec').textContent=meta.runs?`지금까지 ${meta.runs}번의 인생 · 최고 점수 ${(meta.best||0).toLocaleString('ko-KR')}점`:'';
requestAnimationFrame(frame);
</script>
