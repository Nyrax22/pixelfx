<style>
/* Layout: full-bleed 3D stage, a thin HUD rail on top, one hazard-striped action sheet docked at the bottom. */
:root{
  --ink:#121110;        /* stage ground */
  --sheet:#1d1b18;      /* action sheet */
  --line:#3b362e;
  --text:#f2ebdd;
  --muted:#a59c8b;
  --hazard:#ffc531;     /* safety yellow: the one loud colour */
  --bid:#ff5b3d;        /* bids, stamps, losses */
  --money:#5ed38c;      /* gains */
  --steel:#8ea3b9;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#121110ee,#12111000);pointer-events:none}
#hud[hidden]{display:none!important}
.chip{pointer-events:auto;display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:11px;letter-spacing:.04em}
.chip.cash b{color:var(--money)}
.chip.rent.warn{border-color:var(--bid)} .chip.rent.warn b{color:var(--bid)}
.hud-spacer{flex:1}
.iconbtn{pointer-events:auto;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;padding:5px 9px;font-size:13px}

/* Sheet */
#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:6;width:min(620px,100%);box-sizing:border-box;
  max-height:min(52vh,520px);overflow-y:auto;background:var(--sheet);border-top:6px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px) 6;
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -12px 40px #0008}
#panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:2px 0 6px;letter-spacing:.01em;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--hazard);text-transform:uppercase;font-family:var(--mono)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 0;min-width:96px}
.btn{border:1px solid var(--line);background:#2a2722;padding:12px 12px;border-radius:3px;font-weight:700;font-size:15px}
.btn:hover:not(:disabled){background:#353129}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--hazard);color:#15120a;border-color:var(--hazard)}
.btn.go:hover:not(:disabled){background:#ffd35e}
.btn.red{background:var(--bid);border-color:var(--bid);color:#fff}
.btn.ghost{background:transparent}
.rumor{margin:8px 0 0;padding:10px 12px;background:#26231e;border-left:3px solid var(--steel);font-size:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-family:var(--mono)}
.bar{height:6px;background:#2c2924;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hazard);transform-origin:left}

.bidtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.leader{font-size:14px;color:var(--muted)} .leader b{color:var(--text)}
.leader.me b{color:var(--money)}
.call{font-family:var(--display);font-size:22px;color:var(--bid);min-height:28px;margin-top:6px}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--muted);max-height:76px;overflow:hidden;font-family:var(--mono)}
.log li.me{color:var(--money)}

.card{display:flex;gap:14px;align-items:center;margin-top:6px}
.rbadge{display:inline-block;padding:3px 8px;border-radius:2px;font-size:12px;font-weight:700;color:#111}
.card .big{font-family:var(--display);font-size:24px;line-height:1.15}
.val{font-family:var(--mono);font-weight:700;font-size:18px}
.gain{color:var(--money)} .loss{color:var(--bid)}

.inv{display:grid;gap:6px;margin-top:10px}
.it{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:#24211c;border-radius:3px;text-align:left}
.it.sel{border-color:var(--hazard);background:#2e2a22}
.it .dot{width:10px;height:10px;border-radius:50%}
.it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm small{display:block;color:var(--muted);font-size:11px}
.it .pr{font-family:var(--mono);font-size:13px;text-align:right}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:3px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:17px}

/* Overlays */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:9;display:grid;gap:6px;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:#000c;border:1px solid var(--line);padding:9px 12px;border-radius:3px;font-size:14px;animation:tin .25s ease-out}
.toast.good{border-color:var(--money)} .toast.bad{border-color:var(--bid)}
@media (max-width:640px){#toast{top:calc(env(safe-area-inset-top,0px) + 96px)}}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#stamp{position:fixed;left:50%;top:34%;z-index:8;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;font-family:var(--display);font-size:clamp(48px,14vw,104px);color:var(--bid);border:6px solid var(--bid);padding:2px 22px;border-radius:6px;opacity:0;text-shadow:0 2px 0 #0006;white-space:nowrap}
#stamp.on{animation:stamp 1.4s ease-out forwards}
#stamp.gold{color:var(--hazard);border-color:var(--hazard)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000a;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal .box{width:min(480px,100%);max-height:86vh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-top:6px solid var(--hazard);padding:20px;border-radius:3px;box-sizing:border-box}
#modal h3{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0 8px}
#modal p{line-height:1.6;margin:6px 0}

#title{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#12111000 30%,#121110f2 78%)}
#title .wrap{width:min(620px,100%);margin:0 auto}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,18vw,128px);line-height:.9;margin:0;letter-spacing:-.01em}
#title h1 span{color:var(--hazard)}
#title .tag{font-size:16px;margin:12px 0 4px;line-height:1.55}
#title .rec{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.how div{border-left:2px solid var(--hazard);padding-left:8px}
.how b{display:block;color:var(--text);font-size:14px}
@media (prefers-reduced-motion:reduce){#stamp.on{animation-duration:.01s}.toast{animation:none}}
</style>

function updateView(dt){
  const k=1-Math.exp(-dt*4.5);
  if(view.auto){view.tyaw+=view.auto*dt;}
  view.t.lerp(view.tt,k);view.yaw+=(view.tyaw-view.yaw)*k;view.pitch+=(view.tpitch-view.pitch)*k;view.dist+=(view.tdist-view.dist)*k;
  const asp=innerWidth/innerHeight;const d=view.dist*(asp<1?Math.min(1.9,1/Math.pow(asp,.75)):1);
  camera.position.set(view.t.x+d*Math.cos(view.pitch)*Math.sin(view.yaw),view.t.y+d*Math.sin(view.pitch),view.t.z+d*Math.cos(view.pitch)*Math.cos(view.yaw));
  camera.lookAt(view.t);
}
let panelH=0;
function applyCam(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;

function fitModel(obj,size){const h=new THREE.Group();h.add(obj);const bb=new THREE.Box3().setFromObject(obj);const s=bb.getSize(new THREE.Vector3());const k=size/Math.max(s.x,s.y,s.z,.001);obj.scale.multiplyScalar(k);

  const m=B[cat](r,q,palette(q,r));let small=(cat==='cash'||cat==='lotto')?.45:size;const f=fitModel(m,small);

  return f;}

const bursts=[];
function burst(scene,pos,color,n=70,speed=3){const geo=new THREE.BufferGeometry();const p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){p.set([pos.x,pos.y,pos.z],i*3);const a=Math.random()*Math.PI*2,e=Math.random()*1.2+.2;v.push(new THREE.Vector3(Math.cos(a)*Math.cos(e),Math.sin(e)+.3,Math.sin(a)*Math.cos(e)).multiplyScalar(speed*(.4+Math.random())));}
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.PointsMaterial({color,size:.09,map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});const pts=new THREE.Points(geo,m);scene.add(pts);bursts.push({pts,v,life:1.4,scene});}
function updateBursts(dt){for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=dt;const p=b.pts.geometry.attributes.position;for(let j=0;j<b.v.length;j++){b.v[j].y-=5*dt;p.setXYZ(j,p.getX(j)+b.v[j].x*dt,p.getY(j)+b.v[j].y*dt,p.getZ(j)+b.v[j].z*dt);}p.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.life/1.4);
  if(b.life<=0){b.scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}}}
const tweens=[];
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function updateTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.done&&w.done();}}}
const ease=k=>1-Math.pow(1-k,3);

let actx=null,master=null,muted=false;
function ensureAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.4;master.connect(actx.destination);}catch(e){actx=null;}}
function tone(f,dur=.15,type='sine',vol=.25,when=0,slide){if(!actx||muted)return;const t=actx.currentTime+when;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur=.1,vol=.3,when=0,freq=800){if(!actx||muted)return;const t=actx.currentTime+when;const b=actx.createBuffer(1,actx.sampleRate*dur,actx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=actx.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const sfx={
  bid:()=>tone(880,.09,'square',.12),npc:()=>tone(520,.09,'square',.08),tick:()=>tone(1200,.04,'sine',.1),
  gavel:()=>{noise(.12,.5,0,1200);tone(110,.25,'sine',.4);},
  reveal:q=>{const base=[262,330,392,523,659,784,1047];const n=[1,2,3,5,7][q];for(let i=0;i<n;i++)tone(base[i],.35,q>=3?'triangle':'sine',.18,i*.07);if(q>=4){tone(1568,.8,'triangle',.15,.5);noise(.5,.08,.4,6000);}if(q===0)tone(180,.3,'sawtooth',.08,0,90);},
  cash:()=>{tone(1320,.08,'square',.1);tone(1760,.12,'square',.1,.07);noise(.08,.15,0,4000);},
  bad:()=>{tone(300,.3,'sawtooth',.12,0,120);},good:()=>{tone(660,.12,'triangle',.15);tone(990,.2,'triangle',.15,.1);},
};

function rollNpcs(){return NPC_POOL.map(n=>({...n,skill:n.skill*rand(.7,1.4),aggr:n.aggr*rand(.88,1.14)}));}
function rarityRoll(bonus){const w=[30,44,17,7.5,1.5];w[0]*=Math.exp(-bonus*.5);w[2]*=Math.exp(bonus*.3);w[3]*=Math.exp(bonus*.6);w[4]*=Math.exp(bonus*.85);let t=w.reduce((a,b)=>a+b),x=Math.random()*t;for(let i=0;i<5;i++){x-=w[i];if(x<=0)return i;}return 1;}
function genItem(th,bonus,L){const cat=th.w?wpick(th.w):pick(CAT_KEYS);const C=CATS[cat];let rar=rarityRoll(bonus),fake=false;
  if(C.fake&&Math.random()<C.fake*.4){fake=true;rar=Math.random()<.85?3:4;}
  const base=rand(C.b[0],C.b[1])*(1+L*1.1);let trueV=fake?base*rand(.03,.1):base*RAR[rar].mult*rand(.8,1.25);let special=null,name=pick(PREFIX[rar])+' '+C.n;
  if(cat==='box'){const x=Math.random();if(x<.05){special='cash';trueV=rand(3,50)*(1+L);name='현금 봉투';}else if(x<.10){special='lotto';trueV=.1;name='복권 한 장';}}
  if(cat==='safe')special='safe';
  const shown=fake?base*RAR[rar].mult:trueV;
  return{id:P.nextId++,cat,rar,fake,special,name,trueV:r1(Math.max(.1,trueV)),estV:r1(Math.max(.1,shown*rand(.6,1.5))),appraised:false,vis:randi(1,1e9)};}
function genLot(force){const L=P.tier;let th=force?THEMES[4]:(()=>{let t=0;for(const x of THEMES)t+=x.p;let r=Math.random()*t;for(const x of THEMES){r-=x.p;if(r<=0)return x;}return THEMES[0];})();
  let bonus=(th.bonus==null?rand(-1,2.2):th.bonus)+L*.3+luck()*.08;const n=randi(th.n[0],th.n[1])+L;const items=[];for(let i=0;i<n;i++)items.push(genItem(th,bonus,L));
  items.forEach(it=>it.display=it.cat==='box'?'carton':(()=>{const x=Math.random();return x<.5?'open':x<.8?'tarp':'carton';})());
  const T=items.reduce((a,b)=>a+b.trueV,0);
  return{theme:th.name,items,T,open:rand(.38,.78),rumor:makeRumor(items),opening:Math.max(1,Math.round(T*Math.exp(gauss()*.4)*.1)),label:'B-'+randi(10,99),nGuess:n+randi(-1,1)};}
function makeRumor(items){const good=items.filter(i=>i.rar>=3&&!i.fake&&!i.special);const x=Math.random();
  if(good.length&&x<.4)return CATS[pick(good).cat].n+' 봤다는 사람이 있어.';
  if(x<.62)return CATS[pick(CAT_KEYS)].n+' 봤다는 사람이 있어.';
  return pick(RUMORS_FILLER);}

function populateUnit(lot,revealAll){AU.itemRoot.clear();AU.pileN=0;const n=lot.items.length;const cols=n>9?4:3;

function showLot(){const lot=A.lot=A.lots[A.idx];populateUnit(lot);AU.center.mesh.position.y=1.6;AU.center.open=0;setShutter(lot.open);
  const pl=textPlane(lot.label,1.1,.36,{bg:'#e9e1cc'});AU.center.plate.material=pl.material;
  setView({target:new THREE.Vector3(0,.9,-1.8),yaw:0,pitch:.24,dist:11,yl:[-.55,.55],pl:[.04,.6],dl:[6,15]});
  A.state='peek';A.peek=8;
  setPanel(`<div class="eyebrow">창고 ${A.idx+1} / ${A.lots.length} · ${lot.label}</div><h2>${lot.theme}</h2>
    <p class="rumor">“${esc(lot.rumor)}”</p>
    <div class="meta"><span>물건 약 <b>${lot.nGuess}개</b></span><span>시작가 <b>${won(lot.opening)}</b></span><span>내 잔고 <b>${won(P.cash)}</b></span></div>
    <div class="bar"><i id="peekBar"></i></div><div class="muted" style="font-size:12px;margin-top:4px">셔터가 열린 동안 안을 살펴보세요. 화면을 끌면 시점이 돌아갑니다.</div>
    <div class="row"><button class="btn go" data-act="bidStart">바로 입찰</button><button class="btn ghost" data-act="passLot">이 창고 패스</button></div>`);}
function setNpcMaxes(lot){for(const n of A.npcs){if(Math.random()<.22){n._max=0;continue;}let est=lot.T*Math.exp(gauss()*n.skill)*n.aggr*rand(.9,1.1);if(n.likes===lot.theme)est*=1.25;if(n.style==='random')est*=rand(.5,1.5);
    const wallet=n.wallet*(1+P.tier*2.5)*rand(.6,1.4);n._max=Math.floor(Math.min(est,wallet));}}
function startBidding(){if(A.state!=='peek')return;A.state='bid';const lot=A.lot;A.price=lot.opening;A.leader=null;A.count=4.5;A.cool=1.0;A.log=[];A.out=false;A.speed=1;A.lastCall='';
  setNpcMaxes(lot);
  setPanel(`<div class="eyebrow">${lot.label} · ${lot.theme}</div><div class="bidtop"><div class="price" id="bPrice">${won(A.price)}</div><div class="leader" id="bLeader">첫 입찰을 기다리는 중</div></div>
    <div class="call" id="bCall"></div><div class="bar"><i id="bTimer"></i></div>
    <div class="row"><button class="btn go" data-act="bid" data-arg="1" id="bB1"></button><button class="btn red" data-act="bid" data-arg="5" id="bB5"></button><button class="btn ghost" data-act="fold" id="bFold">포기</button></div>
    <ol class="log" id="bLog"></ol>`);updateBidUI();}
function nextPrice(mult=1){return A.leader===null?A.price:A.price+inc(A.price)*mult;}
function updateBidUI(){if(A.state!=='bid')return;const p1=nextPrice(1),p5=A.leader===null?A.price+inc(A.price)*4:nextPrice(5);
  $('#bPrice').textContent=won(A.price);const L=$('#bLeader');if(A.leader==='me'){L.className='leader me';L.innerHTML='최고가: <b>나</b>';}else if(A.leader){L.className='leader';L.innerHTML=`최고가: <b>${esc(A.leader.name)}</b>`;}else{L.className='leader';L.textContent='첫 입찰을 기다리는 중';}
  const b1=$('#bB1'),b5=$('#bB5');b1.textContent=A.leader===null?`${won(p1)} 부르기`:`+${won(p1-A.price)}`;b5.textContent=`+${won(p5-A.price)} 크게`;
  b1.disabled=A.out||A.leader==='me'||P.cash<p1;b5.disabled=A.out||A.leader==='me'||P.cash<p5;$('#bFold').disabled=A.out||A.leader==='me';
  $('#bLog').innerHTML=A.log.slice(-4).reverse().map(l=>`<li class="${l.me?'me':''}">${esc(l.t)}</li>`).join('');}
function placeBid(who,newP){A.price=newP;A.leader=who;A.count=3.3;A.lastCall='';const c=$('#bCall');if(c)c.textContent='';
  if(who==='me'){A.log.push({t:`나 ${won(newP)}`,me:true});sfx.bid();A.cool=rand(.5,1.1);}else{A.log.push({t:`${who.name} ${won(newP)}`});sfx.npc();npcBubble(who,won(newP));A.cool=rand(.25,.6);}
  updateBidUI();}
function updateBidding(dt){const sdt=dt*A.speed;A.count-=sdt;A.cool-=sdt;
  if(A.cool<=0){const cands=A.npcs.filter(n=>A.leader!==n&&n._max>=nextPrice(1));
    for(const n of cands.sort(()=>Math.random()-.5)){let rate={steady:1.3,aggro:2.6,stubborn:1.5,random:.9,sniper:A.count<1.3?5:.12,hype:1.8}[n.style];
      if(n.style==='stubborn'&&A.leader==='me')rate+=2.2;if(A.price>.8*n._max)rate*=.5;
      if(Math.random()<rate*sdt){let m=1;if(n.style==='aggro'&&Math.random()<.3)m=2;if(n.style==='hype'&&Math.random()<.2)m=4;let np=nextPrice(m);if(np>n._max)np=nextPrice(1);placeBid(n,np);break;}}}
  const call=A.count>2.2?'':A.count>1.1?'하나…':A.count>0?'둘…':'';if(call!==A.lastCall){A.lastCall=call;const c=$('#bCall');if(c)c.textContent=call;if(call)sfx.tick();}
  const bt=$('#bTimer');if(bt)bt.style.transform=`scaleX(${clamp(A.count/3.3,0,1)})`;
  if(A.count<=0)endLot();}
function quickResolve(floor){const ms=A.npcs.map(n=>({n,m:n._max??0})).filter(x=>x.m>=floor).sort((a,b)=>b.m-a.m);
  if(!ms.length)return null;const top=ms[0],second=ms[1];let price=Math.max(floor,second?Math.min(top.m,second.m+inc(second.m)):floor);return{n:top.n,price};}
function endLot(){if(A.state!=='bid'&&A.state!=='peek')return;const lot=A.lot;let winner=null,price=0;
  if(A.state==='peek'){setNpcMaxes(lot);const r=quickResolve(lot.opening);if(r){winner=r.n;price=r.price;}}
  else if(A.out){const floor=A.leader?A.price+inc(A.price):A.price;const r=quickResolve(floor);if(r&&r.n!==A.leader){winner=r.n;price=r.price;}else if(A.leader){winner=A.leader;price=A.price;}}
  else{winner=A.leader;price=A.price;}
  A.state='done';sfx.gavel();AU.auctioneer.raise=1;
  let html=`<div class="eyebrow">${lot.label} · ${lot.theme}</div>`;
  if(winner==='me'){P.cash-=price;P.stats.won++;P.stats.spent+=price;lot.paid=price;A.won.push(lot);stamp('낙찰!');renderHUD();
    html+=`<h2>내가 낙찰받았다!</h2><p>낙찰가 <span class="val">${won(price)}</span>. 안에 뭐가 들었을지는 이따 열어본다.</p>`;}
  else if(winner){const best=lot.items.reduce((a,b)=>b.trueV>a.trueV?b:a);stamp(winner.name.length>4?'낙찰':winner.name+' 낙찰');if(winner._fig)npcBubble(winner,'낙찰!','#2a8a5a');
    const verdict=lot.T>price*1.3?'<span class="loss">아깝다…</span>':lot.T<price*.8?'<span class="gain">휴, 안 사길 잘했다.</span>':'';
    html+=`<h2>${esc(winner.name)} 낙찰 · ${won(price)}</h2><p>열어보니 제일 좋은 건 ${rb(best.fake?0:best.rar)} <b>${esc(best.fake?'가짜 '+CATS[best.cat].n:best.name)}</b>. 창고 전체 가치는 약 <span class="val">${won(lot.T)}</span>. ${verdict}</p>`;}
  else{stamp('유찰');html+=`<h2>유찰</h2><p class="muted">아무도 입찰하지 않았다.</p>`;}
  const last=A.idx>=A.lots.length-1;html+=`<div class="row"><button class="btn go" data-act="nextLot">${last?(A.won.length?'낙찰받은 창고 열기':'만물상으로'):'다음 창고 →'}</button></div>`;
  setPanel(html);}
function nextLot(){if(A.idx<A.lots.length-1){A.idx++;showLot();}else if(A.won.length)goUnbox();else goShop();}

/* ---------- unbox ---------- */
const U={lots:[],li:0,queue:[],i:-1,cur:null,lotValue:0};
function goUnbox(){phase='unbox';U.lots=A.won.slice();U.li=0;AU.npcRoot.visible=false;startUnboxLot();}
function startUnboxLot(){const lot=U.lots[U.li];populateUnit(lot);AU.center.open=lot.open;setShutter(1);AU.pallet.visible=true;U.queue=lot.items.slice().sort(()=>Math.random()-.5);U.i=-1;U.cur=null;U.lotValue=0;
  setView({target:new THREE.Vector3(0,1.0,.6),yaw:0,pitch:.22,dist:6.4,yl:[-.7,.7],pl:[.05,.7],dl:[4,10]});
  setPanel(`<div class="eyebrow">개봉 ${U.li+1} / ${U.lots.length} · ${lot.label}</div><h2>${lot.theme}</h2><p class="muted">낙찰가 ${won(lot.paid)}. 물건 ${lot.items.length}개를 하나씩 꺼내본다.</p><div class="row"><button class="btn go" data-act="reveal">첫 물건 꺼내기</button></div>`);}
function pileCurrent(){const it=U.cur;if(!it)return;const h=it._holder;const k=AU.pileN++;const tx=(k%2?1:-1)*(2.0+Math.floor(k/2)%3*.9),tz=4.6+Math.floor(k/6)*.9;const from=h.position.clone(),fs=h.scale.x;
  tween(.45,t=>{const e=ease(t);h.position.lerpVectors(from,new THREE.Vector3(tx,0,tz),e);h.scale.setScalar(fs+(.75-fs)*e);});}
function revealNext(){pileCurrent();U.i++;const lot=U.lots[U.li];
  if(U.i>=U.queue.length){AU.beam.material.opacity=0;const profit=U.lotValue-lot.paid;
    setPanel(`<div class="eyebrow">${lot.label} 정산</div><h2>${profit>=0?'남는 장사!':'손해 봤다…'}</h2><div class="grid2"><div class="stat"><small>낙찰가</small><b>${won(lot.paid)}</b></div><div class="stat"><small>꺼낸 물건 추정가</small><b>${won(U.lotValue)}</b></div><div class="stat"><small>예상 손익</small><b class="${profit>=0?'gain':'loss'}">${profit>=0?'+':''}${won(profit)}</b></div></div><p class="muted" style="font-size:13px">추정가는 감정 전 어림값이에요. 짝퉁이 섞여 있을 수도 있어요.</p><div class="row"><button class="btn go" data-act="nextUnbox">${U.li<U.lots.length-1?'다음 창고 열기':'만물상으로'}</button></div>`);return;}
  const it=U.cur=U.queue[U.i];const h=it._holder;if(it._cover){h.remove(it._cover);it._cover=null;}it._model.visible=true;
  const from=h.position.clone(),to=new THREE.Vector3(0,.32,5.1);const fs=h.scale.x;tween(.6,t=>{const e=ease(t);h.position.lerpVectors(from,to,e);h.position.y+=Math.sin(t*Math.PI)*1.2;h.scale.setScalar(fs+(1.3-fs)*e);});
  const col=new THREE.Color(RAR[it.rar].col);AU.beam.material.color.copy(col);tween(.3,t=>AU.beam.material.opacity=t*(it.rar>=3?.45:it.rar===2?.28:.12));
  setTimeout(()=>{burst(scAuction,new THREE.Vector3(0,1,2.6),col,it.rar>=3?140:50,it.rar>=3?4:2.5);sfx.reveal(it.rar);if(it.rar>=4)stamp('대박!',true);},420);
  let extra='';
  if(it.special==='cash'){P.cash+=it.trueV;P.stats.earned+=it.trueV;extra=`<p class="gain">봉투 안에 현금 ${won(it.trueV)}! 바로 지갑에 넣었다.</p>`;sfx.cash();renderHUD();}
  else{P.inv.push(it);U.lotValue+=it.estV;if(!it.fake&&(!P.stats.best||it.trueV>P.stats.best.v))P.stats.best={name:it.name,v:it.trueV};if(it.rar===4&&!it.fake)P.stats.legend++;}
  const note=it.special==='safe'?'<p class="muted">잠겨 있다. 만물상에서 열쇠공을 부르면 열 수 있다.</p>':it.special==='lotto'?'<p class="muted">아직 안 긁은 복권이다.</p>':'';
  setPanel(`<div class="eyebrow">${U.i+1} / ${U.queue.length}</div><div class="card"><div><div>${rb(it.rar)}</div><div class="big">${esc(it.name)}</div>${it.special==='cash'?'':`<div class="muted">추정가 <span class="val" style="color:var(--text)">~${won(it.estV)}</span></div>`}</div></div>${extra}${note}
    <div class="row"><button class="btn go" data-act="reveal">${U.i<U.queue.length-1?'다음 물건':'정산 보기'}</button>${U.i<U.queue.length-1?'<button class="btn ghost" data-act="revealAll">전부 열기</button>':''}</div>`);}
function revealAll(){let total=0;while(U.i<U.queue.length-1){pileCurrent();U.i++;const it=U.cur=U.queue[U.i];if(it._cover){it._holder.remove(it._cover);it._cover=null;}it._model.visible=true;
    if(it.special==='cash'){P.cash+=it.trueV;P.stats.earned+=it.trueV;}else{P.inv.push(it);U.lotValue+=it.estV;if(!it.fake&&(!P.stats.best||it.trueV>P.stats.best.v))P.stats.best={name:it.name,v:it.trueV};if(it.rar===4&&!it.fake)P.stats.legend++;}total++;}
  const best=U.queue.reduce((a,b)=>b.rar>a.rar?b:a);sfx.reveal(best.rar);if(best.rar>=4)stamp('대박!',true);renderHUD();U.cur=null;revealNext();}
function nextUnbox(){if(U.li<U.lots.length-1){U.li++;startUnboxLot();}else goShop();}

/* ---------- shop ---------- */
let selId=null;
function goShop(){phase='shop';AU.pallet.visible=false;switchScene(scShop);setView({target:new THREE.Vector3(0,1.15,-.4),yaw:0,pitch:.3,dist:5.4,yl:[-.5,.5],pl:[.05,.6],dl:[3.5,8]},true);
  for(const it of P.inv){if(it.offerDay!==P.day){it.offerDay=P.day;it.offer=r1(Math.max(.1,it.trueV*rand(.68,.98)*(mod.market||1)));it.haggled=false;it.refused=false;}}
  selId=P.inv[0]?.id??null;renderShop();}
function renderShop(){const items=P.inv;const sel=itemById(selId);showOnCounter(sel);renderHUD();

  let det='';if(sel){const inRoom=P.room.includes(sel.id);const cost=Math.max(.5,r1(sel.estV*.05));const crack=Math.round(2*(1+P.tier*.5));
    det=`<div class="detail"><div>${rb(sel.fake&&sel.appraised?0:sel.rar)} <b>${esc(sel.name)}</b></div>
    <div class="muted" style="margin-top:4px">김 영감 제시가 <span class="val" style="color:var(--text)">${sel.refused?'오늘은 안 산대':won(sel.offer)}</span></div>

      <button class="btn go" data-act="sell" ${sel.refused||sel.special==='lotto'?'disabled':''}>팔기</button>

      ${sel.special==='lotto'?`<button class="btn red" data-act="scratch">복권 긁기</button>`:''}
      ${!sel.appraised&&!sel.special?`<button class="btn" data-act="appraise" ${P.cash<cost?'disabled':''}>감정 (${won(cost)})</button>`:''}
      ${sel.special?'':`<button class="btn ghost" data-act="keep" ${!inRoom&&P.room.length>=TIERS[P.tier].slots?'disabled':''}>${inRoom?'방에서 빼기':'방에 두기'}</button>`}
    </div></div>`;}
  setPanel(`<div class="eyebrow">만물상 · ${mod.market>1?'오늘 호황 +25%':mod.market<1?'오늘 불경기 -25%':'평소 시세'}</div><h2>팔 것인가, 둘 것인가</h2>
    <p class="muted" style="font-size:13px;margin:0">방에 둔 괜찮음 이상 물건은 운을 올려줍니다 (방 자리 ${P.room.length}/${TIERS[P.tier].slots}). 운이 높으면 좋은 창고와 흥정 성공이 늘어요.</p>
    <div class="inv">${list}</div>${det}<div class="row"><button class="btn ghost" data-act="sellAll" ${items.filter(i=>!P.room.includes(i.id)&&!i.refused&&i.special!=='lotto').length?'':'disabled'}>방에 없는 것 전부 팔기</button><button class="btn go" data-act="goHome">집으로</button></div>`);}
function removeItem(id){P.inv=P.inv.filter(x=>x.id!==id);P.room=P.room.filter(x=>x!==id);if(selId===id)selId=P.inv[0]?.id??null;}
function sellItem(id,quiet){const it=itemById(id);if(!it||it.refused)return 0;P.cash+=it.offer;P.stats.earned+=it.offer;const v=it.offer;removeItem(id);if(!quiet){sfx.cash();toast(`${it.name} 판매 +${won(v)}`,'good');}return v;}

/* ---------- home ---------- */
function goHome(){closeModal();phase='home';ensureRoom();switchScene(room.scene);setView(room.view);renderHome();}
function renderHome(){renderHUD();const t=TIERS[P.tier];const diff=P.cash-P.dayStart;const nt=TIERS[P.tier+1];
  const moveBtn=nt?(()=>{const cost=nt.dep-t.dep;return `<button class="btn" data-act="move" ${P.cash<cost?'disabled':''}>${nt.name}로 이사 (보증금 +${won(cost)})</button>`;})():'';
  setPanel(`<div class="eyebrow">D+${P.day} 밤 · ${t.name}</div><h2>오늘 ${diff>=0?'+':''}${won(diff)}</h2>
    <div class="grid2"><div class="stat"><small>잔고</small><b>${won(P.cash)}</b></div><div class="stat"><small>월세 ${rentIn()===1?'오늘 밤':rentIn()+'일 뒤'}</small><b>${won(t.rent)}</b></div><div class="stat"><small>내 집까지</small><b>${won(Math.max(0,HOUSE_PRICE-P.cash))}</b></div></div>
    <p class="muted" style="font-size:13px">자고 나면 식비 ${mod.noFood?'0원(반찬 덕분)':won(t.food)}을 내고 다음 날이 됩니다.${rentIn()===1?' <b class="loss">오늘 밤 월세가 나갑니다.</b> 모자라면 물건이 헐값에 팔리고, 그래도 모자라면 쫓겨나요.':''}</p>
    <div class="row">${moveBtn}<button class="btn" data-act="buyHouse" ${P.cash<HOUSE_PRICE?'disabled':''}>내 집 사기 (${won(HOUSE_PRICE)})</button></div>
    <div class="row"><button class="btn ghost" data-act="toShop">만물상 다시 가기</button><button class="btn go" data-act="sleep">잠자기</button></div>`);}
function sleep(){const t=TIERS[P.tier];const food=mod.noFood?0:t.food;P.cash-=food;const rentDay=P.day%7===0;P.day++;
  if(rentDay){if(P.cash<t.rent){let sold=0;const order=P.inv.filter(i=>i.special!=='lotto').sort((a,b)=>(P.room.includes(a.id)?1:0)-(P.room.includes(b.id)?1:0)||b.trueV-a.trueV);
      for(const it of order){if(P.cash>=t.rent)break;const v=r1(Math.max(.1,it.trueV*.5));P.cash+=v;sold++;removeItem(it.id);}
      if(P.cash<t.rent){if(P.tier===0){gameOver();return;}const refund=t.dep-TIERS[P.tier-1].dep;P.cash+=refund-t.rent;P.tier--;P.room=P.room.slice(0,TIERS[P.tier].slots);room=null;
        modal(`<div class="eyebrow">월세 미납</div><h3>쫓겨났다</h3><p>월세를 못 내서 ${TIERS[P.tier+1].name}에서 나왔다. 보증금을 돌려받아 <b>${TIERS[P.tier].name}</b>(으)로 옮긴다.</p><div class="row"><button class="btn go" data-act="morning">다음 날</button></div>`);sfx.bad();return;}
      P.cash-=t.rent;toast(`월세가 모자라 물건 ${sold}개를 헐값에 팔았다.`,'bad');sfx.bad();}
    else{P.cash-=t.rent;toast(`월세 -${won(t.rent)}`,'bad');}}
  goMorning();}
function gameOver(){phase='over';clearRun();hidePanel();sfx.bad();const s=P.stats;
  modal(`<div class="eyebrow">인생 #${P.run} · D+${P.day}</div><h3>길바닥 엔딩</h3><p>고시원 월세 ${won(TIERS[0].rent)}을 못 냈다. 짐을 싸서 나왔다.</p>
    <div class="grid2"><div class="stat"><small>낙찰 횟수</small><b>${s.won}</b></div><div class="stat"><small>총 판매액</small><b>${won(s.earned)}</b></div><div class="stat"><small>최고의 발견</small><b style="font-size:13px">${s.best?esc(s.best.name):'없음'}</b></div><div class="stat"><small>전설 아이템</small><b>${s.legend}</b></div></div>
    <p class="muted">다음 인생에선 창고 안이 전부 다르게 나와요.</p><div class="row"><button class="btn go" data-act="newgame">다시 태어나기</button></div>`);}
let houseScene=null;
function win(){phase='win';P.cash-=HOUSE_PRICE;clearRun();const meta=loadMeta();meta.wins=(meta.wins||0)+1;if(!meta.best||P.day<meta.best)meta.best=P.day;saveMeta(meta);
  houseScene=buildHouse();switchScene(houseScene.s);setView({target:new THREE.Vector3(0,1.6,0),yaw:.6,pitch:.25,dist:13,yl:[-9,9],auto:.12},true);hidePanel();stamp('내 집!',true);sfx.reveal(4);
  const s=P.stats;modal(`<div class="eyebrow">인생 #${P.run} · D+${P.day}</div><h3>내 집 마련</h3><p>고시원에서 시작해 <b>${P.day}일 만에</b> 내 집 열쇠를 받았다.</p>
    <div class="grid2"><div class="stat"><small>낙찰 횟수</small><b>${s.won}</b></div><div class="stat"><small>총 판매액</small><b>${won(s.earned)}</b></div><div class="stat"><small>최고의 발견</small><b style="font-size:13px">${s.best?esc(s.best.name)+' · '+won(s.best.v):'없음'}</b></div><div class="stat"><small>짝퉁에 속은 횟수</small><b>${s.fakes}</b></div></div>
    <p class="muted">최단 기록 D+${meta.best}. 다음 판은 운이 또 다르게 굴러갑니다.</p><div class="row"><button class="btn go" data-act="newgame">새 인생</button></div>`);}

/* ============ actions ============ */
const ACT={
  newgame:()=>{closeModal();newGame();},continue:()=>continueGame(),
  mute:()=>{muted=!muted;$('#btnMute').textContent=muted?'소리 끔':'소리 켬';},
  giveup:()=>{if(phase==='title')return;modal(`<h3>새 인생을 시작할까요?</h3><p>지금 인생은 기록 없이 끝나요.</p><div class="row"><button class="btn" data-act="closeModal">계속하기</button><button class="btn red" data-act="newgame">새 인생</button></div>`);},
  closeModal:()=>closeModal(),
  toAuction:()=>goAuction(),morning:()=>{closeModal();goMorning();},
  lend:()=>{P.cash-=10;P.debt={day:P.day+3,ok:Math.random()<.5};renderHUD();goAuction();},refuse:()=>goAuction(),
  bidStart:()=>startBidding(),
  passLot:()=>{if(A.state!=='peek')return;endLot();},
  bid:a=>{if(A.state!=='bid'||A.out||A.leader==='me')return;const np=A.leader===null?(a==='5'?A.price+inc(A.price)*4:A.price):nextPrice(+a);if(P.cash<np){toast('잔고가 모자라요.','bad');return;}placeBid('me',np);},
  fold:()=>{if(A.state!=='bid'||A.leader==='me')return;A.out=true;endLot();},
  nextLot:()=>nextLot(),
  reveal:()=>revealNext(),revealAll:()=>revealAll(),nextUnbox:()=>nextUnbox(),
  sel:a=>{selId=+a;renderShop();},
  sell:()=>{sellItem(selId);renderShop();},
  sellAll:()=>{let t=0,n=0;for(const it of P.inv.slice()){if(P.room.includes(it.id)||it.refused||it.special==='lotto')continue;t+=sellItem(it.id,true);n++;}if(n){sfx.cash();toast(`${n}개 판매 +${won(t)}`,'good');}renderShop();},
  haggle:()=>{const it=itemById(selId);if(!it||it.haggled)return;it.haggled=true;const p=.45+luck()*.025;const x=Math.random();
    if(x<p){it.offer=r1(it.offer*rand(1.15,1.4));toast(`김 영감: "허 참… 알았네, ${won(it.offer)}."`,'good');sfx.good();}
    else if(x<p+.3){it.offer=r1(it.offer*rand(.85,.95));toast(`김 영감: "욕심이 과하구먼. 그럼 ${won(it.offer)}."`,'bad');}
    else{it.refused=true;toast('김 영감: "됐네, 오늘은 그 물건 안 사!"','bad');sfx.bad();}renderShop();},
  appraise:()=>{const it=itemById(selId);if(!it)return;const cost=Math.max(.5,r1(it.estV*.05));if(P.cash<cost)return;P.cash-=cost;it.appraised=true;
    if(it.fake){it.name='가짜 '+CATS[it.cat].n;it.estV=it.trueV;P.stats.fakes++;sfx.bad();stamp('짝퉁');toast(`감정 결과: 짝퉁… 실제 가치 ${won(it.trueV)}`,'bad');P.room=P.room.filter(x=>x!==it.id);}
    else{const up=it.trueV>=it.estV;it.estV=it.trueV;(up?sfx.good:sfx.bad)();toast(`감정 결과: ${won(it.trueV)}${up?' (생각보다 비싸다!)':''}`,up?'good':'bad');}renderShop();},
  keep:()=>{const it=itemById(selId);if(!it)return;if(P.room.includes(it.id)){P.room=P.room.filter(x=>x!==it.id);toast(`${it.name}을(를) 방에서 뺐다.`);}else if(P.room.length<TIERS[P.tier].slots){P.room.push(it.id);toast(`${it.name}을(를) 방에 뒀다. 운 ${luck()}`,'good');}renderShop();},
  crack:()=>{const it=itemById(selId);if(!it||it.special!=='safe')return;const cost=Math.round(2*(1+P.tier*.5));P.cash-=cost;const m=1+P.tier;const x=Math.random()*100;let v=0,msg;
    if(x<45)msg='텅 비어 있다…';else if(x<80){v=r1(rand(3,40)*m);msg=`현금 다발! +${won(v)}`;}else if(x<95){v=r1(rand(60,250)*m);msg=`금괴가 나왔다! +${won(v)}`;}else if(x<99.5){v=r1(rand(300,900)*m);msg=`무기명 채권 뭉치! +${won(v)}`;}else{v=r1(rand(2000,4000));msg=`다이아몬드 주머니!! +${won(v)}`;}
    it.special=null;it.name='열린 '+CATS.safe.n;P.cash+=v;P.stats.earned+=v;if(v>0){sfx.reveal(v>200?4:v>40?3:2);if(v>200)stamp('대박!',true);}else sfx.bad();toast('금고: '+msg,v>0?'good':'bad');renderShop();},
  scratch:()=>{const it=itemById(selId);if(!it)return;const x=Math.random()*100;let v=0;if(x<65)v=0;else if(x<87)v=.5;else if(x<96)v=5;else if(x<99.5)v=50;else if(x<99.95)v=500;else v=5000;
    removeItem(it.id);P.cash+=v;P.stats.earned+=v;if(v>=500){stamp('1등!',true);sfx.reveal(4);}else if(v>0)sfx.good();else sfx.bad();toast(v?`복권 당첨! +${won(v)}`:'꽝. 다음 기회에…',v?'good':'bad');renderShop();},
  goHome:()=>goHome(),toShop:()=>goShop(),
  move:()=>{const nt=TIERS[P.tier+1];if(!nt)return;const cost=nt.dep-TIERS[P.tier].dep;if(P.cash<cost)return;P.cash-=cost;P.tier++;ensureRoom();switchScene(room.scene);setView(room.view,true);sfx.reveal(3);stamp('이사!',true);toast(`새 보금자리: ${nt.name}`,'good');renderHome();},
  buyHouse:()=>{if(P.cash>=HOUSE_PRICE)win();},
  sleep:()=>sleep(),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ensureAudio();if(actx&&actx.state==='suspended')actx.resume();ACT[b.dataset.act]?.(b.dataset.arg,b);});
document.addEventListener('keydown',e=>{if(phase==='auction'&&A.state==='bid'){if(e.key===' '||e.key==='1'){e.preventDefault();ACT.bid('1');}if(e.key==='5')ACT.bid('5');}if(phase==='unbox'&&(e.key===' '||e.key==='Enter')){const b=panel.querySelector('[data-act="reveal"],[data-act="nextUnbox"]');if(b){e.preventDefault();b.click();}}});

/* ============ loop ============ */
let last=performance.now(),T0=0;
function frame(now){const rdt=Math.min(.5,(now-last)/1000);const dt=Math.min(.05,rdt);last=now;T0+=dt;
  const c=AU.center;c.open+=(c.target-c.open)*(1-Math.exp(-dt*3));c.mesh.position.y=1.6+c.open*3.2;
  if(phase==='title'){if(Math.random()<.004)setShutter(rand(.1,.7));}
  if(phase==='auction'){if(A.state==='peek'){A.peek-=rdt;const pb=$('#peekBar');if(pb)pb.style.transform=`scaleX(${clamp(A.peek/8,0,1)})`;if(A.peek<=0)startBidding();}if(A.state==='bid')updateBidding(rdt);}
  for(const n of A.npcs){const f=n._fig;if(!f)continue;f.raise=Math.max(0,f.raise-dt*1.6);f.armR.rotation.z=Math.min(1,f.raise*2)*2.6;f.g.position.y=Math.sin(T0*2+f.g.position.x)*.01;if(n._bubble){n._bubbleT-=dt;if(n._bubbleT<=0){f.g.remove(n._bubble);n._bubble=null;}}}
  const ac=AU.auctioneer;ac.raise=Math.max(0,ac.raise-dt*2.5);ac.armR.rotation.x=-Math.sin(Math.min(1,ac.raise)*Math.PI)*1.6-.3;
  if(phase==='unbox'&&U.cur&&U.cur._holder)U.cur._holder.rotation.y+=dt*.8;
  if(cur===scShop){SH.display.rotation.y+=dt*.7;SH.kim.head.rotation.y=Math.sin(T0*.7)*.3;}
  if(room&&cur===room.scene&&room.update)room.update(dt,T0);
  if(houseScene&&cur===houseScene.s){houseScene.me.armR.rotation.z=2.4+Math.sin(T0*6)*.4;}
  updateTweens(dt);updateBursts(dt);updateView(dt);renderer.render(cur,camera);requestAnimationFrame(frame);}

/* ============ boot ============ */
switchScene(scAuction);
(function titleLot(){P={tier:0,nextId:1,room:[],inv:[]};const lot=genLot(true);populateUnit(lot);setShutter(.5);P=null;})();
setView({target:new THREE.Vector3(0,1.3,-1),yaw:-.5,pitch:.2,dist:11,yl:[-9,9],auto:.06},true);
applyCam();
const meta=loadMeta();const saved=loadRun();if(saved){$('#btnCont').hidden=false;}
$('#rec').textContent=meta.runs?`지금까지 ${meta.runs}번의 인생 · 내 집 마련 ${meta.wins||0}번${meta.best?` · 최단 D+${meta.best}`:''}`:'';
requestAnimationFrame(frame);
</script>
