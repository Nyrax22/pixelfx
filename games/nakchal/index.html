<meta charset="utf-8">
<title>인생 떡상</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* Layout: full-bleed 3D stage, a thin HUD rail on top, one hazard-striped action sheet docked at the bottom; the morning paper opens as a sheet of newsprint. */
:root{
  --ink:#121110;--sheet:#1d1b18;--line:#3b362e;--text:#f2ebdd;--muted:#a59c8b;
  --hazard:#ffc531;   /* safety yellow: the loud colour */
  --bid:#ff5b3d;      /* bids, stamps */
  --money:#5ed38c;
  --up:#ff4d55;       /* Korean market convention: up is red */
  --down:#4d8dff;     /* down is blue */
  --steel:#8ea3b9;
  --paper:#efe8d8;--paper-ink:#1d1a15;--paper-rule:#b8ad96;--paper-up:#c8202b;--paper-down:#1f4fb8;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.up{color:var(--up)}.down{color:var(--down)}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#121110ee,#12111000);pointer-events:none}
.chip{pointer-events:auto;flex-shrink:0;display:inline-flex;align-items:baseline;gap:6px;padding:5px 9px;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:11px;letter-spacing:.04em}
.chip.cash b{color:var(--money)}
.chip.rank b{color:var(--hazard)}
.chip.rent.warn{border-color:var(--bid)} .chip.rent.warn b{color:var(--bid)}
.hud-spacer{flex:1}
.iconbtn{pointer-events:auto;border:1px solid var(--line);background:#1d1b18d9;border-radius:3px;padding:5px 9px;font-size:13px}

#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:6;width:min(640px,100%);box-sizing:border-box;
  max-height:min(56vh,560px);overflow-y:auto;background:var(--sheet);border-top:6px solid transparent;
  border-image:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#111 12px 24px) 6;
  padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -12px 40px #0008}
#panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:2px 0 6px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--hazard);font-family:var(--mono)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 0;min-width:84px}
.btn{border:1px solid var(--line);background:#2a2722;padding:12px 10px;border-radius:3px;font-weight:700;font-size:15px}
.btn:hover:not(:disabled){background:#353129}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--hazard);color:#15120a;border-color:var(--hazard)}
.btn.go:hover:not(:disabled){background:#ffd35e}
.btn.red{background:var(--bid);border-color:var(--bid);color:#fff}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff}
.btn.sell{background:var(--down);border-color:var(--down);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 6px;font-size:13px}
.rumor{margin:8px 0 0;padding:10px 12px;background:#26231e;border-left:3px solid var(--steel);font-size:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-family:var(--mono)}
.bar{height:6px;background:#2c2924;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hazard);transform-origin:left}
.bidtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.leader{font-size:14px;color:var(--muted)} .leader b{color:var(--text)} .leader.me b{color:var(--money)}
.call{font-family:var(--display);font-size:22px;color:var(--bid);min-height:28px;margin-top:6px}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--muted);max-height:76px;overflow:hidden;font-family:var(--mono)}
.log li.me{color:var(--money)}
.card{display:flex;gap:14px;align-items:center;margin-top:6px}
.rbadge{display:inline-block;padding:3px 8px;border-radius:2px;font-size:12px;font-weight:700;color:#111}
.card .big{font-family:var(--display);font-size:24px;line-height:1.15}
.val{font-family:var(--mono);font-weight:700;font-size:18px}
.gain{color:var(--money)} .loss{color:var(--bid)}
.inv{display:grid;gap:6px;margin-top:10px}
.it{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:#24211c;border-radius:3px;text-align:left}
.it.sel{border-color:var(--hazard);background:#2e2a22}
.it .dot{width:10px;height:10px;border-radius:50%}
.it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm small{display:block;color:var(--muted);font-size:11px}
.it .pr{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:3px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.stat b{font-family:var(--mono);font-size:16px}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hub button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px;border:1px solid var(--line);background:#26231e;border-radius:3px;min-width:0}
.hub button b{font-size:16px}
.hub button small{color:var(--muted);font-size:12px}
.hub button:hover:not(:disabled){border-color:var(--hazard)}
.hub button:disabled{opacity:.4;cursor:not-allowed}
.hub button.go{background:var(--hazard);color:#15120a;border-color:var(--hazard)} .hub button.go small{color:#4a3a10}
.rk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.rk li{display:grid;grid-template-columns:22px 12px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;background:#211f1b;border-radius:2px}
.rk li.me{outline:1px solid var(--hazard)}
.rk .n{font-family:var(--mono);color:var(--muted)}
.rk .sw{width:10px;height:10px;border-radius:2px}
.rk .w{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rk .d{font-family:var(--mono);font-size:12px;min-width:58px;text-align:right}
.rk small{color:var(--muted)}

.tabs{display:flex;gap:4px;margin-top:4px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#24211c;border-radius:3px;font-weight:700}
.tabs button.on{background:var(--hazard);color:#15120a;border-color:var(--hazard)}
.tl{display:grid;gap:4px;margin-top:8px}
.tr{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);background:#24211c;border-radius:3px;text-align:left}
.tr.sel{border-color:var(--hazard);background:#2e2a22}
.tr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{color:var(--muted);font-size:11px;margin-left:4px}
.tr .p{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tr .c{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tr .hold{display:block;font-size:11px;color:var(--money)}
#chart{width:100%;height:96px;display:block;margin-top:8px;background:#161512;border-radius:2px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qhead .big{font-family:var(--display);font-size:24px}
.qhead .pp{font-family:var(--mono);font-size:20px;font-weight:700}

.meter{display:inline-block;width:44px;height:7px;background:#2c2924;border-radius:3px;overflow:hidden;align-self:center}
.meter i{display:block;height:100%;width:50%;background:var(--money);transition:width .3s}
.meter.low i{background:var(--bid)}
.warn-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.warn-list li{font-size:13px;padding:6px 9px;border-left:3px solid var(--bid);background:#2a1c18}
.warn-list li.ok{border-color:var(--money);background:#1b2a20}
.sect{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:14px 0 0;font-family:var(--mono)}
.hub button .tm{font-family:var(--mono);font-size:11px;color:var(--hazard)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.prod{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:1px solid var(--line);background:#24211c;border-radius:3px;min-width:0}
.prod:hover:not(:disabled){border-color:var(--hazard)}
.prod:disabled{opacity:.4;cursor:not-allowed}
.prod b{font-size:14px}.prod small{color:var(--muted);font-size:12px}.prod .pp{font-family:var(--mono);color:var(--hazard);font-size:13px}
.loan{padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-top:8px}
.loan h4{margin:0 0 4px;font-size:15px}
#toast{position:fixed;left:50%;top:calc(var(--hud-h,58px) + 6px);transform:translateX(-50%);z-index:12;display:grid;gap:6px;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:#000d;border:1px solid var(--line);padding:9px 12px;border-radius:3px;font-size:14px;animation:tin .25s ease-out}
.toast.good{border-color:var(--money)} .toast.bad{border-color:var(--bid)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#stamp{position:fixed;left:50%;top:34%;z-index:11;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;font-family:var(--display);font-size:clamp(48px,14vw,104px);color:var(--bid);border:6px solid var(--bid);padding:2px 22px;border-radius:6px;opacity:0;white-space:nowrap}
#stamp.on{animation:stamp 1.4s ease-out forwards}
#stamp.gold{color:var(--hazard);border-color:var(--hazard)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}75%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000b;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
#modal .box{width:min(480px,100%);max-height:88vh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line);border-top:6px solid var(--hazard);padding:20px;border-radius:3px;box-sizing:border-box}
#modal h3{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0 8px}
#modal p{line-height:1.6;margin:6px 0}

/* The morning paper */
#modal .box.paper{width:min(760px,100%);background:var(--paper);color:var(--paper-ink);border:none;border-radius:1px;padding:18px 20px 20px;font-family:var(--serif);box-shadow:0 20px 60px #000c;
  background-image:radial-gradient(#0000 60%,#6b5a3a14),repeating-linear-gradient(0deg,#0000 0 3px,#00000005 3px 4px)}
.mast{text-align:center;border-bottom:3px double var(--paper-ink);padding-bottom:6px}
.mast .nm{font-family:var(--serif);font-weight:800;font-size:clamp(38px,9vw,60px);letter-spacing:.06em;line-height:1}
.mast .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--body);font-size:11px;letter-spacing:.08em;border-top:1px solid var(--paper-ink);margin-top:6px;padding-top:4px}
.lead{padding:12px 0;border-bottom:1px solid var(--paper-rule)}
.lead h4{font-family:var(--serif);font-weight:800;font-size:clamp(22px,5.4vw,32px);line-height:1.25;margin:4px 0 0;text-wrap:balance}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.sec{padding:10px 0;border-bottom:1px solid var(--paper-rule);min-width:0}
.sec h5{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.14em;margin:0 0 6px;border-bottom:2px solid var(--paper-ink);display:inline-block;padding-bottom:2px}
.news{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.news li{font-size:15px;line-height:1.45;font-weight:700}
.lb{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:700;padding:1px 5px;margin-right:5px;vertical-align:2px;border-radius:1px}
.lb.hi{background:var(--paper-up);color:#fff}
.lb.mid{background:var(--paper-ink);color:var(--paper)}
.lb.lo{border:1px dashed var(--paper-ink);color:var(--paper-ink)}
.mv{list-style:none;margin:0;padding:0;font-family:var(--body);font-size:13px;display:grid;gap:4px}
.mv li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.mv .pc{font-family:var(--mono);font-weight:700;min-width:62px}
.mv .pc.u{color:var(--paper-up)} .mv .pc.d{color:var(--paper-down)}
.mv .why{color:#5a5242;font-size:12px}
.prank{font-family:var(--body);font-size:13px;list-style:none;margin:0;padding:0;display:grid;gap:3px}
.prank li{display:flex;justify-content:space-between;gap:8px}
.prank b{font-family:var(--mono)}
.tip{font-family:var(--body);font-size:12px;color:#5a5242;margin-top:10px;line-height:1.5}
.box.paper .btn{border-color:var(--paper-ink)}
.box.paper .btn.go{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}

#title{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#12111000 25%,#121110f2 72%)}
#title .wrap{width:min(640px,100%);margin:0 auto}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,18vw,128px);line-height:.9;margin:0}
#title h1 span{color:var(--up)}
#title .tag{font-size:16px;margin:12px 0 4px;line-height:1.55}
#title .rec{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.how div{border-left:2px solid var(--hazard);padding-left:8px}
.how b{display:block;color:var(--text);font-size:14px}
#prompt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:6;min-width:230px;padding:15px 22px;font-size:17px;box-shadow:0 2px 0 #b8861a,0 8px 28px #000a}
#prompt:disabled{background:#2a2722;color:var(--muted);border-color:var(--line);box-shadow:none;opacity:1}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);z-index:5;font-size:13px;background:#000a;padding:7px 12px;border-radius:3px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:112px;height:112px;border-radius:50%;border:2px solid #ffffff55;background:#0006;z-index:6;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--hazard);opacity:.9;pointer-events:none}
.iconbtn.phone{background:var(--hazard);color:#15120a;border-color:var(--hazard);font-weight:700}
.iconbtn:disabled{opacity:.45;cursor:not-allowed}
.chip.clock b{color:var(--text)}.chip.clock .tm{color:var(--hazard);font-size:15px}.chip .x3{color:var(--money);font-family:var(--mono)}
.iconbtn.new{background:var(--up);border-color:var(--up);color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.6}}
#inbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(var(--hud-h,56px) + 10px);z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}#inbar .chip{background:#000c;border:1px solid var(--line);padding:7px 10px;border-radius:4px;font-size:13px;color:#fff}
#mini{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--hud-h,56px) + 10px);z-index:5;width:150px;height:114px;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #0008;pointer-events:none}
@media(max-width:700px){#mini{width:112px;height:85px}}
.fly{position:fixed;z-index:13;transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:16px;pointer-events:none;text-shadow:0 2px 6px #000;animation:flyup 1.4s ease-out forwards}.fly.gain{color:#4ade80}.fly.loss{color:#ff6b5b}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,-6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,34px) scale(1)}}
.chip.pop{animation:chippop .35s}@keyframes chippop{40%{transform:scale(1.12)}}
.scwrap{position:relative;width:300px;max-width:100%;height:110px;margin:8px auto;border-radius:8px;overflow:hidden;background:#fff8e0;border:2px dashed #c89a30}.scwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .5s;cursor:crosshair}
.scprize{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;font-family:var(--display);font-size:22px;color:#8a2a1a}
.mgbar{position:relative;height:44px;background:#15130f;border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}.mgbar i{position:absolute;top:0;bottom:0;background:#1f9d55;box-shadow:inset 0 0 0 2px #4ade80}.mgbar b{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.prank.mis li.ok{color:#4ade80}
#drivebar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:6;display:flex;gap:8px;align-items:center;background:#000b;padding:8px;border-radius:4px;border:1px solid var(--line)}
#drivebar .spd{font-family:var(--mono);font-size:13px;padding:0 6px;white-space:nowrap}#drivebar .spd b{font-size:22px;color:var(--hazard)}
.prod.on{border-color:var(--hazard);background:#2e2a22}
.nlink{color:inherit;text-decoration:underline;text-decoration-color:#b8ad96;text-underline-offset:3px}
.when{font-family:var(--body);font-size:11.5px;color:#7a6a4a;font-weight:500}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 52%,rgba(0,0,0,.55) 100%)}
#fade{position:fixed;inset:0;pointer-events:none;z-index:4;background:#0b0a09;opacity:0}
.pin{animation:pin .22s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.hub button svg{width:20px;height:20px;fill:none;stroke:var(--hazard);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:3px}
.hub button:disabled svg{stroke:var(--muted)}
.btn.go{box-shadow:0 2px 0 #b8861a}

function aiWorth(ai){let v=ai.cash+ai.pending+TIERS[ai.tier].dep;for(const id in ai.pos)v+=ai.pos[id];return v;}
function aiMorning(W){for(const ai of W.ais){if(ai.out)continue;const S=STYLES[ai.style];let total=ai.cash;for(const id in ai.pos)total+=ai.pos[id];ai.pos={};
  const sc={};for(const a of ASSETS)sc[a.id]=a.kind==='coin'?S.coinBias:0;
  for(const n of W.news){if(n.binary){sc[n.id]+=S.gamble;continue;}const known=Math.random()<S.read;const v=known?(n.isTrue?1:0):LABEL_REL[n.label]*S.trust;for(const id in n.fx)sc[id]+=v*n.fx[id];}
  for(const a of ASSETS){const s=W.mkt[a.id];sc[a.id]+=S.mom*s.ret*6;const h=s.hist;const r5=h.length>6?s.price/h[h.length-6]-1:0;sc[a.id]-=S.rev*r5*3;}
  const cands=ASSETS.filter(a=>assetOn(a,W)&&sc[a.id]>S.thresh).sort((a,b)=>sc[b.id]-sc[a.id]).slice(0,S.k);
  const reserve=Math.max(total*(1-S.invest),TIERS[ai.tier].rent*2);const invest=Math.max(0,total-reserve);
  if(!cands.length||invest<=0){ai.cash=total;continue;}
  let sum=cands.reduce((t,a)=>t+sc[a.id],0);let w=Object.fromEntries(cands.map(a=>[a.id,sc[a.id]/sum]));
  const cw=cands.filter(a=>a.kind==='coin').reduce((t,a)=>t+w[a.id],0);if(cw>S.coinMax){const k=S.coinMax/cw;for(const a of cands)if(a.kind==='coin')w[a.id]*=k;}
  let used=0;for(const id in w){ai.pos[id]=invest*w[id];used+=ai.pos[id];}ai.cash=total-used;}}
function aiNight(W,rets){for(const ai of W.ais){if(ai.out)continue;const S=STYLES[ai.style];for(const id in ai.pos)ai.pos[id]*=1+rets[id];
  ai.cash+=ai.pending;ai.pending=0;if(Math.random()<S.off){const sc=25*(1+ai.tier*1.6);ai.cash+=sc*(ai.style==='auction'?rand(-.15,.5):rand(-.3,.4));}
  const t=TIERS[ai.tier];ai.cash-=t.food;if(W.day%7===1)ai.cash-=t.rent;
  ai.prev=ai.worth;ai.worth=aiWorth(ai);const nt=TIERS[ai.tier+1];if(nt&&ai.worth>nt.dep*4&&ai.cash>nt.dep-t.dep){ai.cash-=nt.dep-t.dep;ai.tier++;}
  if(ai.worth<=0)ai.out=true;}}

function burst(scene,pos,color,n=70,speed=3){const geo=new THREE.BufferGeometry();const p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){p.set([pos.x,pos.y,pos.z],i*3);const a=Math.random()*Math.PI*2,e=Math.random()*1.2+.2;v.push(new THREE.Vector3(Math.cos(a)*Math.cos(e),Math.sin(e)+.3,Math.sin(a)*Math.cos(e)).multiplyScalar(speed*(.4+Math.random())));}
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color,size:.09,map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(pts);bursts.push({pts,v,life:1.4,scene});}
function updateBursts(dt){for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=dt;const p=b.pts.geometry.attributes.position;for(let j=0;j<b.v.length;j++){b.v[j].y-=5*dt;p.setXYZ(j,p.getX(j)+b.v[j].x*dt,p.getY(j)+b.v[j].y*dt,p.getZ(j)+b.v[j].z*dt);}p.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.life/1.4);
  if(b.life<=0){b.scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}}}
const tweens=[];
function tween(dur,fn,done){tweens.push({t:0,dur,fn,done});}
function updateTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.done&&w.done();}}}
const ease=k=>1-Math.pow(1-k,3);

function rarityRoll(bonus){const w=[30,44,17,7.5,1.5];w[0]*=Math.exp(-bonus*.5);w[2]*=Math.exp(bonus*.3);w[3]*=Math.exp(bonus*.6);w[4]*=Math.exp(bonus*.85);let t=w.reduce((a,b)=>a+b),x=Math.random()*t;for(let i=0;i<5;i++){x-=w[i];if(x<=0)return i;}return 1;}
function genItem(th,bonus,L){const cat=th.w?wpick(th.w):pick(CAT_KEYS);const C=CATS[cat];let rar=rarityRoll(bonus),fake=false;
  if(C.fake&&Math.random()<C.fake*.4){fake=true;rar=Math.random()<.85?3:4;}
  const base=rand(C.b[0],C.b[1])*(1+L*1.1);let trueV=fake?base*rand(.03,.1):base*RAR[rar].mult*rand(.8,1.25);let special=null,name=pick(PREFIX[rar])+' '+C.n;
  if(cat==='box'){const x=Math.random();if(x<.05){special='cash';trueV=rand(3,50)*(1+L);name='현금 봉투';}else if(x<.10){special='lotto';trueV=.1;name='복권 한 장';}}
  if(cat==='safe')special='safe';const shown=fake?base*RAR[rar].mult:trueV;
  return{id:P.nextId++,cat,rar,fake,special,name,trueV:r1(Math.max(.1,trueV)),estV:r1(Math.max(.1,shown*rand(.6,1.5))),appraised:false,vis:randi(1,1e9)};}
function genLot(forceTheme){const L=lotLevel();let th=forceTheme?THEMES.find(t=>t.name===forceTheme):(()=>{let t=0;for(const x of THEMES)t+=x.p;let r=Math.random()*t;for(const x of THEMES){r-=x.p;if(r<=0)return x;}return THEMES[0];})();
  const bonus=(th.bonus==null?rand(-1,2.2):th.bonus)+L*.3+luck()*.08;const n=randi(th.n[0],th.n[1])+Math.min(4,Math.floor(L));const items=[];for(let i=0;i<n;i++)items.push(genItem(th,bonus,L));
  items.forEach(it=>it.display=it.cat==='box'?'carton':(()=>{const x=Math.random();return x<.5?'open':x<.8?'tarp':'carton';})());
  const T=items.reduce((a,b)=>a+b.trueV,0);
  return{theme:th.name,items,T,open:rand(.38,.78),rumor:makeRumor(items),opening:Math.max(1,Math.round(T*Math.exp(gauss()*.4)*.1)),label:'B-'+randi(10,99),nGuess:n+randi(-1,1)};}

const DC={sel:null,c:0,r:0,rot:0};
function fpOf(fid,rot){const F=FURN[fid];return rot%2?{w:F.d,d:F.w}:{w:F.w,d:F.d};}
function cellsFree(fid,c,r,rot,ignore){const R=room.decor,fp=fpOf(fid,rot);if(c<0||r<0||c+fp.w>R.cols||r+fp.d>R.rows)return false;
  for(let i=0;i<P.furn.length;i++){if(i===ignore)continue;const f=P.furn[i];if(!f.place||f.place.tier!==P.tier)continue;const g=fpOf(f.fid,f.place.rot);if(c<f.place.c+g.w&&c+fp.w>f.place.c&&r<f.place.r+g.d&&r+fp.d>f.place.r)return false;}return true;}
function cellPos(fid,c,r,rot){const R=room.decor,fp=fpOf(fid,rot);return{x:R.x0+(c+fp.w/2)*CELL,z:R.z0+(r+fp.d/2)*CELL};}
function furnModel(fid,rot){const F=FURN[fid];const h=new THREE.Group();h.add(buildFurn(fid,F.w*CELL,F.d*CELL));h.rotation.y=-rot*Math.PI/2;return h;}
function refreshFurniture(){if(!room||!room.furnRoot)return;room.furnRoot.clear();P.furn.forEach((f,i)=>{if(!f.place||f.place.tier!==P.tier||(phase==='decor'&&i===DC.sel))return;const m=furnModel(f.fid,f.place.rot);const p=cellPos(f.fid,f.place.c,f.place.r,f.place.rot);m.position.set(p.x,room.decor.y||0,p.z);room.furnRoot.add(m);});updateGhost();}
function updateGhost(){if(!room)return;if(room.ghost){room.scene.remove(room.ghost);room.ghost=null;}if(room.grid)room.grid.visible=phase==='decor';if(phase!=='decor'||DC.sel==null)return;
  const f=P.furn[DC.sel];const g=furnModel(f.fid,DC.rot);const ok=cellsFree(f.fid,DC.c,DC.r,DC.rot,DC.sel);g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.75;o.material.emissive=new THREE.Color(ok?0x2a9a4a:0xb02020);o.material.emissiveIntensity=.7;}});
  const p=cellPos(f.fid,DC.c,DC.r,DC.rot);g.position.set(p.x,(room.decor.y||0)+.02,p.z);room.scene.add(g);room.ghost=g;}
function firstFree(fid,rot){const R=room.decor;for(let r=0;r<R.rows;r++)for(let c=0;c<R.cols;c++)if(cellsFree(fid,c,r,rot,DC.sel))return{c,r};return{c:0,r:0};}
function enterDecor(){phase='decor';DC.sel=null;setView({...room.view,pitch:.95,dist:room.view.dist*.9},false);refreshFurniture();renderDecor();}
function renderDecor(){renderHUD();const items=P.furn.map((f,i)=>({f,i}));const here=items.filter(o=>o.f.place&&o.f.place.tier===P.tier),box=items.filter(o=>!o.f.place||o.f.place.tier!==P.tier);const sel=DC.sel!=null?P.furn[DC.sel]:null;
  const card=(o,act)=>`<button class="prod ${DC.sel===o.i?'on':''}" data-act="dsel" data-arg="${o.i}"><b>${esc(FURN[o.f.fid].name)}</b><small>${FURN[o.f.fid].w}×${FURN[o.f.fid].d}칸 · 편안함 +${FURN[o.f.fid].comfort}</small><span class="pp">${act}</span></button>`;
  setPanel(`<div class="eyebrow">방 꾸미기 · ${TIERS[P.tier].name} · 편안함 ${comfort()} · 가구 운 +${furnLuck()}</div><h2>${sel?esc(FURN[sel.fid].name)+' 놓을 자리 고르기':'가구를 고르고 바닥을 누르세요'}</h2>
    ${sel?`<p class="muted" style="font-size:13px;margin:0">방 바닥 칸을 누르면 그 자리로 옮겨져요. 초록색이면 놓을 수 있고, 빨간색이면 겹치거나 밖으로 나간 거예요.</p><div class="row"><button class="btn sm" data-act="drot">회전</button><button class="btn go sm" data-act="dplace" ${cellsFree(sel.fid,DC.c,DC.r,DC.rot,DC.sel)?'':'disabled'}>여기 놓기</button><button class="btn sm" data-act="dstore">보관함에 넣기</button><button class="btn ghost sm" data-act="dcancel">취소</button></div>`:''}
    <div class="sect">방에 놓인 가구 ${here.length}개</div><div class="shopgrid">${here.map(o=>card(o,'옮기기')).join('')||'<p class="muted">아직 없어요.</p>'}</div>
    <div class="sect">보관함 ${box.length}개</div><div class="shopgrid">${box.map(o=>card(o,'배치하기')).join('')||'<p class="muted">가구는 거리의 떡상가구에서 살 수 있어요.</p>'}</div>
    <div class="row"><button class="btn go" data-act="decorDone">다 꾸몄다</button></div>`);}
function decorTap(x,z){if(DC.sel==null)return;const f=P.furn[DC.sel];const R=room.decor,fp=fpOf(f.fid,DC.rot);DC.c=clamp(Math.round((x-R.x0)/CELL-fp.w/2),0,Math.max(0,R.cols-fp.w));DC.r=clamp(Math.round((z-R.z0)/CELL-fp.d/2),0,Math.max(0,R.rows-fp.d));updateGhost();renderDecor();}

function warnList(){const t=TIERS[P.tier],w=[];const ri=rentIn();
  if(ri===0)w.push([P.cash>=rentNow()?'ok':'',`오늘 자정 월세 ${won(rentNow())}`+(P.cash>=rentNow()?' · 낼 돈 있음':' · 현금 부족! 모자라면 주식·물건이 헐값에 팔리고, 그래도 모자라면 파산')]);
  for(const l of P.loans){const d=l.due-P.day;if(d<=2)w.push([P.cash>=l.owed?'ok':'',`${l.name} 상환 ${d<=0?'오늘 자정':'D-'+d} · ${won(l.owed)}`]);}
  if(P.food<25)w.push(['',`배가 고프다(포만감 ${Math.round(P.food)}). 0이 되면 체력이 줄어요.`]);
  if(P.hp<30)w.push(['',`몸이 무겁다(체력 ${Math.round(P.hp)}). 0이 되면 응급실행.`]);
  for(const k in APPL)if(P.broken[k])w.push(['',`${APPL[k].name} 고장 · ${APPL[k].eff}`]);
  return w.length?`<ul class="warn-list">${w.map(([c,x])=>`<li class="${c}">${esc(x)}</li>`).join('')}</ul>`:'';}

function drawLine(g,hist,x,y,w,h,{fill=true,lw=3,split=0}={}){if(!hist||hist.length<2)return;const mn=Math.min(...hist),mx=Math.max(...hist),rg=(mx-mn)||1;const up=hist.at(-1)>=hist[Math.max(0,split-1)];const col=up?'#ff4d55':'#4d8dff';
  const X=i=>x+i/(hist.length-1)*w,Y=v=>y+h-(v-mn)/rg*h;const path=()=>{g.beginPath();hist.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));};
  if(split>0){g.fillStyle='rgba(255,255,255,.045)';g.fillRect(X(split-1),y,x+w-X(split-1),h);}
  if(fill){path();g.lineTo(x+w,y+h);g.lineTo(x,y+h);g.closePath();const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,up?'rgba(255,77,85,.35)':'rgba(77,141,255,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fill();}
  path();g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.stroke();g.fillStyle=col;g.beginPath();g.arc(X(hist.length-1),Y(hist.at(-1)),lw*1.8,0,7);g.fill();}

  g.fillStyle='#161512';g.fillRect(0,0,w,h);g.strokeStyle='#2a2823';g.lineWidth=1;for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,h*i/4);g.lineTo(w,h*i/4);g.stroke();}
  const past=s.hist.slice(-12),data=past.concat((s.intra||[]).slice(1),[s.price]);drawLine(g,data,6*dpr,8*dpr,w-12*dpr,h-16*dpr,{lw:2*dpr,split:past.length});}

const HUDC={p:null,last:0};
function cashFly(){if(!P||OFF)return;if(HUDC.p!==P){HUDC.p=P;HUDC.last=P.cash;return;}const d=P.cash-HUDC.last;if(Math.abs(d)<.045)return;HUDC.last=P.cash;const c=$('#hCash').getBoundingClientRect();const e=document.createElement('div');e.className='fly '+(d>0?'gain':'loss');e.textContent=(d>0?'+':'-')+won(Math.abs(d));e.style.left=(c.left+c.width/2)+'px';e.style.top=(c.bottom+4)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1500);
  const ch=$('#hCash').parentNode;ch.classList.remove('pop');void ch.offsetWidth;ch.classList.add('pop');}
function pop3(text,pos,good=true){const s=labelSprite(text,{bg:good?'#1f9d55':'#c8202b',fg:'#fff',scale:.42});s.position.set(pos.x,2.2,pos.z);cur.add(s);const sc=cur;tween(1.3,k=>{s.position.y=2.2+k*1.4;s.material.opacity=1-k*k;},()=>{sc.remove(s);s.material.map.dispose();s.material.dispose();});}

const PK={list:[],t:3,root:null};
function pkModel(k){const g=new THREE.Group();const spin=new THREE.Group();g.add(spin);

  if(k==='lotto'){spin.add(mesh(G.box(.3,.4,.012),M(0xff5b8a,{flat:false,e:0x80203a,ei:.6})),mesh(G.box(.2,.12,.014),M(0xc8ccd2,{flat:false,m:.8,r:.3}),0,-.06,0));}
  if(k==='clover'){for(let i=0;i<4;i++){const l=mesh(G.sph(.09,10,8),M(0x3ad06a,{flat:false,e:0x0a5a2a,ei:.9}),Math.cos(i*Math.PI/2)*.09,Math.sin(i*Math.PI/2)*.09,0);l.scale.z=.3;spin.add(l);}}
  spin.position.y=.75;const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:{coin:0xffd24a,bill:0xffe08a,bottle:0x5ad08a,lotto:0xff7aa8,clover:0x5aff9a}[k],transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));gl.scale.setScalar(1.5);gl.position.y=.75;g.add(gl);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.22,.3,20),new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:.5,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);g.userData.spin=spin;return g;}
function spawnPickup(){if(!PK.root){PK.root=new THREE.Group();scWorld.add(PK.root);}const r=Math.random()*100;const k=r<44?'coin':r<66?'bottle':r<88?'bill':r<96?'lotto':'clover';
  for(let i=0;i<30;i++){const x=rand(-64,64),z=rand(-34,34);const road=onRoad(x,z);if(blocked(x,z,.5)||(road&&(k!=='bill'||Math.random()>.5))||Math.hypot(x-WD.pos.x,z-WD.pos.z)<7)continue;if(PK.list.some(p=>Math.hypot(p.x-x,p.z-z)<4))continue;
    const m=pkModel(k);m.position.set(x,0,z);PK.root.add(m);PK.list.push({k,x,z,m,ph:rand(0,6)});return;}}
function takePickup(p){PK.root.remove(p.m);PK.list.splice(PK.list.indexOf(p),1);const pos={x:p.x,z:p.z};mis('pick');xp(1);P.stats.picked=(P.stats.picked||0)+1;
  if(p.k==='coin'){const v=r1(pick([.05,.05,.1,.1,.2,.5])*(1+.5*perk('magnet'))*10)/10||.05;P.cash+=v;sfx.cash();burst(scWorld,new THREE.Vector3(p.x,.8,p.z),0xffd24a,26,2);pop3('+'+won(v),pos);}
  if(p.k==='bill'){const big=Math.random()<.14+luck()*.012;const v=big?5:1;P.cash+=v;sfx.cash();if(big){sfx.reveal(2);stamp('5만원!',true);}burst(scWorld,new THREE.Vector3(p.x,.8,p.z),0xffe08a,big?70:36,2.6);pop3((big?'5만원권! ':'')+'+'+won(v),pos);}
  if(p.k==='bottle'){P.bottles=(P.bottles||0)+1;sfx.bid();pop3(`빈 병 ${P.bottles}개`,pos);if(P.bottles===1)toast('빈 병은 편의점 계산대 옆 수거함에 반납하면 개당 1,000원이에요.');}
  if(p.k==='lotto'){sfx.good();pop3('즉석복권!',pos);burst(scWorld,new THREE.Vector3(p.x,.8,p.z),0xff7aa8,40,2.4);openScratch(true);}
  if(p.k==='clover'){mod.luck=(mod.luck||0)+1;P.mod=mod;sfx.reveal(2);stamp('행운 +1',true);burst(scWorld,new THREE.Vector3(p.x,.8,p.z),0x5aff9a,60,2.6);pop3('네잎클로버! 오늘 운 +1',pos);}
  renderHUD();}
function updatePickups(dt){if(!P||!P.paths)return;PK.t-=dt;if(PK.t<=0){PK.t=rand(5,11);if(PK.list.length<9)spawnPickup();}
  for(const p of PK.list){p.ph+=dt;const s=p.m.userData.spin;s.rotation.y=p.ph*2.4;s.position.y=.75+Math.sin(p.ph*2.2)*.1;}
  if(phase==='world')for(const p of [...PK.list])if(Math.hypot(p.x-WD.pos.x,p.z-WD.pos.z)<1.05*(1+perk('magnet')))takePickup(p);}

const SC={};
function scratchPrize(){const x=Math.max(0,Math.random()*(1-.35*perk('lucky'))-luck()*.004);return x<.0006?500:x<.004?50:x<.022?5:x<.085?1:x<.3?.3:0;}
function openScratch(free){if(!free){if((P.scDay||0)!==P.day){P.scDay=P.day;P.scN=0;}if(P.scN>=8){toast('오늘 복권은 다 팔렸어요. 내일 다시 들어와요.','bad');return;}if(P.cash<.3){toast('복권 살 돈도 없다…','bad');return;}P.cash-=.3;P.scN++;renderHUD();}
  const prize=scratchPrize();const amt=[.3,1,5,50,500];let cells;if(prize){cells=[prize,prize,prize];}else{do{cells=[pick(amt),pick(amt),pick(amt)];}while(cells[0]===cells[1]&&cells[1]===cells[2]);}
  Object.assign(SC,{prize,cells,done:false,free});
  modal(`<div class="eyebrow">떡상 즉석복권 · ${free?'길에서 주운 복권':'1장 3,000원'}</div><h3>같은 금액 3개면 당첨!</h3><div class="scwrap"><div class="scprize">${cells.map(c=>`<span>${won(c)}</span>`).join('')}</div><canvas id="scCv" width="300" height="110"></canvas></div><p class="muted" style="font-size:13px">은박을 손가락으로 문질러 긁으세요.</p><div class="row"><button class="btn" data-act="scReveal">한 번에 긁기</button><button class="btn go" data-act="scClose" id="scDone" disabled>확인</button></div>`);
  const cv=$('#scCv'),g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,300,110);gr.addColorStop(0,'#b8bcc4');gr.addColorStop(.5,'#e4e7ec');gr.addColorStop(1,'#a8acb4');g.fillStyle=gr;g.fillRect(0,0,300,110);g.fillStyle='rgba(60,64,72,.5)';g.font='bold 18px sans-serif';g.textAlign='center';for(let i=0;i<3;i++)g.fillText('여기를 긁으세요',150,30+i*30);
  let down=false,n=0;const scr=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*300/r.width,y=(e.clientY-r.top)*110/r.height;g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x,y,17,0,7);g.fill();if(++n%4===0)sfx.tick();if(n%10===0){const d=g.getImageData(0,0,300,110).data;let c=0;for(let i=3;i<d.length;i+=64)if(d[i]<40)c++;if(c/(d.length/64)>.55)scratchEnd();}};
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);scr(e);});cv.addEventListener('pointermove',e=>{if(down)scr(e);});cv.addEventListener('pointerup',()=>down=false);}
function scratchEnd(){if(SC.done)return;SC.done=true;xp(2);const cv=$('#scCv');if(cv)cv.style.opacity='0';const b=$('#scDone');if(b)b.disabled=false;mis('scratch');P.stats.scratch=(P.stats.scratch||0)+1;
  if(SC.prize){P.cash+=SC.prize;renderHUD();if(SC.prize>=50){stamp(SC.prize>=500?'1등!!':'대박!',true);sfx.reveal(4);}else if(SC.prize>=5){stamp('당첨!',true);sfx.reveal(3);}else sfx.good();toast(`당첨! +${won(SC.prize)}`,'good');}else{sfx.bad();toast('꽝… 다음 기회에.','bad');}}

function workChoiceOld(){const late=P.time>=22||P.time<6;modal(`<div class="eyebrow">떡상마트 24 · 점장</div><h3>"마침 손이 모자랐는데!"</h3><p>어떻게 일할까요?</p><div class="loan"><h4>한 타임 계산대 보기 · 바코드 찍기 게임</h4><div class="muted" style="font-size:13px">직접 플레이. 게임 시간 2시간이 지나고, 잘 찍을수록 많이 받아요(최대 약 5만원).</div><div class="row"><button class="btn go sm" data-act="mgStart" ${late?'disabled':''}>${late?'06~22시에만 가능':'지금 시작'}</button></div></div>

const MG_ITEMS=['삼각김밥','컵라면','바나나우유','도시락','캔커피','새콤젤리','감자칩','생수','초코바','컵얼음','샌드위치','소시지'];
function mgStart(){Object.assign(MG,{on:true,i:0,n:12,hit:0,perf:0,x:0,dir:1,sp:.9,zone:[.4,.6],wait:0,combo:0,best:0});
  modal(`<div class="eyebrow">계산대 · 바코드 찍기</div><h3 id="mgItem">준비…</h3><div class="mgbar"><i id="mgZone"></i><b id="mgCur"></b></div><div class="meta"><span>손님 <b id="mgN">1/12</b></span><span>콤보 <b id="mgCombo">0</b></span><span>벌이 <b id="mgPay">0원</b></span></div><div class="row"><button class="btn go" id="mgBtn" data-act="mgHit" style="padding:22px;font-size:20px">삑!</button></div><p class="muted" style="font-size:12px">빨간 선이 초록 칸에 왔을 때 누르세요. 스페이스바도 돼요.</p>`);mgNext();}
function mgNext(){if(MG.i>=MG.n)return mgEnd();const w=Math.max(.1,.24-MG.i*.011);const a=rand(.08,.92-w);MG.zone=[a,a+w];MG.sp=.85+MG.i*.09;MG.x=Math.random()<.5?0:1;MG.dir=MG.x?-1:1;MG.wait=0;const z=$('#mgZone');if(z){z.style.left=a*100+'%';z.style.width=w*100+'%';}$('#mgItem').textContent=pick(MG_ITEMS)+' 찍기';$('#mgN').textContent=`${MG.i+1}/${MG.n}`;}
const mgPay=()=>r1(MG.hit*.3+MG.perf*.12+Math.min(MG.best,12)*.03);
function mgHit(){if(!MG.on||MG.wait>0)return;const c=(MG.zone[0]+MG.zone[1])/2,w=MG.zone[1]-MG.zone[0];const d=Math.abs(MG.x-c);const it=$('#mgItem');
  if(d<w*.18){MG.hit++;MG.perf++;MG.combo++;it.textContent='완벽! 삑-';sfx.cash();}else if(d<w/2){MG.hit++;MG.combo++;it.textContent='삑!';sfx.bid();}else{MG.combo=0;it.textContent='앗, 다시 찍어 주세요…';sfx.bad();}
  MG.best=Math.max(MG.best,MG.combo);$('#mgCombo').textContent=MG.combo;$('#mgPay').textContent=won(mgPay());MG.i++;MG.wait=.45;}
function mgTick(dt){if(!MG.on)return;if($('#modal').hidden||!$('#mgCur')){MG.on=false;return;}if(MG.wait>0){MG.wait-=dt;if(MG.wait<=0)mgNext();return;}MG.x+=MG.dir*MG.sp*dt;if(MG.x>1){MG.x=1;MG.dir=-1;}if(MG.x<0){MG.x=0;MG.dir=1;}$('#mgCur').style.left=MG.x*100+'%';}
function mgEnd(){MG.on=false;const pay=mgPay();P.cash+=pay;passTime(2);P.hp=Math.max(1,P.hp-5);P.stats.work=(P.stats.work||0)+1;mis('work');renderHUD();if(pay>=4){stamp('알바왕',true);sfx.reveal(3);}else sfx.cash();
  modal(`<div class="eyebrow">근무 끝 · 2시간 경과</div><h3>${pay>=4?'"자네 내일도 나올 수 있나?"':pay>=2.5?'"수고했어요~"':'"다음엔 좀 더 빨리 부탁해요."'}</h3><ul class="prank"><li><span>찍은 손님</span><b>${MG.hit}/${MG.n}</b></li><li><span>완벽</span><b>${MG.perf}</b></li><li><span>최고 콤보</span><b>${MG.best}</b></li><li><span><b>오늘 일당</b></span><b class="gain">+${won(pay)}</b></li></ul><div class="row"><button class="btn" data-act="mgStart" ${P.time>=22||P.time<6||P.hp<15?'disabled':''}>한 타임 더</button><button class="btn go" data-act="closeModal">퇴근</button></div>`);}
/* ---- daily missions ---- */
const MISSION_POOL=[
  {id:'pick',t:'길에 떨어진 물건 6개 줍기',n:6,r:2},{id:'shop',t:'편의점에서 장 보고 계산하기',n:1,r:1},{id:'trade',t:'주식이나 코인 2번 거래하기',n:2,r:2},{id:'work',t:'편의점 알바 한 타임 뛰기',n:1,r:2},
  {id:'won',t:'경매에서 창고 하나 낙찰받기',n:1,r:5},{id:'walk',t:'동네 500m 걷기',n:500,r:2},{id:'scratch',t:'즉석복권 1장 긁기',n:1,r:1},{id:'profit',t:'오늘 순자산 10만원 불리기',n:1,r:4},{id:'bottle',t:'빈 병 3개 반납하기',n:3,r:2},{id:'cross',t:'초록불에 횡단보도 3번 건너기',n:3,r:2}];
function genMissions(){const pool=[...MISSION_POOL];P.missions=[];for(let i=0;i<3;i++){const m=pool.splice(randi(0,pool.length-1),1)[0];P.missions.push({id:m.id,c:0,done:false});}P.misAll=false;}
function mis(id,amt=1){if(!P||!P.missions)return;const m=P.missions.find(q=>q.id===id&&!q.done);if(!m)return;const D=MISSION_POOL.find(q=>q.id===id);m.c=Math.min(D.n,m.c+amt);if(m.c<D.n)return;m.done=true;P.cash+=D.r;P.stats.mis=(P.stats.mis||0)+1;xp(8);

  dlg(`<b class="nm">결과</b>${o.m}${o.tip?` <b class="gain">팁 +${won(o.tip)}</b>`:''}${o.pay?` <b class="${o.pay>0?'gain':'loss'}">${o.pay>0?'+':''}${won(o.pay)}</b>`:''}${o.payMul!=null&&o.payMul<1?` <b class="loss">일당 ×${o.payMul}</b>`:''}`,[['계속 일하기','jobOk']]);}
function jobDone(d,early){const j=JOBS.find(x=>x.id===d.jid);const h=clamp(absNow()-BZ.start,0,j.hours);const frac=h/j.hours;const L0=jobLv(j.id);
  const base=r1(h*jobRate(j)*d.payMul);const total=Math.max(0,r1(base+d.pay+d.tip));P.cash+=total;P.hp=clamp(P.hp-j.hp*frac*(1-.2*perk('iron')),1,100);if(j.food&&frac>.6)P.food=Math.min(100,P.food+j.food);
  let gain=0;if(frac>=.6){gain=1+(d.rep>=2?1:0);P.career=P.career||{};P.career[j.id]=(P.career[j.id]||0)+gain;}P.stats.work=(P.stats.work||0)+1;if(!early)mis('work');xp(8+gain*6);
  const L1=jobLv(j.id);const up=L1.name!==L0.name;dlgHide();
  if(OFF){OFFLOG.push(`${jobName(j)} ${dur(h)} · +${won(total)}${up?` · ${L1.name} 승급!`:''}`);return;}
  sfx.cash();if(up){stamp(L1.name+'!',true);sfx.reveal(3);}renderHUD();
  modal(`<div class="eyebrow">${jobName(j)} · ${esc(jobPlace(j))} · ${dur(h)}</div><h3>${early?'조퇴했다':d.rep>=2?'"다음에도 꼭 와 줘요!"':d.rep<0?'"다음엔 좀 더 잘해 봐요."':'"수고했어요~"'}</h3><ul class="prank"><li><span>시급 ${Math.round(jobRate(j)*10000).toLocaleString('ko-KR')}원 × ${dur(h)}</span><b>${won(base)}</b></li>${d.tip?`<li><span>팁</span><b class="gain">+${won(d.tip)}</b></li>`:''}${d.pay?`<li><span>사건·사고</span><b class="${d.pay>0?'gain':'loss'}">${d.pay>0?'+':''}${won(d.pay)}</b></li>`:''}<li><span><b>받은 돈</b></span><b class="gain">+${won(total)}</b></li><li><span>경력</span><b>${gain?`+${gain}회 → ${L1.name} ${L1.n}회`:'60% 이상 일해야 쌓여요'}</b></li></ul>${up?`<p class="gain">🎉 ${jobName(j)} <b>${L1.name}</b> 승급! 이제 시급 ×${L1.mult}</p>`:''}${d.log.length?`<p class="muted" style="font-size:12.5px">${d.log.map(esc).join('<br>')}</p>`:''}<div class="row"><button class="btn go" data-act="closeModal">확인</button></div>`);}

/* ============ auction: on the clock ============ */
const A={lot:null,state:'',npcs:[],price:0,leader:null,count:0,cool:0,log:[],lastCall:'',out:false};
const inc=p=>p<10?1:p<40?2:p<150?5:p<600?10:p<2000?50:100;
function lotBidders(lot){return lot.att.map(i=>P.ais[i]).filter(a=>a&&!a.out&&!a.done).map(ai=>{const S=STYLES[ai.style].bid;return{name:ai.name,ai,style:S.style,skill:S.skill,aggr:S.aggr,shirt:ai.color,pants:0x2b2f3a,hat:ai.style==='auction'?0x1a1a1a:null,hair:ai.style==='degen'?0xe0c050:ai.style==='value'?0x6a6a6a:0x1d1a17,hairStyle:ai.style==='momentum'?'long':ai.style==='degen'?'bun':'short'};});}
function setMaxes(npcs,lot){for(const n of npcs){if(Math.random()<.18){n._max=0;continue;}const est=lot.T*Math.exp(gauss()*n.skill)*n.aggr*rand(.92,1.08);n._max=Math.floor(Math.min(est,Math.max(0,n.ai.cash*.6)));}}

function aiTakes(lot,n,price){n.ai.cash-=price;n.ai.pending+=lot.T*rand(.8,.95);lot.done=true;lot.result={name:n.name,price};const best=lot.items.reduce((a,b)=>b.trueV>a.trueV?b:a);if(best.rar>=3&&!best.fake)P.feed.push(`D+${P.day} ${n.name}, 경매에서 ${best.name} 건져`);}
function resolveOffscreen(lot){const npcs=lotBidders(lot);setMaxes(npcs,lot);const r=quickResolve(npcs,lot.opening);if(r){aiTakes(lot,r.n,r.price);notify(`경매 ${hhmm(lot.at)} · ${r.n.name} 낙찰 ${won(r.price)}`,null);}else{lot.done=true;lot.result={name:null,price:0};}if(!OFF&&phase==='auction'&&A.state==='lobby')renderAuction();}
function auctionClock(){for(const lot of P.lots){if(lot.done)continue;const mine=!OFF&&phase==='auction'&&A.lot===lot&&(A.state==='peek'||A.state==='bid');
  if(P.time>=lot.at){if(mine){if(A.state==='peek')startBidding();}else resolveOffscreen(lot);}
  else if(phase==='auction'&&A.state==='lobby'&&P.time>=lot.at-PREVIEW){showLot(lot);return;}}}
function enterAuction(){phase='auction';sub=null;cur=scAuction;AU.npcRoot.visible=true;AU.pallet.visible=false;AU.beam.material.opacity=0;
  setView({target:new THREE.Vector3(0,.9,-1.8),yaw:0,pitch:.24,dist:11,yl:[-.55,.55],pl:[.04,.6],dl:[6,15]},true);
  const lot=P.lots.find(l=>!l.done&&P.time>=l.at-PREVIEW);if(lot)showLot(lot);else auctionLobby();}
function auctionLobby(){phase='auction';A.state='lobby';A.lot=null;A.npcs=[];AU.npcRoot.clear();AU.npcRoot.visible=true;AU.itemRoot.clear();AU.pallet.visible=false;AU.beam.material.opacity=0;AU.center.open=0;setShutter(0);
  setView({target:new THREE.Vector3(0,.9,-1.8),yaw:0,pitch:.24,dist:11,yl:[-.55,.55],pl:[.04,.6],dl:[6,15]});renderAuction();}
function renderAuction(){if(A.state==='peek')return renderPeek();if(A.state!=='lobby')return;renderHUD();
  const rows=P.lots.map((l,i)=>{const st=l.done?(l.result.name?`${esc(l.result.name)} 낙찰 · ${won(l.result.price)}`:'유찰'):P.time>=l.at-PREVIEW?'미리보기 중':`${hhmm(l.at-PREVIEW)}부터 미리보기`;
    return `<div class="loan"><h4>${hhmm(l.at)} · ${l.done?esc(l.theme):'??? 창고'}</h4><div class="muted" style="font-size:13px">${st}${l.done&&l.result.name!=='나'?` · 창고 가치 약 ${won(l.T)}`:''}</div></div>`;}).join('')||'<p class="muted">오늘은 경매가 없다.</p>';
  setPanel(`<div class="eyebrow">창고 경매장 · 로비 · ${hhmm(P.time)}</div><h2>오늘의 경매</h2><p class="muted" style="font-size:13px;margin:0">시작 ${PREVIEW*60}분 전(현실 ${realDur(PREVIEW)} 전)부터 셔터가 열려요. 정각에 여기 없으면 라이벌들끼리 가져갑니다.</p>${rows}<div class="row"><button class="btn go" data-act="leave">나가기</button></div>`);}

  const b1=$('#bB1'),b5=$('#bB5');b1.textContent=A.leader===null?`${won(p1)} 부르기`:`+${won(p1-A.price)}`;b5.textContent=`+${won(p5-A.price)} 크게`;

  if(who==='me'){A.log.push({t:`나 ${won(np)}`,me:true});sfx.bid();A.cool=rand(.5,1.1);}else{A.log.push({t:`${who.name} ${won(np)}`});sfx.npc();npcBubble(who,won(np));A.cool=rand(.25,.6);}updateBidUI();}

    for(const n of shuffle(cands)){let rate={steady:1.3,aggro:2.6,stubborn:1.5,sniper:A.count<1.3?5:.12,hype:1.8}[n.style]??1.2;if(n.style==='stubborn'&&A.leader==='me')rate+=2.2;if(A.price>.8*n._max)rate*=.5;
      if(Math.random()<rate*dt){let m=1;if(n.style==='aggro'&&Math.random()<.3)m=2;if(n.style==='hype'&&Math.random()<.2)m=4;let np=nextPrice(m);if(np>n._max)np=nextPrice(1);placeBid(n,np);break;}}}

function liquidate(need){let n=0;const ids=Object.keys(P.hold).sort((a,b)=>(AID[b].kind==='coin')-(AID[a].kind==='coin')||holdVal(b)-holdVal(a));
  for(const id of ids){if(P.cash>=need)break;const h=P.hold[id],a=AID[id],p=P.mkt[id].price*.97;const short=need-P.cash;let q=short*10000/p;if(a.kind==='stock')q=Math.ceil(q);q=Math.min(q,h.qty);if(q<=0)continue;
    const got=q*p/10000;P.cash+=got;h.cost-=h.cost*(q/h.qty);h.qty-=q;if(h.qty<=1e-9||(a.kind==='stock'&&h.qty<1))delete P.hold[id];n++;(P.forced=P.forced||[]).push(`${a.name} ${a.kind==='stock'?Math.round(q).toLocaleString('ko-KR')+'주':q.toFixed(3)+'개'} → ${won(got)}`);}
  const order=P.inv.filter(i=>i.special!=='lotto').sort((a,b)=>(P.room.includes(a.id)?1:0)-(P.room.includes(b.id)?1:0)||b.trueV-a.trueV);
  for(const it of order){if(P.cash>=need)break;P.cash+=r1(Math.max(.1,it.trueV*.5));n++;removeItem(it.id);}return n;}

  if(!moving&&P.loc!=='seoul'){P.cash-=3;msgs.push(`${CITIES[P.loc].name}에서 하룻밤. 숙박비 -3만원`);}
  if(P.loc==='seoul'&&!moving&&P.broken.boiler){P.hp=Math.max(0,P.hp-12);msgs.push('보일러가 고장 나서 밤새 떨었다. 체력 -12');}

  let evicted=false;
  if(rentIn()===0){if(pay(rentNow(),'월세',msgs)){P.credit=Math.min(900,P.credit+5);msgs.push(`월세 -${won(rentNow())}`);}
    else{if(P.tier===0){gameOver(`${gameDate()} 자정, 월세 ${won(rentNow())}을 못 냈다. 팔 것도 남지 않았다.`);return;}const lower=TIERS[P.tier-1];P.cash+=depNow()-lower.dep-rentNow();P.tier--;P.dep=lower.dep;P.rent=lower.rent;P.room=P.room.slice(0,TIERS[P.tier].slots);room=null;evicted=true;}
    if(P.car){const ins=r1(CARS[P.car.id].price*.003*(1+(P.insUp||0)*.2));P.cash-=ins;msgs.push(`자동차 보험료 -${won(ins)}`);}}
  for(const l of P.loans)l.owed*=1+l.rate;
  for(const l of P.loans.slice()){if(l.due<=P.day){if(pay(l.owed,l.name+' 상환금',msgs)){P.loans.splice(P.loans.indexOf(l),1);P.credit=Math.min(900,P.credit+40);msgs.push(`${l.name} 상환 완료 · 신용점수 +40`);}

  deliver:()=>{if(P.broken.phone||P.cash<2.2)return;P.cash-=2.2;P.food=Math.min(100,P.food+60);sfx.good();toast('치킨 도착! 포만감 +60','good');renderCurrent();},
  capLoan:()=>{if(loanRemaining('cap')<50||P.credit<450){toast('캐피탈 한도가 없어요.','bad');return;}borrow('cap',50);},
  buyFood:a=>{const s=STORE.find(x=>x.id===a);if(!s||P.cash<s.price)return;P.cash-=s.price;P.pantry[a]=(P.pantry[a]||0)+(s.servings||1);sfx.bid();renderStore();},
  work:()=>startWork(),busyStop:()=>{if(phase==='busy')finishBusy(true);},
  fixTech:k=>{const a=APPL[k];if(P.cash<a.tech)return;P.cash-=a.tech;sub=null;busyK('fixT',{k},1);},
  fixSelf:k=>{const a=APPL[k];if(P.cash<3)return;P.cash-=3;sub=null;busyK('fixS',{k},2);},
  fixBuy:k=>{const a=APPL[k];if(!a.buy||P.cash<a.buy)return;P.cash-=a.buy;P.broken[k]=false;refreshAppliances();sfx.cash();toast(`새 ${a.name} 장만`,'good');renderRepair();},
  borrow:a=>{const [k,v]=a.split(':');borrow(k,v);},repay:a=>{const [i,v]=a.split(':');repay(+i,v);},
  tab:a=>{TS.tab=a;renderPhone();},tsel:a=>{TS.sel=a;renderPhone();},buy:a=>buy(+a),sell:a=>sell(+a),
  bid:a=>{if(A.state!=='bid'||A.out||A.leader==='me')return;const np=A.leader===null?(a==='5'?A.price+inc(A.price)*4:A.price):nextPrice(+a);if(P.cash<np){toast('현금이 모자라요.','bad');return;}placeBid('me',np);},
  fold:()=>{if(A.state!=='bid'||A.leader==='me')return;A.out=true;endLot();},
  auctionLobby:()=>auctionLobby(),unboxLot:()=>goUnbox(),reveal:()=>revealNext(),revealAll:()=>revealAll(),
  sel:a=>{selId=+a;renderShop();},sellItem:()=>{sellItem(selId);renderShop();},
  sellAll:()=>{let t=0,n=0;for(const it of P.inv.slice()){if(P.room.includes(it.id)||it.refused||it.special==='lotto')continue;t+=sellItem(it.id,true);n++;}if(n){sfx.cash();toast(`${n}개 판매 +${won(t)}`,'good');}renderShop();},
  haggle:()=>{const it=itemById(selId);if(!it||it.haggled)return;it.haggled=true;const p=.45+luck()*.025;const x=Math.random();
    if(x<p){it.offer=r1(it.offer*rand(1.15,1.4));toast(`김 영감: "허 참… 알았네, ${won(it.offer)}."`,'good');sfx.good();}else if(x<p+.3){it.offer=r1(it.offer*rand(.85,.95));toast(`김 영감: "욕심이 과하구먼. 그럼 ${won(it.offer)}."`,'bad');}else{it.refused=true;toast('김 영감: "됐네, 오늘은 그 물건 안 사!"','bad');sfx.bad();}renderShop();},
  appraise:()=>{const it=itemById(selId);if(!it)return;const cost=Math.max(.5,r1(it.estV*.05));if(P.cash<cost)return;P.cash-=cost;it.appraised=true;
    if(it.fake){it.name='가짜 '+CATS[it.cat].n;it.estV=it.trueV;P.stats.fakes++;sfx.bad();stamp('짝퉁');toast(`감정 결과: 짝퉁… 실제 가치 ${won(it.trueV)}`,'bad');P.room=P.room.filter(x=>x!==it.id);}
    else{const up=it.trueV>=it.estV;it.estV=it.trueV;(up?sfx.good:sfx.bad)();toast(`감정 결과: ${won(it.trueV)}${up?' (생각보다 비싸다!)':''}`,up?'good':'bad');}renderShop();},
  keep:()=>{const it=itemById(selId);if(!it)return;if(P.room.includes(it.id)){P.room=P.room.filter(x=>x!==it.id);toast(`${J(it.name,'을','를')} 방에서 뺐다.`);}else if(P.room.length<TIERS[P.tier].slots){P.room.push(it.id);toast(`${J(it.name,'을','를')} 방에 뒀다. 운 ${luck()}`,'good');}renderShop();},
  crack:()=>{const it=itemById(selId);if(!it||it.special!=='safe')return;P.cash-=Math.round(2*(1+P.tier*.5));const m=1+lotLevel();const x=Math.random()*100;let v=0,msg;
    if(x<45)msg='텅 비어 있다…';else if(x<80){v=r1(rand(3,40)*m);msg=`현금 다발! +${won(v)}`;}else if(x<95){v=r1(rand(60,250)*m);msg=`금괴가 나왔다! +${won(v)}`;}else if(x<99.5){v=r1(rand(300,900)*m);msg=`무기명 채권 뭉치! +${won(v)}`;}else{v=r1(rand(2000,4000));msg=`다이아몬드 주머니!! +${won(v)}`;}
    it.special=null;it.name='열린 금고';P.cash+=v;P.stats.earned+=v;if(v>0){sfx.reveal(v>200?4:v>40?3:2);if(v>200)stamp('대박!',true);}else sfx.bad();toast('금고: '+msg,v>0?'good':'bad');renderShop();},
  scratch:()=>{const it=itemById(selId);if(!it)return;const x=Math.random()*100;let v=0;if(x<65)v=0;else if(x<87)v=.5;else if(x<96)v=5;else if(x<99.5)v=50;else if(x<99.95)v=500;else v=5000;
    removeItem(it.id);P.cash+=v;P.stats.earned+=v;if(v>=500){stamp('1등!',true);sfx.reveal(4);}else if(v>0)sfx.good();else sfx.bad();toast(v?`복권 당첨! +${won(v)}`:'꽝. 다음 기회에…',v?'good':'bad');renderShop();},
  buyPent:()=>{if(P.cash>=(P.pentPrice||GOAL))win();},noop:()=>{},
  giveupNow:()=>{closeModal();phase='over';endScreen('여기까지','라이벌이 먼저 떡상하는 걸 보고 레이스를 끝냈다.',false);},
  keepGoing:()=>{for(const a of P.ais)if(a._pending){a.done=true;a._pending=false;P.feed.push(`${gameDate()} ${a.name}, 펜트하우스 입주로 레이스 졸업`);}closeModal();phase=RVprev;renderCurrent();},
  travel:a=>startTravel(a),moveTo:a=>moveTo(+a),encOpt:a=>encOpt(+a),cityLuck:a=>cityLuck(a),
  cityEat:()=>{const c=CITIES[P.loc];if(!c||P.cash<c.food[1])return;P.cash-=c.food[1];P.food=Math.min(100,P.food+c.food[2]);P.hp=Math.min(100,P.hp+c.food[3]);passTime(.5);sfx.good();toast(`${c.food[0]} 한 상. 포만감 ${Math.round(P.food)}`,'good');renderCity();},
  cityGoods:()=>{const id=P.loc,c=CITIES[id];if(!c)return;const gp=P.goodsPrice[id];if(P.cash<gp||(P.cityBuy[id]||0)>=3)return;P.cash-=gp;P.cityBuy[id]=(P.cityBuy[id]||0)+1;const tv=c.goods[1]*clamp(Math.exp(gauss()*.45+.35),.3,4);P.inv.push({id:P.nextId++,cat:'box',rar:tv>c.goods[1]*2?2:1,fake:false,special:'goods',name:c.goods[0],trueV:r1(tv),estV:r1(gp*rand(.9,1.6)),appraised:false,vis:randi(1,1e9)});sfx.bid();toast(`${c.goods[0]} 구입. 서울 만물상에서 팔아보자.`,'good');renderCity();},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.tagName==='A')e.preventDefault();ensureAudio();if(actx&&actx.state==='suspended')actx.resume();ACT[b.dataset.act]?.(b.dataset.arg,b);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if((phase==='world'||phase==='drive')&&(e.code==='KeyE'||e.code==='Enter'||(e.code==='Space'&&phase==='world'))&&$('#modal').hidden){e.preventDefault();ACT.enter();}
  if(phase==='world'&&e.code==='KeyF'&&WD.nearObj&&WD.nearObj.kind==='car')driveIn();else if(phase==='drive'&&e.code==='KeyF')driveOut();
  if(e.code==='KeyP'&&$('#modal').hidden)openPhone();
  if(phase==='auction'&&A.state==='bid'){if(e.code==='Space'||e.key==='1'){e.preventDefault();ACT.bid('1');}if(e.key==='5')ACT.bid('5');}
  if(phase==='unbox'&&(e.code==='Space'||e.code==='Enter')){const b=panel.querySelector('[data-act="reveal"],[data-act="auctionLobby"]');if(b){e.preventDefault();b.click();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running())persist();});addEventListener('pagehide',()=>{if(running())persist();});

/* ============ loop ============ */
let last=performance.now(),T0=0,lastCur=null,lastWall=Date.now(),saveT=0;const perf={t:0,n:0,cut:false};
function frame(now){const rdt=Math.min(.5,(now-last)/1000);const dt=Math.min(.05,rdt);last=now;T0+=dt;
  const w=Date.now();const wd=Math.max(0,(w-lastWall)/1000);lastWall=w;
  if(running()){if(wd>4)catchUp(wd*TSCALE/3600);else tick(wd);saveT+=wd;if(saveT>15&&running()){saveT=0;persist();}}
  const c=AU.center;c.open+=(c.target-c.open)*(1-Math.exp(-dt*3));c.mesh.position.y=1.6+c.open*3.2;
  if(P&&phase==='auction'&&A.state==='bid')updateBidding(rdt);
  for(const n of A.npcs){const f=n._fig;if(!f)continue;f.raise=Math.max(0,f.raise-dt*1.6);f.armR.rotation.z=Math.min(1,f.raise*2)*2.6;if(n._bubble){n._bubbleT-=dt;if(n._bubbleT<=0){f.g.remove(n._bubble);n._bubble=null;}}}
  const ac=AU.auctioneer;ac.raise=Math.max(0,ac.raise-dt*2.5);ac.armR.rotation.x=-Math.sin(Math.min(1,ac.raise)*Math.PI)*1.6-.3;
  if(phase==='unbox'&&U.cur&&U.cur._holder)U.cur._holder.rotation.y+=dt*.8;
  if(cur===scShop){SH.display.rotation.y+=dt*.7;SH.kim.head.rotation.y=Math.sin(T0*.7)*.3;}
  if(cur===scDealer)for(const t of scDealer.userData.turn)t.rotation.y+=dt*.3;
  if(cur===scWorld){const t=P&&P.paths?P.time:8+((T0*.25)%16);applyWorldTOD(t);if(P&&P.rain&&P.paths){if(WD.dome)WD.dome.material.color.multiplyScalar(.45);scWorld.fog.color.multiplyScalar(.5);scWorld.background.copy(scWorld.fog.color);scWorld.fog.near=25;scWorld.fog.far=120;WD.sun.intensity*=.35;}else{scWorld.fog.near=70;scWorld.fog.far=190;}updatePickups(dt);updateChat(dt);updateRain(dt);if(phase==='title')view.tt.set(Math.sin(T0*.07)*30,1.2,Math.cos(T0*.05)*10);updateWorld(dt);}
  if(room&&cur===room.scene){if(room.update)room.update(dt,T0);for(const k of room.appRoot.children)k.material.opacity=.65+.35*Math.sin(T0*6);if(P)applyTOD(room,P.time);if(room.dust){room.dust.rotation.y+=dt*.02;room.dust.position.y=Math.sin(T0*.3)*.06;}}
  if(pent&&cur===pent.s)pent.me.armR.rotation.z=2.4+Math.sin(T0*6)*.4;
  if(cur===HW.s)updateHighway(dt);
  if(IW.on&&IW.def&&cur===IW.def.scene)updateInterior(dt);
  if(cur===scKorea){for(const id in KR.pins)KR.pins[id].head.scale.setScalar(1+.12*Math.sin(T0*4+KR.pins[id].x));
    if(phase==='travel'||(phase==='phone'&&PH.prev==='travel')){const a=KR.pins[TV.from],b=KR.pins[TV.to],k=clamp((absNow()-TV.start)/(TV.end-TV.start),0,1),air=TV.to==='jeju'||TV.from==='jeju';KR.train.position.set(a.x+(b.x-a.x)*k,1+Math.sin(k*Math.PI)*(air?3.2:.5),a.z+(b.z-a.z)*k);KR.train.rotation.y=Math.atan2(-(b.z-a.z),b.x-a.x);}}
  if(P&&P.loc&&P.loc!=='seoul'&&cityScenes[P.loc]&&cur===cityScenes[P.loc].s){const cs=cityScenes[P.loc],d=todAt(P.time);if(cs.dome===undefined){cs.dome=makeDome();if(cs.dome)cs.s.add(cs.dome);}skyTint(d,cs.dome,cs.s);cs.sun.color.copy(d.sun);cs.sun.intensity=1.7*d.si;cs.hemi.intensity=.3+.75*d.hemi;if(cs.s.userData.boat){cs.s.userData.boat.position.y=Math.sin(T0*1.3)*.12;cs.s.userData.boat.rotation.z=Math.sin(T0*.9)*.05;}}
  const touch=navigator.maxTouchPoints>0;$('#joy').hidden=!((phase==='world'||phase==='drive'||inWalking())&&P&&touch);$('#drivebar').hidden=phase!=='drive';
  mgTick(rdt);shiftTick(Math.min(dt,.05));drawMinimap(dt);
  updateTweens(dt);updateBursts(dt);updateView(dt);
  if(cur!==lastCur){lastCur=cur;applyEnv(cur);const f=$('#fade');f.style.transition='none';f.style.opacity='1';requestAnimationFrame(()=>{f.style.transition='opacity .5s ease-out';f.style.opacity='0';});}
  perf.t+=rdt;perf.n++;if(perf.t>3){if(perf.t/perf.n>.045&&bloom.enabled&&!perf.cut){bloom.enabled=false;perf.cut=true;}perf.t=0;perf.n=0;}
  rpass.scene=cur;composer.render(dt);requestAnimationFrame(frame);}

/* ============ boot ============ */
cur=scWorld;WD.me.g.visible=false;
setView({target:new THREE.Vector3(0,1.2,-6),yaw:.5,pitch:.5,dist:30,yl:[-99,99],pl:[.3,1.2],dl:[9,40],auto:.04},true);
applyCam();
const meta=loadMeta();{const s=loadRun();if(s&&s.startDate){$('#btnCont').hidden=false;$('#btnNew').hidden=true;const n=document.createElement('p');n.className='muted';n.style.cssText='font-size:12px;margin:6px 0 0';n.textContent='인생은 한 번뿐. 파산하기 전엔 새로 시작할 수 없어요.';$('#btnCont').parentNode.after(n);}}
$('#rec').textContent=meta.runs?`지금까지 ${meta.runs}번의 인생 · 최고 점수 ${(meta.best||0).toLocaleString('ko-KR')}점`:'';
requestAnimationFrame(frame);
