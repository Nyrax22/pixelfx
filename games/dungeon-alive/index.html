<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>던전이 살아있다</title>
<meta name="description" content="살아 있는 던전의 심장이 되어 방어 카드를 고르고 배치해 침입자를 막아내는 역던전 로그라이트.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: dark;
  --bg: #0b0814; --panel: #1a1430; --panel2: #241c40; --line: #3a2e58; --line2: #5a4a86;
  --text: #ece6ff; --dim: #a89cc8; --cyan: #4fe0e8; --crimson: #e0284a; --gold: #ffd25a; --orange: #ff9a3a;
  --trap: #ff9a3a; --facility: #4fe0e8; --monster: #8ad85a; --spell: #c684ff; --support: #ff7a9a;
  --ui: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --title: "Nanum Myeongjo", "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --hand: "Nanum Pen Script", "Gaegu", cursive;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#hud { display: flex; align-items: center; gap: 14px; padding: max(8px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: linear-gradient(#150f28, #0f0a1e); border-bottom: 2px solid var(--line); min-height: 48px; flex-wrap: wrap; }
.hp { display: flex; align-items: center; gap: 6px; }
.hp .ico { color: var(--crimson); font-size: 22px; display: inline-block; animation: beat 1s infinite; text-shadow: 0 0 8px #ff3a5a88; }
@keyframes beat { 0%, 30%, 100% { transform: scale(1); } 12% { transform: scale(1.25); } }
.bar { width: 110px; height: 12px; background: #2a1a2e; border: 2px solid #000; box-shadow: 0 0 0 1px var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ff5a6a, #c01838); transition: width .2s; }
.mana { display: flex; align-items: center; gap: 3px; }
.mana .gem { width: 11px; height: 11px; transform: rotate(45deg); background: #2a2050; border: 1px solid #000; }
.mana .gem.on { background: linear-gradient(135deg, #a8fff8, #3ac8e0); box-shadow: 0 0 6px #4fe0e8aa; }
.mana .gem.part { background: linear-gradient(135deg, #3a6a80, #2a4a60); }
#dayText { font-family: var(--title); font-weight: 700; font-size: 18px; color: var(--gold); }
#waveText { color: var(--dim); font-size: 15px; }
#powerText { color: #c8b0ff; font-size: 14px; margin-left: auto; }
.hbtn { background: var(--panel2); border: 2px solid var(--line2); border-radius: 6px; padding: 4px 10px; font-size: 15px; min-width: 40px; }
.hbtn:hover { border-color: var(--cyan); }
#stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; width: 100%; height: 100%; touch-action: none; }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.ft { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 15px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: rise 1.2s ease-out forwards; }
.ft.synergy { color: #bfe8ff; font-size: 18px; }
.ft.fear { color: #c8b0ff; font-size: 13px; }
.ft.warn { color: var(--gold); }
.ft.shriek { color: #ffb0d0; font-size: 13px; }
.ft.combo { font-family: var(--title); font-weight: 800; color: var(--gold); font-size: clamp(30px, 5vw, 44px); -webkit-text-stroke: 1.5px #3a1a00; animation: pop 1s ease-out forwards; }
.ft.combo.mega { color: #ff5a6a; font-size: clamp(38px, 7vw, 64px); -webkit-text-stroke: 2px #2a0008; text-shadow: 0 4px 0 #000, 0 0 24px #ff2a4a; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -34px; } }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; margin-top: -20px; } }
#hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #0b0814dd; border: 2px solid var(--line); border-radius: 8px; padding: 6px 14px; font-size: 15px; color: #e8e0ff; pointer-events: none; max-width: 92%; text-align: center; transition: opacity .3s; }
#hint:empty { opacity: 0; }
#banner { font-family: var(--title); font-weight: 800; letter-spacing: .08em; position: absolute; left: 50%; top: 18%; transform: translate(-50%, -50%); font-size: clamp(28px, 5vw, 46px); -webkit-text-stroke: 1px #3a0410; color: #fff; text-shadow: 0 3px 0 #000, 0 0 18px #000; pointer-events: none; white-space: nowrap; opacity: 0; }
#banner.show { animation: banner 2s ease-out forwards; }
#banner small { display: block; text-align: center; font-size: 16px; color: var(--dim); }
@keyframes banner { 0% { opacity: 0; letter-spacing: 8px; } 15% { opacity: 1; letter-spacing: 1px; } 80% { opacity: 1; } 100% { opacity: 0; } }
#tray { display: flex; align-items: flex-end; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(#0f0a1e, #150f28); border-top: 2px solid var(--line); min-height: 118px; }
#hand { display: flex; gap: 8px; flex: 1; overflow-x: auto; padding: 10px 2px 2px; min-height: 104px; align-items: flex-end; scrollbar-width: thin; }
#hand:empty::before { content: attr(data-empty); color: var(--dim); font-size: 14px; align-self: center; padding-left: 6px; }
.card { position: relative; flex: 0 0 auto; width: 78px; height: 100px; background: linear-gradient(#2a2148, #1a1430); border: 2px solid var(--line2); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; align-items: center; transition: transform .12s, border-color .12s; cursor: pointer; }
.card:hover { transform: translateY(-4px); }
.card.sel { transform: translateY(-10px); border-color: #fff; box-shadow: 0 0 0 2px var(--cyan), 0 6px 18px #4fe0e866; }
.card.poor { filter: saturate(.3) brightness(.7); }
.card .stripe { position: absolute; inset: 0 0 auto 0; height: 4px; border-radius: 6px 6px 0 0; }
.card .cost { position: absolute; top: -9px; left: -9px; width: 26px; height: 26px; transform: rotate(45deg); background: linear-gradient(135deg, #a8fff8, #2a9ab0); border: 2px solid #000; display: grid; place-items: center; }
.card .cost b { transform: rotate(-45deg); color: #04141a; font-size: 15px; }
.card canvas { image-rendering: pixelated; width: 48px; height: 48px; margin-top: 6px; }
.card .nm { font-weight: 700; font-size: 13px; text-align: center; line-height: 1.1; margin-top: 2px; word-break: keep-all; }
.card .kd { font-size: 10px; color: var(--dim); }
.k-trap .stripe { background: var(--trap); } .k-facility .stripe { background: var(--facility); } .k-monster .stripe { background: var(--monster); } .k-spell .stripe { background: var(--spell); } .k-support .stripe { background: var(--support); }
.card.big { width: 150px; height: 214px; padding: 10px 8px; }
.card.big canvas { width: 72px; height: 72px; margin-top: 8px; }
.card.big .nm { font-size: 19px; margin-top: 6px; }
.card.big .kd { font-size: 12px; margin-top: 2px; }
.card.big .ds { font-size: 13px; color: #d8d0f0; text-align: center; margin-top: 8px; line-height: 1.3; word-break: keep-all; }
.card.big .cost { width: 34px; height: 34px; top: -12px; left: -12px; }
.card.big .cost b { font-size: 19px; }
.card.room canvas { width: 112px; height: 84px; }
.card .bred { position: absolute; top: 4px; right: 5px; font-size: 11px; color: #ff9ad8; }
#actions { display: flex; flex-direction: column; gap: 6px; }
.btn { background: linear-gradient(#5a3ab0, #3a2280); border: 2px solid #000; box-shadow: 0 0 0 2px var(--line2), 0 4px 0 #1a0f3a; border-radius: 8px; padding: 10px 18px; font-size: 18px; color: #fff; white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 2px var(--line2), 0 2px 0 #1a0f3a; }
.btn.red { background: linear-gradient(#c8283a, #801428); }
.btn.cyan { background: linear-gradient(#1fa8b8, #127080); }
.btn.ghost { background: transparent; box-shadow: 0 0 0 2px var(--line2); }
.btn:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
#modal { position: fixed; inset: 0; background: #05030ccc; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#modal[hidden] { display: none; }
.panel { background: linear-gradient(#211a3c, #150f28); border: 2px solid #000; box-shadow: 0 0 0 2px var(--line2), 0 20px 60px #000; border-radius: 12px; padding: 20px 22px; max-width: min(760px, 100%); max-height: 100%; overflow: auto; text-align: center; }
.panel h2 { margin: 0 0 4px; font-family: var(--title); font-weight: 800; font-size: 26px; color: var(--gold); letter-spacing: .04em; text-shadow: 0 2px 0 #000; }
.panel .sub { color: var(--dim); margin-bottom: 16px; font-size: 15px; }
.choices { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 12px 0 6px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.party { display: inline-flex; gap: 6px; align-items: center; background: #0b0814; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: var(--dim); font-size: 14px; }
.stat { display: grid; grid-template-columns: auto auto; gap: 6px 18px; justify-content: center; text-align: left; margin: 10px 0; font-size: 17px; }
.stat b { color: var(--gold); font-weight: normal; text-align: right; }
.rumor { background: #2a1e14; border: 2px solid #5a4024; border-radius: 10px; padding: 10px 14px; color: #f0dcb8; margin-top: 12px; font-size: 15px; text-align: left; }
.rumor::before { content: "🍺 선술집 소문 "; color: var(--gold); }
#mercy { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 15; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.mq { pointer-events: auto; background: #1a1430f2; border: 2px solid #000; box-shadow: 0 0 0 2px #ff9ab0; border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 15px; animation: slidein .25s; }
.mq .tm { height: 3px; background: #ff9ab0; position: absolute; left: 0; bottom: 0; }
.mq button { border: 2px solid #000; border-radius: 6px; padding: 5px 10px; font-size: 14px; }
.mq .spare { background: #2a6a4a; } .mq .kill { background: #6a1a2a; }
@keyframes slidein { from { transform: translateY(-14px); opacity: 0; } }
#toast { position: fixed; left: 50%; bottom: 138px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 6px; align-items: center; z-index: 16; pointer-events: none; }
.tt { background: #0b0814ee; border: 2px solid var(--line2); border-radius: 8px; padding: 6px 12px; font-size: 14px; animation: slidein .2s, fade 3.6s forwards; pointer-events: auto; cursor: pointer; }
@keyframes fade { 85% { opacity: 1; } 100% { opacity: 0; } }
#subtitle { position: fixed; left: 50%; bottom: 16%; transform: translateX(-50%); font-size: 22px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; z-index: 18; text-align: center; max-width: 90%; pointer-events: none; transition: opacity .6s; word-break: keep-all; }
#story { position: fixed; inset: 0; z-index: 19; pointer-events: none; opacity: 0; transition: opacity 1.6s; background: #000; overflow: hidden; }
#story.on { opacity: 1; }
#story img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--ox, 50%) var(--oy, 50%); opacity: 0; transition: opacity 1.8s, transform var(--kb, 12s) linear; transform: scale(1.04); transform-origin: var(--ox, 50%) var(--oy, 50%); }
#story img.on { opacity: 1; }
#story img.go { transform: scale(var(--kz, 1.16)) translate(var(--kx, 0), var(--ky, 0)); }
#story img.px { image-rendering: pixelated; }
#story canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#story::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, #000d 100%); }
body.cine #subtitle { z-index: 21; font-family: var(--title); font-size: clamp(17px, 2.6vw, 26px); letter-spacing: .03em; }
#subtitle.speech { color: #ffd9c8; font-style: italic; }
#curtain { position: fixed; inset: 0; background: #000; z-index: 19; pointer-events: none; opacity: 0; transition: opacity 1.2s; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #e8e0ff; }
#curtain.on { opacity: 1; pointer-events: auto; }
body.cine #hud, body.cine #tray { visibility: hidden; }
body.meta #camBtn, body.meta .hp, body.meta .mana, body.meta #dayText, body.meta #waveText, body.meta #speedBtn, body.meta #tray { visibility: hidden; }
body.cine::before, body.cine::after { content: ""; position: fixed; left: 0; right: 0; height: 10vh; background: #000; z-index: 17; animation: bars .9s ease-out; }
body.cine::before { top: 0; } body.cine::after { bottom: 0; }
@keyframes bars { from { height: 0; } }
#epic { font-family: var(--title); font-weight: 700; position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 21; text-align: center; pointer-events: none; font-size: clamp(22px, 3.6vw, 40px); color: #fff4e0; text-shadow: 0 0 18px #000, 0 3px 0 #000; opacity: 0; transition: opacity 1.2s, letter-spacing 3s; letter-spacing: .02em; width: 90%; word-break: keep-all; line-height: 1.5; }
#epic.on { opacity: 1; letter-spacing: .08em; }
#epic.red { color: #ffb0b8; text-shadow: 0 0 24px #a0001a, 0 3px 0 #000; }
#title { position: fixed; inset: 0; z-index: 23; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
#title.on { opacity: 1; }
#title .logo { font-family: var(--title); font-weight: 800; letter-spacing: .06em; font-size: clamp(44px, 11vw, 128px); color: #f4d8d0; text-shadow: 0 0 2px #fff, 0 0 18px #ff2a4a, 0 0 56px #a0102a, 0 7px 0 #3a0410; white-space: nowrap; }
#title .logo span { display: inline-block; opacity: 0; }
#title.on .logo span { animation: slam .55s cubic-bezier(.2, 1.6, .4, 1) forwards; animation-delay: calc(var(--i) * .13s); }
#title.beat .logo { animation: tbeat 1.1s infinite; }
@keyframes slam { 0% { opacity: 0; transform: scale(3.2) translateY(-30px); filter: blur(8px); } 60% { opacity: 1; transform: scale(.9); filter: none; } 100% { opacity: 1; transform: scale(1); } }
@keyframes tbeat { 0%, 30%, 100% { transform: scale(1); } 10% { transform: scale(1.05); } 20% { transform: scale(1.02); } }
#title .tag { font-family: var(--title); margin-top: 12px; font-size: clamp(15px, 2.6vw, 24px); color: #d8a8b8; letter-spacing: .6em; opacity: 0; transition: opacity 1.4s 1.7s; padding-left: .6em; }
#title.on .tag { opacity: 1; }
#roarBtn { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 5; width: 92px; height: 92px; border-radius: 50%; border: 3px solid #000; box-shadow: 0 0 0 2px #6a1a2a; background: #2a0a14; color: #fff; font-size: 13px; overflow: hidden; line-height: 1.15; flex: 0 0 auto; }
#roarBtn::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#ff4a6a, #a0102a); transform-origin: bottom; transform: scaleY(var(--fill, 0)); transition: transform .2s; }
#roarBtn span { position: relative; text-shadow: 0 1px 0 #000; }
#roarBtn b { display: block; font-size: 24px; font-weight: normal; }
#roarBtn.ready { animation: roarGlow .7s infinite alternate; box-shadow: 0 0 0 2px #ffb0c0, 0 0 26px #ff2a4a; }
@keyframes roarGlow { to { transform: scale(1.08); box-shadow: 0 0 0 3px #fff, 0 0 40px #ff2a4a; } }
#skip { position: fixed; right: 14px; bottom: 14px; z-index: 24; }
.paper { background: #efe2c0; color: #3a2a18; border-radius: 4px; padding: 22px 26px; font-family: var(--hand); font-size: 25px; line-height: 1.45; text-align: left; white-space: pre-wrap; box-shadow: 0 10px 40px #000, inset 0 0 40px #c8b088; max-width: 520px; position: relative; }

.paper.warrior { font-family: "Gaegu", var(--hand); font-weight: 700; transform: rotate(-1deg); }
.paper.mage { font-family: "Gaegu", var(--hand); }
.paper .stain { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(#8a6a4a44, transparent 70%); }
.list { text-align: left; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.li { background: #0f0a1e; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.li.lock { color: #5a5070; cursor: default; }
.li.got { border-color: #6a5aa0; }
.li.next { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.li small { color: var(--dim); }
.tabs { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
.tabs button { background: var(--panel2); border: 2px solid var(--line); border-radius: 6px; padding: 5px 12px; font-size: 15px; }
.tabs button.on { border-color: var(--gold); color: var(--gold); }
.monsel { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mon { background: #0f0a1e; border: 2px solid var(--line); border-radius: 10px; padding: 6px; width: 104px; cursor: pointer; font-size: 12px; }
.mon canvas { width: 64px; height: 56px; image-rendering: pixelated; }
.mon.sel { border-color: var(--monster); box-shadow: 0 0 0 2px var(--monster); }
.mon .tr { color: #ff9ad8; font-size: 11px; min-height: 14px; }
.stamp { font-family: var(--title); font-weight: 800; letter-spacing: .1em; display: inline-block; border: 5px solid var(--crimson); color: var(--crimson); font-size: 46px; padding: 2px 16px; border-radius: 10px; transform: rotate(-12deg); animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1); margin: 6px 0 12px; }

@keyframes stamp { from { transform: rotate(-12deg) scale(3); opacity: 0; } }
input.name { font-family: var(--ui); font-size: 20px; background: #0b0814; color: #fff; border: 2px solid var(--line2); border-radius: 8px; padding: 8px 12px; width: 240px; text-align: center; }

.abyss { position: fixed; inset: 0; z-index: 17; pointer-events: none; opacity: 0; transition: opacity 1.5s; background: radial-gradient(ellipse at 50% 120%, #000 0%, #000 40%, transparent 75%); }
.abyss.on { opacity: 1; }
.abyss i { position: absolute; bottom: 14%; width: 22px; height: 10px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 20px 8px #ff000088; animation: blink 3s infinite; }
@keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
.traitor { display: flex; gap: 16px; align-items: center; text-align: left; font-size: 20px; }
.traitor canvas { width: 80px; height: 96px; image-rendering: pixelated; }
.pw { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 10px 0; }

  .bar { width: 54px; height: 10px; }
  #hpText { font-size: 13px; }
  .mana .gem { width: 8px; height: 8px; }
  #dayText { font-size: 14px; }
  #powerText { font-size: 12px; margin-left: 0; order: 10; }

  .hbtn { padding: 2px 8px; min-width: 34px; font-size: 13px; }

  #hand { min-height: 108px; }
  .card { width: 76px; height: 100px; }
