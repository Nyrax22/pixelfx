<!doctype html><!--wrap-->
<html lang="ko"><!--wrap-->
<head><!--wrap-->
<meta charset="utf-8"><!--wrap-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><!--wrap-->
<title>솔솔섬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a full-bleed 3D island with small paper-leaf cards pinned to the corners, like notes on a field journal. */
:root{
  --leaf:#2f6b4f;      /* deep leaf green: headings, buttons */
  --mint:#dff3e6;      /* soft mint: card tint */
  --card:#fffdf6;      /* journal paper */
  --ink:#24352d;       /* text */
  --muted:#6d8277;     /* secondary text */
  --sun:#ffc94a;       /* stars, highlights */
  --berry:#ff7a8a;     /* NEW badge */
  --sea:#3fa7c4;
  --shadow:0 6px 0 rgba(36,53,45,.18);
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd7f0;color:var(--ink);font-family:var(--body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;}
button{font-family:var(--display);cursor:pointer;color:var(--ink);}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}

.hud{position:fixed;z-index:5;pointer-events:none;}
.hud > *{pointer-events:auto;}
#hudTL{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;}
#hudTR{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;}
.chip{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px 14px;font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px;border:2px solid #e9e2cc;}
.chip small{font-family:var(--body);font-size:12px;color:var(--muted);}
#clock .ic{font-size:22px;}
#stars{font-size:16px;}
.btn{background:var(--card);border:2px solid #e9e2cc;border-radius:16px;box-shadow:var(--shadow);padding:8px 14px;font-size:17px;display:flex;align-items:center;gap:6px;}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(36,53,45,.18);}
.btn.primary{background:var(--leaf);color:#fff;border-color:#24563f;}
#dexBtn b{color:var(--leaf);}

#hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:rgba(36,53,45,.78);color:#fff;border-radius:999px;padding:8px 18px;font-family:var(--display);font-size:16px;white-space:nowrap;pointer-events:none;transition:opacity .2s;}
#hint kbd{background:#fff;color:var(--ink);border-radius:6px;padding:1px 7px;margin-right:6px;font-family:var(--display);font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);}

#toast{position:fixed;z-index:8;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s;width:min(360px,calc(100% - 32px));background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:2px solid #e9e2cc;padding:12px 16px;display:flex;gap:12px;align-items:center;pointer-events:none;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast .ico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;}
#toast .t{font-family:var(--display);font-size:18px;line-height:1.25;}
#toast .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;}
.new{display:inline-block;background:var(--berry);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:var(--display);}

.bubble{position:fixed;z-index:6;transform:translate(-50%,-100%);background:var(--card);border:2px solid #e9e2cc;border-radius:16px;padding:8px 12px;font-size:14px;max-width:240px;box-shadow:var(--shadow);pointer-events:none;line-height:1.45;}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid #e9e2cc;border-bottom:2px solid #e9e2cc;transform:translateX(-50%) rotate(45deg);}
.bubble b{font-family:var(--display);color:var(--leaf);font-weight:normal;}
#bang{position:fixed;z-index:6;transform:translate(-50%,-100%);font-family:var(--display);font-size:42px;color:#ff5a4a;text-shadow:0 3px 0 #fff,0 0 12px #fff;pointer-events:none;}

/* touch controls */
#joy{position:fixed;z-index:4;width:120px;height:120px;border-radius:50%;background:rgba(255,253,246,.35);border:3px solid rgba(255,255,255,.7);transform:translate(-50%,-50%);pointer-events:none;}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,253,246,.9);box-shadow:0 3px 0 rgba(0,0,0,.15);}
#act{position:fixed;z-index:5;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:var(--shadow);font-size:20px;display:none;}
.touch #act{display:block;}
.touch #hint{bottom:calc(120px + env(safe-area-inset-bottom,0px));}
.touch .kb{display:none;}

/* overlays */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(36,53,45,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));}
#intro{background:linear-gradient(180deg,rgba(159,215,240,.15),rgba(36,53,45,.45));}
.introCard{background:var(--card);border-radius:28px;box-shadow:0 10px 0 rgba(36,53,45,.25);border:3px solid #e9e2cc;padding:28px 26px 22px;max-width:400px;width:100%;text-align:center;}
.introCard h1{font-family:var(--display);font-weight:normal;font-size:56px;margin:0;color:var(--leaf);letter-spacing:2px;line-height:1;}
.introCard h1 span{color:var(--sun);text-shadow:0 3px 0 #e2a92a;}
.introCard p{margin:12px 0 18px;line-height:1.6;color:var(--muted);font-size:15px;}
.introCard .btn{margin:0 auto;font-size:22px;padding:12px 28px;}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:13px;margin:18px auto 0;max-width:280px;color:var(--ink);}
.keys kbd{font-family:var(--display);background:var(--mint);border-radius:6px;padding:1px 7px;font-size:13px;white-space:nowrap;justify-self:start;}

#dex .panel{background:var(--card);border-radius:26px;border:3px solid #e9e2cc;box-shadow:0 10px 0 rgba(36,53,45,.25);width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;}
.dexHead{display:flex;align-items:center;gap:12px;padding:16px 18px 8px;flex-wrap:wrap;}
.dexHead h2{font-family:var(--display);font-weight:normal;font-size:28px;margin:0;color:var(--leaf);flex:1;min-width:0;}
.prog{height:10px;background:var(--mint);border-radius:99px;overflow:hidden;margin:0 18px 8px;}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7fd08f,var(--leaf));border-radius:99px;transition:width .4s;}
.tabs{display:flex;gap:6px;padding:4px 18px 10px;overflow-x:auto;}
.tab{border:2px solid #e9e2cc;background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap;}
.tab[aria-selected="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf);}
.tab small{font-family:var(--body);opacity:.8;margin-left:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:4px 18px 14px;overflow-y:auto;min-height:0;flex:1;}
.card{border:2px solid #efe8d3;background:#fff;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--body);}
.card .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;}
.card .nm{font-family:var(--display);font-size:14px;line-height:1.15;text-align:center;}
.card .no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.card.lock .ico{background:#ece8dc;filter:grayscale(1);color:#b8b2a2;}
.card.lock .nm{color:#b8b2a2;}
.card[aria-pressed="true"]{border-color:var(--leaf);background:var(--mint);}
.detail{border-top:2px dashed #e9e2cc;padding:14px 18px 18px;display:flex;gap:14px;align-items:flex-start;min-height:92px;}
.detail .ico{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:38px;}
.detail h3{margin:0;font-family:var(--display);font-weight:normal;font-size:20px;}
.detail p{margin:6px 0 0;font-size:14px;line-height:1.55;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tags span{font-size:12px;background:var(--mint);color:var(--leaf);border-radius:999px;padding:2px 9px;}
.rar{color:#e2a92a;letter-spacing:1px;font-size:14px;margin-left:6px;}
@media (max-width:480px){
  .chip{font-size:15px;padding:6px 10px;}
  .btn{font-size:15px;padding:6px 10px;}
  #clock .ic{font-size:18px;}
  .introCard h1{font-size:46px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}
</style>
</head><!--wrap-->
<body><!--wrap-->
<canvas id="game" tabindex="0" aria-label="솔솔섬 3D 화면"></canvas>

<div class="hud" id="hudTL">
  <div class="chip" id="clock"><span class="ic">☀️</span><span id="clockTxt">오전 7:00</span><small id="dayTxt">1일째</small></div>
  <div class="chip" id="stars">⭐ <span id="starTxt">0</span><small>별조각</small></div>
</div>
<div class="hud" id="hudTR">
  <button class="btn" id="muteBtn" aria-label="소리 켜기/끄기">🔈</button>
  <button class="btn" id="dexBtn">📖 도감 <b id="dexCount">0/40</b></button>
</div>
<div id="hint" style="opacity:0"></div>
<div id="toast" role="status" aria-live="polite"><div class="ico"></div><div><div class="t"></div><div class="d"></div></div></div>
<div class="bubble" id="bubble" hidden></div>
<div id="bang" hidden>!</div>
<div id="joy" hidden><i></i></div>
<button id="act" aria-label="행동">잡기</button>

<div class="overlay" id="intro">
  <div class="introCard">
    <h1>솔솔<span>섬</span></h1>
    <p>바람이 솔솔 부는 작은 섬.<br>곤충을 잡고, 물고기를 낚고, 해변을 거닐며<br>40종의 친구들을 도감에 모아보세요.</p>
    <button class="btn primary" id="startBtn">섬으로 가기</button>
    <div class="keys kb">
      <kbd>WASD · 방향키</kbd><span>걷기 (Shift 달리기)</span>
      <kbd>Space</kbd><span>잡기 · 낚시 · 줍기 · 대화</span>
      <kbd>B</kbd><span>도감 열기</span>
      <kbd>Q / E · 드래그</kbd><span>카메라 돌리기</span>
    </div>
    <div class="keys touchOnly" hidden>
      <kbd>왼쪽 화면</kbd><span>조이스틱 (끝까지 밀면 달리기)</span>
      <kbd>노란 버튼</kbd><span>잡기 · 낚시 · 줍기 · 대화</span>
      <kbd>오른쪽 드래그</kbd><span>카메라 돌리기</span>
    </div>
  </div>
</div>

<div class="overlay" id="dex" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dexTitle">
    <div class="dexHead"><h2 id="dexTitle">나의 섬 도감</h2><span class="chip" style="box-shadow:none" id="dexSum">0 / 40</span><button class="btn" id="dexClose" aria-label="도감 닫기">닫기</button></div>
    <div class="prog"><i id="dexBar" style="width:0"></i></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, z) {

  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const coastR = a => 35 + 3.5 * Math.sin(a * 3 + 1) + 2.2 * Math.sin(a * 5 + 2) + 1.2 * Math.sin(a * 8 + 0.5);
const POND = { x: 12, z: -6, r: 5.2, y: 1.1 };
const HOUSE = { x: -9, z: -3 };
function edgeT(x, z) { return coastR(Math.atan2(z, x)) - Math.hypot(x, z); }
function heightAt(x, z) {

  const land = smooth(-3, 7, t);
  let h = -1.5 + land * 2.9 + land * land * (noise(x * 0.07 + 3, z * 0.07) * 1.4 + 1.6 * Math.exp(-((x + 14) ** 2 + (z - 12) ** 2) / 70));
  const dp = Math.hypot(x - POND.x, z - POND.z);
  if (dp < 11) { const k = smooth(11, 7, dp); h = h * (1 - k) + 1.5 * k; h -= smooth(5.4, 2, dp) * 2.3; }
  const dh = Math.hypot(x - HOUSE.x, z - HOUSE.z);
  if (dh < 7) { const k = smooth(7, 4, dh); h = h * (1 - k) + (heightAt0(HOUSE.x, HOUSE.z)) * k; }
  return h;
}
function heightAt0(x, z) { // terrain without house flattening (for house base)
  const t = edgeT(x, z), land = smooth(-3, 7, t);
  return -1.5 + land * 2.9 + land * land * (noise(x * 0.07 + 3, z * 0.07) * 1.4 + 1.6 * Math.exp(-((x + 14) ** 2 + (z - 12) ** 2) / 70));
}
const inPondZone = (x, z) => Math.hypot(x - POND.x, z - POND.z) < 6.2;
const waterLevel = (x, z) => inPondZone(x, z) ? POND.y : 0;

function typeAt(x, z) {
  if (onDock(x, z)) return 'dock';
  const h = heightAt(x, z);

}

function manageSpawns() {
  if (bugs.length < 11) spawnBug();
  const seaN = shadows.filter(s => s.pool === 'sea').length, pondN = shadows.length - seaN;
  if (seaN < 8) spawnShadow('sea');
  if (pondN < 3) spawnShadow('pond');
  const beachN = picks.filter(p => p.e.cat === 'beach').length;
  if (beachN < 7) spawnPick('beach');
  if (picks.length - beachN < 6) spawnPick('flower');
  // drop out-of-time things that are far from the player
  for (const b of bugs.slice()) if (!timeOK(b.e) && !b.flee && dist2(b.m.position) > 100) { b.flee = 0.01; }
  for (const s of shadows.slice()) if (!timeOK(s.e) && !s.hooked && dist2(s.m.position) > 64) s.gone = true;

const dist2 = v => (v.x - player.x) ** 2 + (v.z - player.z) ** 2;

let actx = null, master = null, muted = false, noiseBuf = null;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;

}

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

  plop: () => tone(520, 0, 0.08, 'sine', 0.14),
  bite: () => { noiseHit(0, 0.25, 1200, 0.4); tone(220, 0, 0.18, 'triangle', 0.15); },
  pick: () => { tone(880, 0, 0.15, 'triangle', 0.15); tone(1320, 0.07, 0.25, 'triangle', 0.13); },
  catch: (isNew) => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.16)); if (isNew) [1319, 1568, 2093].forEach((f, i) => tone(f, 0.4 + i * 0.08, 0.6, 'sine', 0.1)); },
  miss: () => { tone(392, 0, 0.2, 'triangle', 0.12); tone(330, 0.12, 0.3, 'triangle', 0.12); },

// gentle generative music: pentatonic random walk
const PENTA = [0, 2, 4, 7, 9];
let musicStep = 0, musicIdx = 7, nextNote = 0;
function musicTick(now) {

  const night = isNight(); const beat = night ? 0.9 : 0.62;

  if (musicStep % 8 === 0) { const chord = [0, 5, 3, 4][(musicStep / 8 | 0) % 4]; const root = base / 2 * Math.pow(2, PENTA[chord % 5] / 12); tone(root, 0, beat * 7, 'sine', 0.07, 0.4); tone(root * 1.5, 0.05, beat * 6, 'sine', 0.035, 0.6); }

let fishing = null;

  for (const d of [3, 3.8, 2.4, 4.6, 1.8]) { const x = player.x + fx * d, z = player.z + fz * d; if (isWater(x, z)) return { x, z }; }

    }
  } else {
    let dipTarget = 0;
    if (f.phase === 'wait') {
      if (f.sh) {
        const s = f.sh, dx = f.x - s.x, dz = f.z - s.z, d = Math.hypot(dx, dz);
        const sp = 0.9 * dt; if (d > 0.55) { s.x += dx / d * sp; s.z += dz / d * sp; s.m.rotation.z = Math.atan2(-dx, -dz) + Math.PI; }
        else { f.phase = 'nibble'; f.nib = 1 + (rnd() * 3 | 0); f.wait = 0.9 + rnd() * 0.9; }
      } else if (f.t > 5) { endFishing(); toast('🎣', '#d9f0f6', '입질이 없네요…', '물고기 그림자 가까이에 찌를 던져보세요.'); return; }
    } else if (f.phase === 'nibble') {
      f.wait -= dt;
      if (f.wait <= 0) {
        if (f.nib > 0) { f.nib--; f.dip = 0.08; SFX.plop(); ripple(f.x, f.y, f.z); f.wait = 0.8 + rnd() * 1.1; }
        else { f.phase = 'bite'; f.wait = 0.95 - f.sh.e.r * 0.1; f.dip = 0.3; SFX.bite(); ripple(f.x, f.y, f.z, true); $('#bang').hidden = false; }
      }
    } else if (f.phase === 'bite') {
      f.wait -= dt; dipTarget = 0.25;
      if (f.wait <= 0) { $('#bang').hidden = true; const s = f.sh; s.gone = true; s.hooked = false; endFishing(); SFX.miss(); toast('💨', '#ececec', '놓쳤다…', '찌가 쑥 잠기는 순간에 바로 눌러보세요!'); return; }
    }
    f.dip = lerp(f.dip, dipTarget, dt * 6);
    bobber.position.set(f.x, f.y + Math.sin(f.t * 3) * 0.03 - f.dip, f.z);
    if (!$('#bang').hidden) placeAt($('#bang'), f.x, f.y + 1.6, f.z);
  }
  const lp = lineGeo.attributes.position; lp.setXYZ(0, v3.x, v3.y, v3.z); lp.setXYZ(1, bobber.position.x, bobber.position.y + 0.1, bobber.position.z); lp.needsUpdate = true;
}
function fishingAction() {
  const f = fishing;
  if (f.phase === 'bite') { const s = f.sh; s.hooked = false; removeShadow(s); endFishing(); SFX.splash(); obtain(s.e); }
  else if (f.phase === 'nibble') { const s = f.sh; s.hooked = false; s.gone = true; endFishing(); SFX.miss(); toast('💦', '#ececec', '앗, 너무 빨랐어요!', '톡톡 건드릴 땐 기다리고, 크게 잠길 때 눌러요.'); }
  else { if (f.sh) f.sh.hooked = false; endFishing(); }
}

/* ================= INTERACTION ================= */
function frontDot(px, pz) { const dx = px - player.x, dz = pz - player.z, d = Math.hypot(dx, dz) || 1; return (dx * Math.sin(player.rot) + dz * Math.cos(player.rot)) / d; }
function nearestPick() { let best = null, bd = 1.8; for (const p of picks) { const d = Math.hypot(p.x - player.x, p.z - player.z); if (d < bd) { bd = d; best = p; } } return best; }
function bugInRange(r = 2.4) { let best = null, bd = r; for (const b of bugs) { if (b.flee) continue; const p = b.m.position, d = Math.hypot(p.x - player.x, p.z - player.z); if (d < bd && (frontDot(p.x, p.z) > 0.15 || d < 1)) { bd = d; best = b; } } return best; }
const nearNpc = () => Math.hypot(npc.x - player.x, npc.z - player.z) < 2.3;
function currentAction() {
  if (fishing) return fishing.phase === 'bite' ? '건져 올리기!' : '낚싯줄 거두기';
  if (nearestPick()) return '줍기';
  if (bugInRange()) return '잡기';
  if (nearNpc()) return '말 걸기';
  if (waterAhead()) return '낚시하기';
  return '잠자리채 휘두르기';
}
function doAction() {
  if (!started || !$('#dex').hidden) return;
  initAudio();
  if (fishing) return fishingAction();
  if (player.busy > 0 || player.swing > 0) return;
  const p = nearestPick(); if (p) { removePick(p); SFX.pick(); obtain(p.e); return; }
  if (bugInRange()) return startSwing();
  if (nearNpc()) return talk();
  const w = waterAhead(); if (w) return startCast(w);
  startSwing();
}
function startSwing() { player.swing = 0.42; player.swingHit = false; net.visible = true; SFX.swing(); }
function resolveSwing() {
  const b = bugInRange(2.6);
  if (b) { removeBug(b); obtain(b.e); return; }
  for (const o of bugs) if (o.e.r >= 2 && Math.hypot(o.m.position.x - player.x, o.m.position.z - player.z) < 4 && rnd() < 0.6) o.flee = 0.01;
}
const NPC_TIPS = [
  '물고기 그림자 가까이에 찌를 던져봐. 톡톡 건드릴 땐 참고, 쑥 잠길 때 누르는 거야옹.',
  '달리면 겁 많은 친구들이 도망가. 살금살금 걸어서 다가가봐.',
  '밤이 되면 나무에 커다란 딱정벌레가 붙어 있대. 나무 줄기를 잘 살펴봐.',
  '북쪽 선착장 끝에서 아주아주 커다란 그림자를 봤어… 꿈이었을까?',
  '모래사장에 반짝이는 게 보이면 가까이 가서 주워봐.',
  '연못에는 바다랑 다른 물고기가 살아. 밤의 연못엔 수염 난 친구도 있대.',
  '무지개 장미는… 정말 운이 좋아야 볼 수 있대. 풀밭의 반짝임을 놓치지 마.',
  '꽃 위에 앉은 친구들은 가만히 있으니까 잡기 쉬워.',
  '해가 지고 나면 달빛나비가 나타난다는 전설이 있어옹.',
];
function talk() {
  SFX.talk(); const n = foundCount(); let l;
  if (isNight() && rnd() < 0.4) l = 'zZ… 음냐… 반딧불이가… 반짝반짝… (모모는 졸린가 봐요)';
  else if (n === 0) l = '어서 와! 이 섬엔 신기한 친구들이 잔뜩 살아. 가까이 가서 스페이스를 눌러봐!';
  else if (n >= DEXN) l = '도감을 전부 채웠구나! 이제 이 섬의 모두가 네 친구야. 고마워옹.';
  else if (rnd() < 0.35) l = `벌써 ${n}종이나 만났네! ${n >= 20 ? '정말 대단해옹.' : '천천히, 즐겁게 모아보자.'}`;
  else l = pick(NPC_TIPS);
  npc.line = l; npc.talkT = 5;
  const b = $('#bubble'); b.innerHTML = `<b>${npc.name}</b><br>${l}`; b.hidden = false;
}

/* ================= INPUT ================= */
const keys = {};
let camYaw = 0, started = false;
const touchMode = window.matchMedia('(pointer: coarse)').matches;
if (touchMode) { document.body.classList.add('touch'); document.querySelector('.touchOnly').hidden = false; }
window.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('#dex') && ev.code !== 'Escape' && ev.code !== 'KeyB') return;
  keys[ev.code] = true;
  if (ev.code === 'Space') { ev.preventDefault(); if (!ev.repeat) doAction(); }
  if (ev.code === 'Enter' && !started) { ev.preventDefault(); start(); }
  if (ev.code === 'KeyB' || ev.code === 'Tab') { ev.preventDefault(); if (started) openDex($('#dex').hidden); }
  if (ev.code === 'Escape') openDex(false);
  if (ev.code === 'KeyM') { initAudio(); setMute(!muted); }
  if (ev.code.startsWith('Arrow')) ev.preventDefault();
});
window.addEventListener('keyup', ev => { keys[ev.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let drag = { id: null, x: 0 };
canvas.addEventListener('pointerdown', ev => {
  canvas.focus();
  if (!started) return;
  if (ev.pointerType === 'touch' && ev.clientX < window.innerWidth * 0.5 && joy.id === null) {
    joy.id = ev.pointerId; joy.ox = ev.clientX; joy.oy = ev.clientY; joy.x = joy.y = 0;
    const j = $('#joy'); j.hidden = false; j.style.left = ev.clientX + 'px'; j.style.top = ev.clientY + 'px';
  } else if (drag.id === null) { drag.id = ev.pointerId; drag.x = ev.clientX; }
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerId === joy.id) {
    let dx = ev.clientX - joy.ox, dy = ev.clientY - joy.oy; const d = Math.hypot(dx, dy), mx = 55;
    if (d > mx) { dx *= mx / d; dy *= mx / d; }
    joy.x = dx / mx; joy.y = dy / mx; $('#joy i').style.transform = `translate(${dx}px,${dy}px)`;
  } else if (ev.pointerId === drag.id) { camYaw -= (ev.clientX - drag.x) * 0.006; drag.x = ev.clientX; }
});
const endPtr = ev => {
  if (ev.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; $('#joy').hidden = true; $('#joy i').style.transform = ''; }
  if (ev.pointerId === drag.id) drag.id = null;
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
$('#act').addEventListener('pointerdown', ev => { ev.preventDefault(); doAction(); });

function start() {
  if (started) return; started = true; initAudio(); $('#intro').hidden = true; canvas.focus();
  if (foundCount() === 0) setTimeout(() => toast('🍃', '#dff3e6', '솔솔섬에 온 걸 환영해요!', '집 앞의 고양이 모모에게 말을 걸어보세요.'), 600);
}
$('#startBtn').onclick = start;
if (foundCount() > 0) { $('#startBtn').textContent = `이어하기 (${foundCount()}/${DEXN})`; }

/* ================= MAIN LOOP ================= */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let last = performance.now(), spawnT = 0, saveT = 0, minuteAcc = 0, introT = 0;
for (let i = 0; i < 40; i++) manageSpawns();
updateCounts(); updateSky();

function angleLerp(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; }

function update(dt, now) {
  // time: 1 real second = 1 game minute
  if (started) {
    minuteAcc += dt;
    while (minuteAcc >= 1) { minuteAcc -= 1; save.min++; if (save.min >= 1440) { save.min -= 1440; save.day++; } }
  }
  updateSky();
  spawnT -= dt; if (spawnT <= 0) { spawnT = 0.8; manageSpawns(); }
  saveT -= dt; if (saveT <= 0) { saveT = 15; if (started) writeSave(); }

  // input
  let ix = 0, iy = 0, run = false;
  if (started && $('#dex').hidden) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    run = keys.ShiftLeft || keys.ShiftRight;
    if (joy.id !== null) { ix += joy.x; iy -= joy.y; if (Math.hypot(joy.x, joy.y) > 0.92) run = true; }
    if (keys.KeyQ) camYaw += dt * 1.8; if (keys.KeyE) camYaw -= dt * 1.8;
  }
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const moving = il > 0.12 && player.busy <= 0 && player.swing <= 0;
  if (moving && fishing) { if (fishing.sh) fishing.sh.hooked = false; endFishing(); }
  player.busy = Math.max(0, player.busy - dt);
  const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw), rtX = Math.cos(camYaw), rtZ = -Math.sin(camYaw);
  if (moving && !fishing) {
    const mx = fwdX * iy + rtX * ix, mz = fwdZ * iy + rtZ * ix;
    const spd = (run ? 7.2 : 4) * Math.min(1, il);
    player.rot = angleLerp(player.rot, Math.atan2(mx, mz), Math.min(1, dt * 12));
    const nx = player.x + mx * spd * dt, nz = player.z + mz * spd * dt;
    const ok = (x, z) => walkable(x, z) && colliders.every(c => Math.hypot(c.x - x, c.z - z) > c.r + 0.35);
    if (ok(nx, player.z)) player.x = nx; if (ok(player.x, nz)) player.z = nz;
    player.speed = spd; player.run = run && spd > 5;
    player.walkT += dt * spd * 2.4;
  } else { player.speed = 0; player.run = false; }

  // player visuals
  const gy = groundY(player.x, player.z);
  pg.position.set(player.x, gy, player.z); pg.rotation.y = player.rot;
  const sw = Math.sin(player.walkT);
  if (player.speed > 0) { pBody.position.y = Math.abs(sw) * 0.08; feet[0].position.z = 0.04 + sw * 0.2; feet[1].position.z = 0.04 - sw * 0.2; armL.rotation.x = sw * 0.6; pBody.rotation.z = sw * 0.04; }
  else { pBody.position.y = lerp(pBody.position.y, Math.sin(now * 0.002) * 0.02, 0.2); feet[0].position.z = feet[1].position.z = 0.04; armL.rotation.x *= 0.8; pBody.rotation.z *= 0.8; }
  if (player.swing > 0) {
    player.swing -= dt; const k = 1 - player.swing / 0.42;
    armR.rotation.x = lerp(-2.6, 1.4, smooth(0, 1, k)); armR.rotation.z = -0.3;
    if (k > 0.45 && !player.swingHit) { player.swingHit = true; resolveSwing(); }
    if (player.swing <= 0) { net.visible = false; armR.rotation.set(0, 0, 0); }
  } else if (fishing) { armR.rotation.x = fishing.phase === 'bite' ? -0.9 : -0.6; armR.rotation.z = 0; }
  else if (showcase) { armR.rotation.x = -2.8; armL.rotation.x = -2.8; }
  else if (player.speed > 0) armR.rotation.x = -sw * 0.6; else armR.rotation.x *= 0.8;

  if (showcase) {
    showcase.t += dt; const s = showcase;
    s.m.position.set(player.x, gy + 2.6 + Math.sin(s.t * 4) * 0.05, player.z); s.m.rotation.y += dt * 2;
    if (s.t > 1.5) { scene.remove(s.m); showcase = null; armL.rotation.x = 0; armR.rotation.x = 0; }
  }
  if (fishing) updateFishing(dt);

  // bugs
  for (const b of bugs.slice()) {
    b.t += dt; const m = b.m, e = b.e;
    b.alpha = Math.min(1, b.alpha + dt * 2);
    for (const w of m.userData.wings) w.rotation.z = Math.sin(b.t * (e.shape === 'bee' ? 50 : e.hab === 'air' ? 14 : 3)) * (e.hab === 'air' || e.shape === 'bee' ? 0.9 : 0.15) * (b.flee || e.hab === 'air' || e.shape === 'bee' ? 1 : (Math.sin(b.t * 0.7) > 0.8 ? 1 : 0.1));
    const dp = Math.hypot(m.position.x - player.x, m.position.z - player.z);
    if (!b.flee && ((player.run && dp < 4.5 && (e.r >= 2 || e.hab === 'beach')) || (dp < 1.2 && e.r >= 3 && player.speed > 0 && rnd() < dt * 0.4))) b.flee = 0.01;
    if (b.flee) {
      b.flee += dt; const ax = m.position.x - player.x, az = m.position.z - player.z, al = Math.hypot(ax, az) || 1;
      if (e.hab === 'beach' || e.hab === 'grass') { m.position.x += ax / al * dt * 5; m.position.z += az / al * dt * 5; m.position.y = heightAt(m.position.x, m.position.z) + (e.hab === 'grass' ? Math.abs(Math.sin(b.flee * 10)) * 0.4 : 0); m.scale.multiplyScalar(1 - dt * 0.8); }
      else { m.position.x += ax / al * dt * 4; m.position.z += az / al * dt * 4; m.position.y += dt * 4; }
      if (b.flee > 1.3) removeBug(b);
      continue;
    }
    if (e.hab === 'air') {
      b.ang += dt * b.spd;
      const x = b.ax + Math.cos(b.ang) * b.rad, z = b.az + Math.sin(b.ang) * b.rad * 0.7;
      const y = Math.max(groundY(x, z), 0) + b.hgt + Math.sin(b.t * 2.2) * 0.3;
      m.lookAt(x, y, z); m.position.set(x, y, z);
      if (e.glow) m.visible = e.shape !== 'firefly' || Math.sin(b.t * 2.5) > -0.6;
    } else if (e.hab === 'beach') {
      b.walk -= dt; if (b.walk <= 0) { b.walk = 1 + rnd() * 2; b.dir = rnd() * 6.28; b.move = rnd() < 0.6; }
      if (b.move) { const nx = b.x + Math.cos(b.dir) * dt * 0.7, nz = b.z + Math.sin(b.dir) * dt * 0.7; if (typeAt(nx, nz) === 'beach') { b.x = nx; b.z = nz; } else b.walk = 0; }
      m.position.set(b.x, heightAt(b.x, b.z), b.z); m.rotation.y = -b.dir;
    } else if (e.hab === 'grass') {
      const hop = (b.t % 3.2) < 0.4 ? Math.sin((b.t % 3.2) / 0.4 * Math.PI) * 0.3 : 0;
      m.position.y = b.y + hop;
    } else if (e.shape === 'snail' || e.shape === 'caterpillar') {
      m.rotation.y += dt * 0.15 * (e.hab === 'flower' ? 1 : 0);
    }
  }
  // shadows
  for (const s of shadows.slice()) {
    s.t += dt;
    if (s.gone) { s.alpha -= dt * 1.2; if (s.alpha <= 0) { removeShadow(s); continue; } }
    else s.alpha = Math.min(1, s.alpha + dt * 0.8);
    s.m.material.opacity = s.alpha * 0.38;
    if (!s.hooked && !s.gone) {
      const dx = s.tx - s.x, dz = s.tz - s.z, d = Math.hypot(dx, dz);
      if (d < 0.2 || s.t > 6) {
        s.t = 0; for (let k = 0; k < 8; k++) { const a = rnd() * 6.28, r = 1 + rnd() * 3; const tx = s.x + Math.cos(a) * r, tz = s.z + Math.sin(a) * r; const ok = s.pool === 'pond' ? Math.hypot(tx - POND.x, tz - POND.z) < 3.6 : (isWater(tx, tz) && heightAt(tx, tz) < -0.35); if (ok) { s.tx = tx; s.tz = tz; break; } }
      } else { const sp = 0.45 * dt; s.x += dx / d * sp; s.z += dz / d * sp; s.m.rotation.z = Math.atan2(-dx, -dz) + Math.PI; }
    }
    s.m.position.set(s.x, s.y, s.z);
  }
  // pickups
  for (const p of picks) { p.t += dt; p.sp.position.y = p.y + (p.e.cat === 'flower' ? 1.3 : 0.7) + Math.sin(p.t * 2.5) * 0.1; p.sp.rotation.y += dt * 2; }
  // ripples
  for (const r of ripples.slice()) { r.userData.t += dt; const k = r.userData.t; r.scale.setScalar(1 + k * 4 * r.userData.big); r.material.opacity = Math.max(0, 0.8 - k * 1.2); if (k > 0.7) { scene.remove(r); ripples.splice(ripples.indexOf(r), 1); } }
  // sea waves
  const sp = seaGeo.attributes.position, T = now * 0.001;
  for (let i = 0; i < sp.count; i++) { const x = seaBase[i * 3], z = seaBase[i * 3 + 2]; sp.setY(i, Math.sin(x * 0.35 + T * 1.2) * 0.06 + Math.cos(z * 0.3 + T) * 0.06); }
  sp.needsUpdate = true; seaGeo.computeVertexNormals();
  for (const c of clouds) { c.position.x += c.userData.sp * dt; if (c.position.x > 80) c.position.x = -80; }
  // npc
  const tail = ng.userData.tail; tail.rotation.z = 0.5 + Math.sin(now * 0.003) * 0.3;
  ng.rotation.y = angleLerp(ng.rotation.y, nearNpc() ? Math.atan2(player.x - npc.x, player.z - npc.z) : 0.6, dt * 4);
  if (npc.talkT > 0) { npc.talkT -= dt; placeAt($('#bubble'), npc.x, heightAt(npc.x, npc.z) + 1.7, npc.z); if (npc.talkT <= 0 || !nearNpc()) { npc.talkT = 0; $('#bubble').hidden = true; } }

  // camera
  if (!started) { introT += dt; camYaw = introT * 0.08; }
  const D = started ? 11 : 30, H = started ? 12 : 20;
  const tgt = started ? new THREE.Vector3(player.x, gy, player.z) : new THREE.Vector3(0, 0, 0);
  camPos.set(tgt.x + Math.sin(camYaw) * D, tgt.y + H, tgt.z + Math.cos(camYaw) * D);
  camera.position.lerp(camPos, started ? Math.min(1, dt * 5) : 1);
  camLook.lerp(new THREE.Vector3(tgt.x, tgt.y + 1, tgt.z), started ? Math.min(1, dt * 6) : 1);
  camera.lookAt(camLook);
  const sd = sun.userData.dir; sun.position.set(player.x + sd.x, sd.y, player.z + sd.z); sun.target.position.set(player.x, 0, player.z);

  // hint
  if (started) {
    const a = currentAction(); const h = $('#hint');
    h.innerHTML = touchMode ? a : `<kbd>Space</kbd>${a}`; h.style.opacity = $('#dex').hidden ? 1 : 0;
    $('#act').textContent = a.length > 5 ? a.slice(0, 4) : a;
    if (a === '잠자리채 휘두르기') $('#act').textContent = '휘두르기';
  }
  musicTick(now / 1000);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__solsol = { player, bugs, picks, shadows, DOCK, get fishing() { return fishing; }, save };
window.addEventListener('beforeunload', writeSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });
})();
</script>
