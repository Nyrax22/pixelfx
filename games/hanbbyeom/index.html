<!doctype html><!--wrap-->
<html lang="ko"><!--wrap-->
<head><!--wrap-->
<meta charset="utf-8"><!--wrap-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><!--wrap-->
<title>한뼘 정원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: the garden fills the screen; every piece of UI is a scrap of sketch paper taped on top, drawn in pencil. */
:root{
  --paper:#fbf6ea;     /* sketch paper */
  --paper2:#f1e9d6;    /* paper shade */
  --graphite:#3a3330;  /* pencil lines, text */
  --soft:#8a8078;      /* faint pencil */
  --moss:#5f8f4e;      /* good-distance green */
  --blush:#e2735f;     /* too-close warning */
  --gold:#d9a63a;      /* special moment */
  --tape:rgba(214,196,150,.55);
  --hand:"Nanum Pen Script","Gaegu",cursive,system-ui;
  --ui:"Gaegu","Nanum Pen Script",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe8e6;color:var(--graphite);font-family:var(--ui);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;}
button{font-family:var(--ui);color:var(--graphite);cursor:pointer;}
button:focus-visible{outline:3px dashed var(--gold);outline-offset:3px;}

.scrap{background:var(--paper);border-radius:3px 6px 4px 7px;box-shadow:0 2px 0 rgba(58,51,48,.12),0 6px 14px rgba(58,51,48,.12);position:relative;}
.scrap::before{content:"";position:absolute;top:-8px;left:50%;width:46px;height:16px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);}
#phase{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px 14px 6px;font-size:21px;font-weight:700;transform:rotate(-1.5deg);display:flex;gap:8px;align-items:baseline;}
#phase small{font-family:var(--hand);font-size:19px;font-weight:400;color:var(--soft);}
#topR{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;}
.pbtn{border:0;padding:8px 14px 6px;font-size:20px;font-weight:700;display:flex;gap:6px;align-items:center;}
.pbtn:nth-child(2){transform:rotate(1.2deg);}
.pbtn:active{transform:translateY(2px);}
#bookBtn b{color:var(--moss);}

#sk{position:fixed;z-index:6;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-.6deg);width:min(380px,calc(100% - 32px));padding:12px 16px 12px 84px;min-height:64px;box-sizing:border-box;}
#sk .ring{position:absolute;left:12px;top:50%;margin-top:-30px;width:60px;height:60px;}
#sk .ring circle{fill:none;stroke-linecap:round;}
#sk .nm{font-size:22px;font-weight:700;line-height:1;display:flex;gap:8px;align-items:baseline;}
#sk .nm .sp{font-family:var(--hand);font-size:19px;font-weight:400;color:var(--gold);}
.gauge{position:relative;height:12px;margin:8px 0 4px;border-radius:6px;overflow:hidden;display:flex;border:1.5px solid var(--graphite);}
.gauge i{display:block;height:100%;}
.gauge .g1{background:repeating-linear-gradient(-45deg,#f0b8a8 0 4px,#f7d4c8 4px 8px);}
.gauge .g2{background:repeating-linear-gradient(-45deg,#b9d8a2 0 4px,#d4e8c4 4px 8px);}
.gauge .g3{background:var(--paper2);flex:1;}
.gauge b{position:absolute;top:-3px;width:4px;height:18px;margin-left:-2px;background:var(--graphite);border-radius:2px;transition:left .08s linear;}
#sk .msg{font-family:var(--hand);font-size:21px;line-height:1.1;color:var(--soft);}
#sk .msg.warn{color:var(--blush);}
#sk .msg.ok{color:var(--moss);}
#sk .nerv{position:absolute;right:12px;top:10px;font-size:18px;opacity:0;transition:opacity .2s;}

#toast{position:fixed;z-index:8;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px) rotate(1deg);opacity:0;transition:transform .4s cubic-bezier(.2,1.4,.4,1),opacity .25s;width:min(340px,calc(100% - 32px));padding:12px;display:flex;gap:12px;align-items:center;pointer-events:none;}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(1deg);}
#toast img{width:84px;height:84px;flex:none;border:1px solid var(--paper2);background:var(--paper);}
#toast .t{font-size:22px;font-weight:700;line-height:1.1;}
#toast .d{font-family:var(--hand);font-size:19px;line-height:1.15;color:var(--soft);margin-top:4px;}
.newtag{font-family:var(--hand);color:var(--blush);font-size:20px;margin-left:4px;}
.sptag{font-family:var(--hand);color:var(--gold);font-size:20px;margin-left:4px;}

#hint{position:fixed;z-index:5;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--hand);font-size:23px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;}
#hint kbd{font-family:var(--ui);font-weight:700;font-size:16px;background:var(--paper);color:var(--graphite);border-radius:4px;padding:1px 7px;margin:0 4px;text-shadow:none;}

/* touch */
#joy{position:fixed;z-index:4;width:120px;height:120px;border-radius:50%;border:2.5px dashed rgba(255,255,255,.8);transform:translate(-50%,-50%);pointer-events:none;}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(251,246,234,.92);}
.tbtn{position:fixed;z-index:5;display:none;width:76px;height:76px;border-radius:50%;border:2.5px solid var(--graphite);background:var(--paper);font-size:19px;font-weight:700;}
.touch .tbtn{display:block;}
#jumpBtn{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));}
#skBtn{right:calc(max(18px,env(safe-area-inset-right,0px)) + 88px);bottom:calc(46px + env(safe-area-inset-bottom,0px));background:#e9f2dc;}
.touch #sk{bottom:calc(118px + env(safe-area-inset-bottom,0px));}
.touch #hint{bottom:calc(118px + env(safe-area-inset-bottom,0px));}
.touch .kb{display:none;}
.keys.notouch{display:none;}
.touch .keys.notouch{display:grid;}

/* overlays */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(58,51,48,.28);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));}
.intro{width:min(420px,100%);padding:28px 26px 22px;text-align:center;transform:rotate(-1deg);}
.intro h1{margin:0;font-family:var(--hand);font-weight:400;font-size:72px;line-height:.9;}
.intro h1 em{font-style:normal;color:var(--moss);}
.intro .sub{font-family:var(--hand);font-size:23px;line-height:1.2;color:var(--soft);margin:12px 0 18px;}
.bigbtn{border:2.5px solid var(--graphite);background:#e9f2dc;border-radius:30px 26px 32px 24px;padding:10px 26px 8px;font-size:24px;font-weight:700;}
.bigbtn:active{transform:translateY(2px);}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;text-align:left;margin:18px auto 0;max-width:300px;font-size:17px;}
.keys kbd{font-family:var(--ui);font-weight:700;background:var(--paper2);border-radius:4px;padding:0 7px;justify-self:start;white-space:nowrap;}

#book .page{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,rgba(120,150,180,.16) 31px 32px);border-radius:4px 8px 6px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.bhead{display:flex;align-items:center;gap:12px;padding:16px 18px 6px;flex-wrap:wrap;}
.bhead h2{margin:0;font-family:var(--hand);font-weight:400;font-size:40px;line-height:1;flex:1;min-width:0;}
.bstat{font-size:18px;color:var(--soft);}
.bstat b{color:var(--graphite);}
.bstat .g{color:var(--gold);}
.closeb{border:2px solid var(--graphite);background:var(--paper);border-radius:20px;padding:4px 14px 2px;font-size:19px;font-weight:700;}
.btabs{display:flex;gap:4px;padding:4px 18px 0;overflow-x:auto;border-bottom:2px solid var(--graphite);}
.btab{border:2px solid var(--graphite);border-bottom:0;background:var(--paper2);border-radius:10px 10px 0 0;padding:5px 12px 3px;font-size:18px;font-weight:700;white-space:nowrap;margin-bottom:-2px;}
.btab[aria-selected="true"]{background:var(--paper);}
.btab small{font-weight:400;color:var(--soft);margin-left:4px;}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px 18px;overflow-y:auto;min-height:0;flex:1;}
.card{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;}
.card .pic{position:relative;width:100%;aspect-ratio:1;background:var(--paper);box-shadow:0 1px 0 rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.08);transform:rotate(var(--r,0deg));}
.card .pic img{width:100%;height:100%;display:block;}
.card .pic .blank{position:absolute;inset:14%;border:2px dashed #cfc5b2;border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-size:20px;color:#b9ae98;text-align:center;line-height:1.05;padding:6px;}
.card .pic .spm{position:absolute;right:6px;bottom:4px;font-size:18px;color:#d8cfbd;}
.card .pic .spm.on{color:var(--gold);}
.card .nm{font-size:19px;font-weight:700;}
.card .nm.lock{color:#b9ae98;}
.card[aria-pressed="true"] .pic{outline:2.5px solid var(--moss);outline-offset:3px;}
.bdetail{border-top:2px dashed #cfc5b2;padding:12px 18px 16px;display:flex;gap:14px;align-items:flex-start;min-height:96px;}
.bdetail .pics{display:flex;gap:8px;flex:none;}
.bdetail .pics img,.bdetail .pics .ph{width:96px;height:96px;background:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.12);}
.bdetail .pics .ph{display:grid;place-items:center;font-family:var(--hand);font-size:18px;color:#b9ae98;border:2px dashed #d8cfbd;box-sizing:border-box;box-shadow:none;}
.bdetail h3{margin:0;font-size:24px;}
.bdetail .note{font-family:var(--hand);font-size:22px;line-height:1.2;margin:4px 0 0;}
.bdetail .meta{font-size:15px;color:var(--soft);margin-top:4px;}
.bdetail .spn{font-family:var(--hand);font-size:20px;color:var(--gold);margin-top:2px;}
@media (max-width:520px){
  #phase{font-size:17px;} #phase small{font-size:16px;}
  .pbtn{font-size:16px;padding:6px 10px 4px;}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .bdetail{flex-direction:column;}
  .intro h1{font-size:60px;}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}
</style>
</head><!--wrap-->
<body><!--wrap-->
<canvas id="game" tabindex="0" aria-label="한뼘 정원 3D 화면"></canvas>

<div id="phase" class="scrap"><span id="phIc">🌿</span><span id="phTxt">이슬 아침</span><small id="dayTxt">첫 번째 하루</small></div>
<div id="topR">
  <button class="pbtn scrap" id="muteBtn" aria-label="소리 켜기/끄기">🔈</button>
  <button class="pbtn scrap" id="bookBtn">📒 스케치북 <b id="bookCount">0/31</b></button>
</div>
<div id="hint" hidden></div>
<div id="sk" class="scrap" hidden>
  <svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="25" stroke="#e6dcc8" stroke-width="5"/><circle id="skArc" cx="30" cy="30" r="25" stroke="#3a3330" stroke-width="5" stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 30 30)"/><text x="30" y="37" text-anchor="middle" font-size="20">✏️</text></svg>
  <div class="nm"><span id="skName">???</span><span class="sp" id="skSp" hidden>✦ 특별한 순간!</span></div>
  <div class="gauge"><i class="g1" id="g1"></i><i class="g2" id="g2"></i><i class="g3"></i><b id="gMark"></b></div>
  <div class="msg" id="skMsg"></div>
  <div class="nerv" id="skNerv">💦</div>
</div>
<div id="toast" class="scrap" role="status" aria-live="polite"><img alt=""><div><div class="t"></div><div class="d"></div></div></div>
<div id="joy" hidden><i></i></div>
<button class="tbtn" id="skBtn" aria-label="스케치 (누르고 있기)">스케치</button>
<button class="tbtn" id="jumpBtn" aria-label="점프 (누르고 있으면 활강)">점프</button>

<div class="overlay" id="intro">
  <div class="intro scrap">
    <h1>한뼘 <em>정원</em></h1>
    <p class="sub">손가락 한 마디만큼 작아진 오후.<br>정원에 사는 작은 이웃들을<br>스케치북에 한 장씩 담아보세요.</p>
    <button class="bigbtn" id="startBtn">스케치북 펼치기</button>
    <div class="keys kb">
      <kbd>WASD · 방향키</kbd><span>걷기 · Shift 달리기</span>
      <kbd>Space</kbd><span>점프 · 공중에서 꾹 누르면 활강</span>
      <kbd>E 꾹 누르기</kbd><span>가까운 친구 스케치하기</span>
      <kbd>B</kbd><span>스케치북</span>
      <kbd>드래그 · Q/E</kbd><span>둘러보기</span>
    </div>
    <div class="keys notouch">
      <kbd>왼쪽 화면</kbd><span>조이스틱</span>
      <kbd>점프</kbd><span>공중에서 꾹 누르면 활강</span>
      <kbd>스케치</kbd><span>꾹 누르고 있기</span>
      <kbd>오른쪽 드래그</kbd><span>둘러보기</span>
    </div>
  </div>
</div>

<div class="overlay" id="book" hidden>
  <div class="page" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <div class="bhead"><h2 id="bookTitle">나의 정원 스케치북</h2><span class="bstat" id="bStat"></span><button class="closeb" id="bookClose">닫기</button></div>
    <div class="btabs" role="tablist" id="bTabs"></div>
    <div class="bgrid" id="bGrid"></div>
    <div class="bdetail" id="bDetail"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rnd = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = (arr, r = rnd) => arr[(r() * arr.length) | 0];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wr = mulberry32(20261112); // world layout is the same on every visit

/* ================= FIELD GUIDE DATA ================= */
const BOOKS = [
  { id: 'ground', name: '땅', ic: '🍂' }, { id: 'flower', name: '꽃과 잎', ic: '🌼' },
  { id: 'water', name: '물웅덩이', ic: '💧' }, { id: 'night', name: '밤', ic: '🌙' }, { id: 'find', name: '주운 것', ic: '🧺' },
];
const ZONE = { trail: '개미길', soil: '맨흙', lawn: '잔디숲', mush: '버섯 위', leaf: '잎 위', flower: '꽃 위', air: '꽃 사이 하늘', stem: '꽃줄기', web: '거미줄', pond: '물웅덩이 위', lily: '물 위 잎', under: '물속', ground: '땅 위' };
const TIMEN = { all: '언제나', day: '해 있을 때', morning: '이슬 아침', night: '밤' };
const E = (id, book, name, shape, col, s, zone, move, time, r, desc, sp, o) => Object.assign({ id, book, name, shape, col, s, zone, move, time, r, desc, sp }, o || {});
const DEX = [
  E('c01','ground','개미','ant',0x3a2a22,1.6,'trail','trail','all',1,'설탕 한 조각을 향해 줄지어 걷는다. 서로 더듬이를 톡톡 맞대며 길을 묻는 것 같다.','먹이를 이고 가는 순간'),
  E('c02','ground','공벌레','pillbug',0x6f7a86,1.5,'soil','walk','all',1,'갑옷 같은 등껍질이 일곱 마디. 내가 다가가도 모른 척 느릿느릿 걸어간다.','동그랗게 몸을 마는 순간'),
  E('c03','ground','달팽이','snail',0xc9945e,2.2,'mush','perch','all',1,'버섯 위에서 낮잠 중. 지나간 자리에 은빛 길이 반짝인다.','더듬이를 쭉 뻗는 순간'),
  E('c05','ground','메뚜기','grasshopper',0x86c24a,3,'lawn','hop','day',1,'풀잎이랑 똑같은 색이라 한참을 찾았다. 뒷다리가 내 키보다 길다!','뒷다리로 노래하는 순간'),
  E('c06','ground','지렁이','worm',0xe39a9a,4,'soil','walk','morning',2,'이슬 내린 아침에만 흙 위로 나온다. 흙을 보드랍게 만드는 정원사.','고개를 쭉 드는 순간'),
  E('c22','ground','참새','sparrow',0xa0704a,14,'lawn','hop','day',3,'산처럼 커다란 새가 내려앉았다. 숨을 꾹 참고 그렸다. 깃털 하나가 이불만 하다.','깃털을 부풀리는 순간',{fly:true}),

  E('c04','flower','무당벌레','ladybug',0xe8423a,1.7,'leaf','perch','day',1,'반들반들한 빨간 등에 까만 점 일곱. 잎 끝까지 걸어가더니 멈춰 섰다.','날개를 펼치는 순간',{fly:true}),
  E('c07','flower','꿀벌','bee',0xffc23a,2.4,'flower','perch','day',1,'꽃 한가운데에 얼굴을 파묻고 바쁘다. 날갯소리가 바람처럼 크게 들린다.','꽃가루 경단을 빚는 순간',{fly:true}),
  E('c08','flower','호박벌','bumble',0x2a2420,3.2,'flower','perch','day',3,'털이 보송보송한 커다란 벌. 무서울 줄 알았는데 느긋하고 다정하다.','엉덩이를 흔드는 순간',{fly:true}),
  E('c09','flower','배추흰나비','butterfly',0xf6f3ea,4.5,'flower','perch','day',1,'날개를 접으면 꽃잎 한 장 같다. 꽃에서 꽃으로 소풍을 다닌다.','날개를 활짝 펴는 순간',{fly:true,wing2:0x9a9a9a}),
  E('c10','flower','호랑나비','butterfly',0xffd84a,7,'air','fly','day',3,'노란 날개에 까만 줄무늬. 하늘을 천천히 노 저으며 지나간다.','꽃에 내려앉는 순간',{fly:true,wing2:0x2a2420,tails:true}),

  if (seenCount() === 0) setTimeout(() => toast(null, '정원에 온 걸 환영해요', '저기 개미 행렬이 보이죠? 가까이 가서 E를 꾹 눌러 첫 스케치를 해봐요.'), 700);
}
$('#startBtn').onclick = start;
if (seenCount() > 0) $('#startBtn').textContent = `이어서 그리기 (${seenCount()}/${DEX.length})`;

/* ================= LOOP ================= */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmpV = new THREE.Vector3();
let last = performance.now(), mT = 0, saveT = 0, introT = 0;
for (let i = 0; i < 50; i++) manage();
updateSky(); updateCount();
camera.position.set(0, 40, 70); camLook.set(0, 2, 0);

function update(dt, now) {
  if (started) { save.t += dt / DAY_LEN; if (save.t >= 1) { save.t -= 1; save.day++; } }
  updateSky();
  mT -= dt; if (mT <= 0) { mT = 0.7; manage(); }
  saveT -= dt; if (saveT <= 0) { saveT = 15; if (started) writeSave(); }
  grassTime.value = now * 0.001;

  // input
  let ix = 0, iy = 0, run = false;
  const active = started && $('#book').hidden;
  if (active) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    run = keys.ShiftLeft || keys.ShiftRight;
    if (joy.id !== null) { ix += joy.x; iy -= joy.y; if (Math.hypot(joy.x, joy.y) > 0.95) run = true; }
    if (keys.KeyQ) camYaw += dt * 1.8;
  }
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  if (sketch.held) run = false;
  const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw), rtX = Math.cos(camYaw), rtZ = -Math.sin(camYaw);
  const prevY = P.y; P.speed = 0; P.run = false;
  if (il > 0.1 && active) {
    const mx = fwdX * iy + rtX * ix, mz = fwdZ * iy + rtZ * ix;
    const spd = (sketch.held ? 2.4 : run ? 9 : 5.2) * Math.min(1, il);
    if (!sketch.held) P.rot = angLerp(P.rot, Math.atan2(mx, mz), dt * 12);
    const nx = P.x + mx * spd * dt, nz = P.z + mz * spd * dt;
    if (!blocked(nx, P.z, P.y)) P.x = nx; if (!blocked(P.x, nz, P.y)) P.z = nz;
    P.speed = spd; P.run = run && P.grounded; P.walkT += dt * spd * 2.2;
  }
  if (sketch.held && sketch.target) { const t = sketch.target.m.position; P.rot = angLerp(P.rot, Math.atan2(t.x - P.x, t.z - P.z), dt * 8); }
  // vertical
  if (jumpQueued && P.grounded && active) { P.vy = 10.5; P.grounded = false; SFX.jump(); }
  jumpQueued = false;
  P.vy -= 24 * dt;
  P.glide = !P.grounded && jumpHeld && P.vy < 0 && active;
  if (P.glide) P.vy = Math.max(P.vy, -2.3);
  P.y += P.vy * dt;
  const f = floorAt(P.x, P.z, Math.max(prevY, P.y));
  if (P.y <= f.y || (P.grounded && P.vy <= 0 && P.y - f.y < 0.45)) {
    if (!P.grounded && P.vy < -6) SFX.land();
    P.y = f.y; P.vy = 0; P.grounded = true;
    if (f.water) { SFX.splash(); ripple(P.x, PUD.y, P.z, 2); P.x = P.safe.x; P.z = P.safe.z; P.y = floorAt(P.x, P.z, 60).y; toast(null, '첨벙!', '물웅덩이엔 떠 있는 잎을 밟고 건너가요.'); }
    else { P.safe.x = P.x; P.safe.z = P.z; }
  } else P.grounded = false;

  // player visuals
  pg.position.set(P.x, P.y, P.z); pg.rotation.y = P.rot;
  const sw = Math.sin(P.walkT), moving = P.speed > 0 && P.grounded;
  pBody.position.y = moving ? Math.abs(sw) * 0.07 : lerp(pBody.position.y, 0, 0.2);
  feet[0].position.z = 0.03 + (moving ? sw * 0.18 : 0); feet[1].position.z = 0.03 - (moving ? sw * 0.18 : 0);
  arms[0].rotation.x = sketch.held ? -1.1 : P.glide ? -2.8 : moving ? sw * 0.6 : 0; arms[1].rotation.x = sketch.held ? -0.9 : P.glide ? -2.8 : moving ? -sw * 0.6 : 0;
  chute.visible = P.glide; if (P.glide) chute.rotation.y += dt * 1.5;
  pBody.rotation.x = P.grounded ? 0 : P.glide ? 0.1 : -0.15;

  for (const c of crits.slice()) updateCrit(c, dt);
  // finds
  for (const fd of finds.slice()) {
    fd.t += dt; fd.sp.position.y = fd.y + fd.e.s * 0.5 + 0.6 + Math.sin(fd.t * 2.4) * 0.15; fd.sp.material.opacity = 0.6 + Math.sin(fd.t * 3) * 0.3;
    if (Math.hypot(fd.x - P.x, fd.z - P.z) < 1.2 + fd.e.s * 0.25 && Math.abs(fd.y - P.y) < 1.8 && started) { removeFind(fd); SFX.pick(); record(fd.e, false); }
  }
  for (const r of ripples.slice()) { r.userData.t += dt; const k = r.userData.t; r.scale.setScalar(r.userData.s * (1 + k * 3)); r.material.opacity = Math.max(0, 0.7 - k * 0.8); if (k > 0.9) { scene.remove(r); ripples.splice(ripples.indexOf(r), 1); } }
  const ap = ambGeo.attributes.position; for (let i = 0; i < ap.count; i++) { ap.setY(i, ambBase[i * 3 + 1] + Math.sin(now * 0.0008 + i) * 0.6); ap.setX(i, ambBase[i * 3] + Math.sin(now * 0.0005 + i * 2) * 0.8); } ap.needsUpdate = true;
  dust.position.set(P.x, 0, P.z); dust.rotation.y += dt * 0.02;

  const tgt = updateSketch(dt);
  // hint
  const hint = $('#hint');
  if (started && $('#sk').hidden && $('#book').hidden) {
    const near = finds.find(fd => Math.hypot(fd.x - P.x, fd.z - P.z) < 6);
    hint.hidden = !near && P.grounded; hint.innerHTML = !P.grounded ? (P.glide ? '민들레 씨앗으로 둥실둥실~' : (touchMode ? '점프를 꾹 누르면 활강해요' : '<kbd>Space</kbd>를 꾹 누르면 활강해요')) : near ? '반짝이는 게 있어요. 가까이 가서 주워봐요' : '';
  } else hint.hidden = true;

  // camera
  if (!started) { introT += dt; camYaw = introT * 0.06; }
  const D = started ? (sketch.held ? 7 : 8.5) : 62, cp = started ? camPitch : 0.55;
  const ty = started ? P.y + 1.4 : 4;
  const tx = started ? P.x : 0, tz = started ? P.z : 0;
  camPos.set(tx + Math.sin(camYaw) * Math.cos(cp) * D, ty + Math.sin(cp) * D, tz + Math.cos(camYaw) * Math.cos(cp) * D);
  camPos.y = Math.max(camPos.y, floorAt(camPos.x, camPos.z, camPos.y).y + 0.6);
  camera.position.lerp(camPos, started ? Math.min(1, dt * 6) : 1);
  tmpV.set(tx, ty, tz);
  if (started && sketch.held && tgt) tmpV.lerp(tgt.m.position, 0.35);
  camLook.lerp(tmpV, started ? Math.min(1, dt * 7) : 1); camera.lookAt(camLook);
  const sd = sun.userData.dir; sun.position.set(P.x + sd.x, sd.y, P.z + sd.z); sun.target.position.set(P.x, 0, P.z);
  soundTick(now / 1000);
}
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt, now); renderer.render(scene, camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__hb = { P, crits, finds, save, sketch, sketchOf, byId };
window.addEventListener('beforeunload', writeSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });
})();
</script>
